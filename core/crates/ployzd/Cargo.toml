[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bollard = { version = "0.21.0", features = ["json_data_content"] }
bytes = "1.12.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
defguard_wireguard_rs = "=0.8.0"
hkdf = "0.12.4"
hpke = { version = "0.13.0", default-features = false, features = ["x25519", "alloc"] }
netlink-packet-wireguard = "=0.2.4"
fastrand = "2.5.0"
fs2 = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
hickory-server = "0.26.1"
hex = "0.4.3"
http = "1.4.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
inotify.workspace = true
instant-acme = "0.8.5"
listenfd = "1.0.2"
memchr = "2.8.3"
nix = { version = "0.29.0", default-features = false, features = ["dir", "fs", "feature"] }
ipnet = "2.12.1"
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
ployz-core.workspace = true
ployz-build.workspace = true
rand_core = { version = "0.9.5", features = ["os_rng"] }
rcgen = "0.14.6"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
url = "2.5.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
sd-notify = { version = "0.5.0", features = ["fdstore"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
sha2 = "0.11.0"
sha2-0-10 = { package = "sha2", version = "0.10.9", default-features = false }
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
toml = "1.1.4"
tonic = { version = "0.13.1", features = ["gzip", "transport"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"
zeroize = "1.9.0"

[features]
verify-faults = []

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http2"] }
iroh = { version = "1.2", default-features = false, features = ["tls-ring", "test-utils"] }
ployz = { path = "../ployz" }
ployz-store.workspace = true
ployz-testkit.workspace = true
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-rustls = { version = "0.26.4", default-features = false }
uuid = "1.24.0"

[lints]
workspace = true
