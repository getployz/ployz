[package]
name = "ployz-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
ipnet = { version = "2.12.1", features = ["serde"] }
oci-spec = { version = "0.9.0", default-features = false, features = ["distribution"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
prost = "0.13.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
semver = "1.0.28"
thiserror = "2.0.20"
ts-rs.workspace = true
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
minisign-verify = "0.3.0"
zeroize = "1.9.0"

[features]
# A throwaway Sealing keypair that opens what `seal_value` sealed, for tests only.
test-keypair = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
hpke = { version = "0.13.0", default-features = false, features = ["x25519", "alloc"] }
rand_core = { version = "0.9.5", features = ["os_rng"] }
reqwest = { version = "0.13.4", default-features = false }
sha2-0-10 = { package = "sha2", version = "0.10.9", default-features = false }
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
tonic ={ version = "0.13.1", features = ["transport"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.24.0", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
tempfile = "3.27.0"

[build-dependencies]
tonic-build = { version = "0.13.1", default-features = false, features = ["transport"] }

[lints]
workspace = true
