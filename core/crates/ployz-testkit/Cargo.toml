[package]
name = "ployz-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
ployz-core.workspace = true
rcgen = { version = "0.14.6", features = ["x509-parser"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.13.1", features = ["transport"] }

[lints]
workspace = true
