disallowed-methods = [
    { path = "ployz_core::error_chain::inline", reason = "keep the cause chain: Failure::caused or .context, or ployz_core::error_chain::row" },
    { path = "std::io::stdout", reason = "write through crate::ui, whose stdout masks URL user info and dies of SIGPIPE when the reader is gone" },
    { path = "anstream::stdout", reason = "write through crate::ui, whose stdout masks URL user info and dies of SIGPIPE when the reader is gone" },
    { path = "tokio::io::stdout", reason = "write through crate::ui, whose stdout masks URL user info" },
    { path = "std::io::stderr", reason = "write through crate::ui, whose stderr masks URL user info" },
    { path = "anstream::stderr", reason = "write through crate::ui, whose stderr masks URL user info" },
    { path = "tokio::io::stderr", reason = "write through crate::ui, whose stderr masks URL user info" },
    { path = "console::Term::stderr", reason = "write through crate::ui, whose stderr masks URL user info" },
    { path = "console::Term::buffered_stderr", reason = "write through crate::ui, whose stderr masks URL user info" },
    { path = "console::Term::stdout", reason = "write through crate::ui, whose stdout masks URL user info" },
    { path = "console::Term::buffered_stdout", reason = "write through crate::ui, whose stdout masks URL user info" },
    { path = "clap_builder::error::Error::exit", reason = "print clap's render through crate::ui::stderr, which masks URL user info" },
    { path = "clap_builder::error::Error::print", reason = "print clap's render through crate::ui::stderr, which masks URL user info" },
    { path = "ployz::ui::stream::relayed_stdout", reason = "passes bytes on unmasked: only what another program or a file wrote, byte for byte; name why" },
    { path = "ployz::ui::stream::relayed_stderr", reason = "passes bytes on unmasked: only what another program wrote, byte for byte; name why" },
    { path = "ployz::ui::stream::child_stderr", reason = "a child writes on stderr unmasked: only a program whose own output that is; name why" },
    { path = "ployz::ui::stream::async_stdout", reason = "unmasked: only the MCP server's JSON-RPC stream; name why" },
    { path = "clap::Command::print_help", reason = "print clap's render_help through crate::ui so a closed stdout dies of SIGPIPE" },
    { path = "ployz_core::Hint::from_details", reason = "reads hints another process wrote, a retry among them; a hint this CLI gives is typed: a retry comes from crate::cli::Rerun" },
    { path = "ployz_core::RetryCommand::rendered", reason = "build a retry from the command line clap parsed: crate::cli::Rerun, which keeps the flags given and withholds secrets" },
    { path = "ployz::cli::shown::Shown::verbatim", allow-invalid = true, reason = "a Shown never comes from text: output repeats a value only once it parsed into a Public type, else its placeholder" },
    { path = "clap::Command::print_long_help", reason = "print clap's render_long_help through crate::ui so a closed stdout dies of SIGPIPE" },
]
