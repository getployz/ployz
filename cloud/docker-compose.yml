services:
  postgres:
    image: postgres:16-alpine
    container_name: ployz-cloud-postgres
    command:
      - -c
      - listen_addresses=*
    ports:
      - '8394:5432'
    environment:
      POSTGRES_DB: ployz_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d ployz_cloud' ]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest
    container_name: ployz-cloud-inngest
    network_mode: host
    command:
      - inngest
      - dev
      - -u
      - https://ployz-cloud.localhost/api/inngest

  relay:
    image: ghcr.io/getployz/ployz-relay:v0.1.2-beta.17
    container_name: ployz-cloud-relay
    ports:
      - '50051:50051'
    environment:
      PLOYZ_RELAY_LISTEN: 0.0.0.0:50051
      PLOYZ_RELAY_DIAL_CREDENTIAL: ${PLOYZ_RELAY_DIAL_CREDENTIAL:-pdial_local-dev}

volumes:
  postgres-data:
