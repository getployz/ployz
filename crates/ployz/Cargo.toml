[package]
name = "ployz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
base64 = "0.22"
bytes.workspace = true
clap.workspace = true
defguard_wireguard_rs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
gotatun.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnetwork.workspace = true
ployz-core.workspace = true
ployz-host-runner.workspace = true
ployz-telemetry.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smoltcp.workspace = true
thiserror.workspace = true
tempfile = "3"
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wait-timeout.workspace = true

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14.8", features = ["crypto", "pem"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[[bin]]
name = "ployz"
path = "src/main.rs"
