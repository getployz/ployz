[package]
name = "ployz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["service"] }
base64 = "0.22"
bollard = { version = "=0.21.0", default-features = false, features = ["http", "pipe", "ssl_providerless"] }
clap.workspace = true
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-util.workspace = true
nuid.workspace = true
ployz-core.workspace = true
ployz-build-executor.workspace = true
ployz-host-runner.workspace = true
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
ployz-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
shell-words = "1"
tar = "0.4.45"
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
wait-timeout.workspace = true

[dev-dependencies]
ployz-test-support.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[[bin]]
name = "ployz"
path = "src/main.rs"
