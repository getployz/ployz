name: fixture_kitchen_sink
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 2
      mode: replicated
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "true"]
    volumes:
      - data:/data
    x-ports:
      - auto:web:8080
    profiles:
      - prod
    mystery_option: true
