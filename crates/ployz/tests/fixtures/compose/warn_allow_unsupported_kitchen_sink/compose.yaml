name: fixture_kitchen_sink
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 2
      mode: global
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "true"]
    volumes:
      - data:/data
    x-ports:
      - 8080
    x-pre_deploy:
      - ./migrate.sh
    profiles:
      - prod
    mystery_option: true
