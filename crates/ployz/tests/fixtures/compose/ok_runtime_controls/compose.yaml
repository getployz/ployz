name: fixture_runtime_controls
services:
  web:
    image: nginx:latest
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    cap_drop:
      - MKNOD
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
          pids: 64
