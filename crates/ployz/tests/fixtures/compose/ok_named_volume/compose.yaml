name: fixture_named_volume
services:
  short:
    image: nginx:latest
    volumes:
      - data:/data
  long:
    image: nginx:latest
    volumes:
      - type: volume
        source: cache
        target: /cache
      - source: logs
        target: /logs
volumes:
  data:
    x-ployz:
      max-size: 10G
  cache:
  logs: {}
