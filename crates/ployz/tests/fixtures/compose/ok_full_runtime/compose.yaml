name: fixture_full_runtime
services:
  web:
    image: ghcr.io/acme/web:1
    command: ["serve", "--port", "8080"]
    entrypoint: ["/usr/local/bin/web"]
    environment:
      LOG_LEVEL: debug
      FEATURE_FLAG: true
      WORKERS: 4
    stop_grace_period: 1m30s
    deploy:
      replicas: 2
    x-ports: app.example.com:8080
