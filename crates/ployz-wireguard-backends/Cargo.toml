[package]
name = "ployz-wireguard-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["userspace-wg"]
docker = [
    "userspace-wg",
    "dep:bollard",
    "dep:ployz-runtime-docker",
]
userspace-wg = [
    "dep:defguard_boringtun",
    "dep:defguard_wireguard_rs",
    "dep:smoltcp",
    "dep:x25519-dalek",
]

[dependencies]
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-runtime-docker = { path = "../ployz-runtime-docker", optional = true }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
async-trait = { workspace = true }
base64 = { workspace = true }
bollard = { version = "0.20.1", optional = true }
defguard_boringtun = { version = "0.6", optional = true }
defguard_wireguard_rs = { version = "0.9.3", optional = true }
futures-util = { workspace = true }
ipnet = { workspace = true }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"], optional = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
tracing = { workspace = true }
x25519-dalek = { workspace = true, optional = true }

[lints]
workspace = true
