[package]
name = "ployz-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
ipnet = { version = "2.12.1", features = ["serde"] }
oci-spec = { version = "0.9.0", default-features = false, features = ["distribution"] }
prost = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
thiserror = "2.0.20"
ts-rs.workspace = true
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { version = "0.13.1", features = ["transport"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.24.0", features = ["js"] }

[build-dependencies]
tonic-build = { version = "0.13.1", default-features = false, features = ["transport"] }

[lints]
workspace = true
