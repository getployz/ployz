[package]
name = "ployz-runtime-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["docker", "userspace-wg"]
docker = ["dep:bollard", "userspace-wg"]
userspace-wg = ["dep:defguard_boringtun", "dep:smoltcp"]

[dependencies]
ployz-api = { path = "../ployz-api" }
ployz-orchestrator = { path = "../ployz-orchestrator" }
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-types = { path = "../ployz-types" }
ployz-corrosion = { path = "../ployz-corrosion" }
tokio = { workspace = true, features = ["process", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
derive_more = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
ipnet = { workspace = true }
chrono = { workspace = true }
bollard = { version = "0.20.1", optional = true }
defguard_wireguard_rs = "0.9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"], optional = true }
defguard_boringtun = { version = "0.6", optional = true }
hostname = "0.4.2"
if-addrs = "0.13"
ed25519-dalek = "2"

[lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
