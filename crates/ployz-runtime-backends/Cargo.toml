[package]
name = "ployz-runtime-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
docker = ["dep:bollard", "dep:reqwest", "userspace-wg"]
userspace-wg = [
    "dep:defguard_boringtun",
    "dep:defguard_wireguard_rs",
    "dep:smoltcp",
    "dep:x25519-dalek",
]

[dependencies]
ployz-api = { path = "../ployz-api" }
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-storage-api = { path = "../ployz-storage-api" }
ployz-storage-zfs = { path = "../ployz-storage-zfs" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-types = { path = "../ployz-types" }
backon = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
derive_more = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
ipnet = { workspace = true }
chrono = { workspace = true }
bollard = { version = "0.20.1", optional = true }
defguard_wireguard_rs = { version = "0.9.3", optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
x25519-dalek = { workspace = true, optional = true }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"], optional = true }
defguard_boringtun = { version = "0.6", optional = true }

[lints]
workspace = true
