[package]
name = "ployz-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ployz_gateway"
path = "src/lib.rs"

[[bin]]
name = "ployz-gateway"
path = "src/main.rs"

[dependencies]
ployz-config = { path = "../ployz-config" }
ployz-metrics = { path = "../ployz-metrics" }
ployz-nats = { path = "../ployz-nats" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
ployz-spec = { path = "../ployz-spec" }
ployz-time = { path = "../ployz-time" }
backon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pingora = { workspace = true, features = ["lb", "boringssl"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
# TODO: remove when upstream pingora drops async_trait
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[lints]
workspace = true
