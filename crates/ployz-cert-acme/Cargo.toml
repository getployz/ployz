[package]
name = "ployz-cert-acme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ployz-cert-api = { path = "../ployz-cert-api" }
ployz-cert-acme-api = { path = "../ployz-cert-acme-api" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
ployz-time = { path = "../ployz-time" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
instant-acme = { workspace = true, features = ["hyper-rustls", "ring"] }

[dev-dependencies]
ployz-store-memory = { path = "../ployz-store-memory" }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
