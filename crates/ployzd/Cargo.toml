[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ployzd"
path = "src/main.rs"

[features]
ebpf-native = ["ployz-orchestrator/ebpf-native"]

[dependencies]
ployz-api = { path = "../ployz-api" }
ployz-builder-dockerfile = { path = "../ployz-builder-dockerfile" }
ployz-builder-railpack = { path = "../ployz-builder-railpack" }
ployz-build = { path = "../ployz-build" }
ployz-image = { path = "../ployz-image" }
ployz-cert-api = { path = "../ployz-cert-api" }
ployz-cert-acme-api = { path = "../ployz-cert-acme-api" }
ployz-cert-acme = { path = "../ployz-cert-acme" }
ployz-config = { path = "../ployz-config" }
ployz-host-backends = { path = "../ployz-host-backends" }
ployz-metrics = { path = "../ployz-metrics" }
ployz-nats = { path = "../ployz-nats" }
ployz-node-api = { path = "../ployz-node-api" }
ployz-node-runtime = { path = "../ployz-node-runtime" }
ployz-operation-store = { path = "../ployz-operation-store" }
ployz-orchestrator = { path = "../ployz-orchestrator" }
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-runtime-docker = { path = "../ployz-runtime-docker" }
ployz-sdk = { path = "../ployz-sdk" }
ployz-storage-api = { path = "../ployz-storage-api" }
ployz-supervision = { path = "../ployz-supervision" }
ployz-volume-api = { path = "../ployz-volume-api" }
ployz-volume-btrfs = { path = "../ployz-volume-btrfs" }
ployz-volume-docker = { path = "../ployz-volume-docker" }
ployz-volume-zfs = { path = "../ployz-volume-zfs" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-store-memory = { path = "../ployz-store-memory" }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
ployz-spec = { path = "../ployz-spec" }
ployz-time = { path = "../ployz-time" }
ployz-wireguard-backends = { path = "../ployz-wireguard-backends", features = ["docker"] }
ployz-gateway = { path = "../ployz-gateway" }
ployz-dns = { path = "../ployz-dns" }
ployz-install = { path = "../ployz-install" }
axum = { workspace = true }
futures-util = { workspace = true }
async-nats = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-std", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tar = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
prometheus = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { workspace = true }
x25519-dalek = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tower = { workspace = true }

[lints]
workspace = true
