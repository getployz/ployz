[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["jetstream", "service"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
clap.workspace = true
futures-util.workspace = true
ployz-core.workspace = true
ployz-ebpf-common = { path = "../ployz-ebpf-common", features = ["validation"] }
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
nkeys = "0.4"
nuid.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
ployz-test-support.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ployzd"
path = "src/main.rs"
