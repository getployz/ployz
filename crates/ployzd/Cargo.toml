[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["jetstream", "service"] }
futures-util.workspace = true
ployz-core.workspace = true
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
ployz-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
nuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
nats_server = { git = "https://github.com/nats-io/nats.rs", package = "nats-server" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ployzd"
path = "src/main.rs"
