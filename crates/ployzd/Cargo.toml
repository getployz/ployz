[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["service"] }
atomic-write-file.workspace = true
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
clap.workspace = true
defguard_wireguard_rs.workspace = true
futures-util.workspace = true
getifs.workspace = true
getrandom.workspace = true
local-ip-address.workspace = true
public-ip-address.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }
ipnet = "2"
async-trait = "0.1"
pingora = { version = "0.8.1", features = ["lb", "openssl", "proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ployz-core.workspace = true
ployz-build-executor.workspace = true
ployz-ebpf-common = { path = "../../ebpf/common", features = ["validation"] }
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
ployz-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
nkeys = "0.4"
nuid.workspace = true
sysctl.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
containerd-client = "=0.9.0"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
hyper = { version = "=1.10.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
http-body-util = "=0.1.3"
bytes = "=1.11.1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
wait-timeout.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink.workspace = true

[dev-dependencies]
openssl = "0.10"
ployz = { path = "../ployz" }
ployz-test-lease-worker = { path = "../../testing/ployz-test-lease-worker" }
ployz-test-support.workspace = true
rcgen = { version = "0.14.8", features = ["crypto", "pem"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ployzd"
path = "src/main.rs"
