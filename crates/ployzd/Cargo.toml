[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
clap.workspace = true
duroxide.workspace = true
futures-util.workspace = true
getifs.workspace = true
getrandom.workspace = true
hmac.workspace = true
hickory-proto.workspace = true
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
rustix = { version = "1.1.4", features = ["fs"] }
async-trait = "0.1"
pingora = { version = "0.8.1", features = ["lb", "openssl", "proxy"] }
ployz-core.workspace = true
ployz-host-runner.workspace = true
ployz-ebpf-common = { path = "../../ebpf/common", features = ["validation"] }
ployz-telemetry.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
time.workspace = true
hyper = { version = "=1.10.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.11.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink.workspace = true

[dev-dependencies]
ployz-test-support.workspace = true
rcgen = { version = "0.14.8", features = ["crypto", "pem"] }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ployzd"
path = "src/main.rs"
