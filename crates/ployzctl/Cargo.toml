[package]
name = "ployzctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["service"] }
base64 = "0.22"
clap.workspace = true
nuid.workspace = true
ployz-core.workspace = true
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
ployz-test-support = { path = "../ployz-test-support" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[[bin]]
name = "ployzctl"
path = "src/main.rs"
