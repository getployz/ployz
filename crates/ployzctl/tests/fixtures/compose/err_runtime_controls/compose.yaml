name: fixture_bad_runtime_controls
services:
  web:
    image: nginx:latest
    restart: sometimes
    cap_add:
      - {}
    healthcheck:
      test: ["CMD-SHELL", "echo ok", "extra"]
      interval: 0s
      disable: "yes"
      mystery: true
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0"
          memory: 0
          pids: -2
          devices: []
        reservations:
          memory: 32M
        weird: true
