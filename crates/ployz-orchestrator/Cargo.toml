[package]
name = "ployz-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ployz_orchestrator"
path = "src/lib.rs"

[dependencies]
ployz-ebpf-common = { path = "../ebpf-common" }
ployz-cert-api = { path = "../ployz-cert-api" }
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
ployz-spec = { path = "../ployz-spec" }
ployz-time = { path = "../ployz-time" }
async-trait = { workspace = true }
futures-util = { workspace = true }
ipnet = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "fs", "sync", "time", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
ployz-store-memory = { path = "../ployz-store-memory" }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[features]
ebpf-native = ["dep:aya"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }

[lints]
workspace = true
