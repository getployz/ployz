[package]
name = "ployz-corrosion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ployz-config = { path = "../ployz-config" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-types = { path = "../ployz-types" }
corro-api-types = { git = "https://github.com/getployz/corrosion.git", branch = "main" }
tokio = { workspace = true }
http = { workspace = true }
http-body = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
pin-project-lite = "0.2"
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
ipnet = { workspace = true }
toml = { workspace = true }
strum = { workspace = true }
rusqlite = "0.38"

[lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
