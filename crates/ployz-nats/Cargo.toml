[package]
name = "ployz-nats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["jetstream", "kv", "nkeys", "nuid", "object-store", "ring", "server_2_12", "server_2_14", "service"] }
futures-util.workspace = true
ployz-core.workspace = true
ployz-sdk-types.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
ployz-test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"
