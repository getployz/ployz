[package]
name = "ployz-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ployz_dns"
path = "src/lib.rs"

[[bin]]
name = "ployz-dns"
path = "src/main.rs"

[dependencies]
ployz-config = { path = "../ployz-config" }
ployz-metrics = { path = "../ployz-metrics" }
ployz-nats = { path = "../ployz-nats" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-model = { path = "../ployz-model" }
ployz-spec = { path = "../ployz-spec" }
backon = { workspace = true }
hickory-server = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
# TODO: remove when upstream hickory drops async_trait
async-trait = { workspace = true }
prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
