[package]
name = "ployz-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ployz_dns"
path = "src/lib.rs"

[[bin]]
name = "ployz-dns"
path = "src/main.rs"

[dependencies]
ployz-config = { path = "../ployz-config" }
ployz-dns-config = { path = "../ployz-dns-config" }
ployz-metrics = { path = "../ployz-metrics" }
ployz-nats = { path = "../ployz-nats" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-types = { path = "../ployz-types" }
backon = { workspace = true }
hickory-server = "0.25"
tokio = { workspace = true }
# TODO: remove when upstream hickory drops async_trait
async-trait = { workspace = true }
prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
