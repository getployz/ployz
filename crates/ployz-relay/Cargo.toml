[package]
name = "ployz-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = { version = "0.3.34", features = ["sink"] }
http = "1.4.0"
ployz-core.workspace = true
prost = "0.13.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
