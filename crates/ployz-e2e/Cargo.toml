[package]
name = "ployz-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
futures-util.workspace = true
nuid.workspace = true
ployz-test-support.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
async-nats = { version = "0.49.0", default-features = false, features = ["jetstream", "kv", "nuid", "server_2_14", "service"] }
ployz-core.workspace = true
ployz-nats.workspace = true
ployz-sdk-types.workspace = true
ployzctl = { path = "../ployzctl" }
ployzd = { path = "../ployzd" }
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
