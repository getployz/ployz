[package]
name = "ployz-runtime-docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["docker"]
docker = []

[dependencies]
ployz-runtime-api = { path = "../ployz-runtime-api" }
ployz-storage-api = { path = "../ployz-storage-api" }
ployz-volume-zfs = { path = "../ployz-volume-zfs" }
ployz-store-api = { path = "../ployz-store-api" }
ployz-error = { path = "../ployz-error" }
ployz-model = { path = "../ployz-model" }
ployz-spec = { path = "../ployz-spec" }
ployz-time = { path = "../ployz-time" }
async-trait = { workspace = true }
backon = { workspace = true }
base64 = { workspace = true }
bollard = "0.20.1"
chrono = { workspace = true }
derive_more = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
