<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Ployz operator loop</title>
  <desc id="desc">A diagram showing observe, choose command, execute, verify evidence, and decide next operation around a small cluster.</desc>
  <rect width="720" height="520" fill="#fffdf8"/>
  <rect x="36" y="36" width="648" height="448" rx="18" fill="#f7f5ef" stroke="#d8d5c9"/>
  <g fill="none" stroke="#0b4f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 120c78 0 142 64 142 142s-64 142-142 142-142-64-142-142c0-34 12-65 32-89"/>
    <path d="M250 173l-3-48 47 9"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#1f2320">
    <g>
      <rect x="270" y="70" width="180" height="72" rx="10" fill="#e2f2ed" stroke="#9bc9bd"/>
      <text x="360" y="101" text-anchor="middle" font-size="18" font-weight="700">Observe</text>
      <text x="360" y="124" text-anchor="middle" font-size="13" fill="#656b62">live cluster state</text>
    </g>
    <g>
      <rect x="474" y="194" width="178" height="74" rx="10" fill="#fffdf8" stroke="#d8d5c9"/>
      <text x="563" y="225" text-anchor="middle" font-size="18" font-weight="700">Choose</text>
      <text x="563" y="248" text-anchor="middle" font-size="13" fill="#656b62">one operation</text>
    </g>
    <g>
      <rect x="390" y="364" width="190" height="74" rx="10" fill="#fffdf8" stroke="#d8d5c9"/>
      <text x="485" y="395" text-anchor="middle" font-size="18" font-weight="700">Execute</text>
      <text x="485" y="418" text-anchor="middle" font-size="13" fill="#656b62">bounded foreground work</text>
    </g>
    <g>
      <rect x="139" y="364" width="196" height="74" rx="10" fill="#fffdf8" stroke="#d8d5c9"/>
      <text x="237" y="395" text-anchor="middle" font-size="18" font-weight="700">Verify</text>
      <text x="237" y="418" text-anchor="middle" font-size="13" fill="#656b62">evidence, status, result</text>
    </g>
    <g>
      <rect x="72" y="194" width="178" height="74" rx="10" fill="#f7e7be" stroke="#d9b66c"/>
      <text x="161" y="225" text-anchor="middle" font-size="18" font-weight="700">Decide</text>
      <text x="161" y="248" text-anchor="middle" font-size="13" fill="#656b62">next command</text>
    </g>
  </g>
  <g fill="#0b4f4a">
    <circle cx="344" cy="262" r="38"/>
    <circle cx="426" cy="262" r="28" fill="#0f766e"/>
    <circle cx="294" cy="262" r="24" fill="#a23b2a"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#fffdf8" font-weight="800" font-size="14">
    <text x="344" y="267" text-anchor="middle">ployzd</text>
    <text x="426" y="267" text-anchor="middle">NATS</text>
    <text x="294" y="267" text-anchor="middle">ZFS</text>
  </g>
</svg>
