[package]
name = "mvp-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_machine"
path = "src/lib.rs"

[dependencies]
mvp-bus = { path = "../bus" }
mvp-commands = { path = "../commands" }
mvp-identity = { path = "../identity" }
mvp-mesh = { path = "../mesh" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
mvp-projection = { path = "../projection" }
mvp-routing = { path = "../routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
