[package]
name = "mvp-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_deploy"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
mvp-bus = { path = "../bus" }
mvp-identity = { path = "../identity" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
mvp-projection = { path = "../projection" }
mvp-routing = { path = "../routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
