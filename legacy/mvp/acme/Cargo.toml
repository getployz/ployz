[package]
name = "mvp-acme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_acme"
path = "src/lib.rs"

[features]
harness = ["mvp-lease/harness"]

[dependencies]
async-trait = "0.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
mvp-identity = { path = "../identity" }
mvp-lease = { path = "../lease" }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
mvp-lease = { path = "../lease", features = ["harness"] }
tokio = { version = "1", features = ["macros", "rt"] }
