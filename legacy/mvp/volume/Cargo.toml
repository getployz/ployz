[package]
name = "mvp-volume"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
mvp-bus = { path = "../bus" }
mvp-identity = { path = "../identity" }
mvp-lease = { path = "../lease" }
mvp-projection = { path = "../projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
