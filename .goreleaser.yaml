# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ployz

builds:
  - id: ployz-linux-amd64
    builder: rust
    binary: ployz
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployz-linux-amd64") }}'
    targets:
      - x86_64-unknown-linux-musl
    flags: &ployz-flags
      - --release
      - --locked
      - --package=ployz
      - --bin=ployz

  - id: ployz-linux-arm64
    builder: rust
    binary: ployz
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployz-linux-arm64") }}'
    targets:
      - aarch64-unknown-linux-musl
    flags: *ployz-flags

  # zig 0.13 segfaults linking the CLI's Apple targets, so the macOS runner links
  # them with its own toolchain; zig stays only for the musl targets.
  - id: ployz-darwin-amd64
    builder: rust
    command: build
    binary: ployz
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployz-darwin-amd64") }}'
    targets:
      - x86_64-apple-darwin
    flags: *ployz-flags

  - id: ployz-darwin-arm64
    builder: rust
    command: build
    binary: ployz
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployz-darwin-arm64") }}'
    targets:
      - aarch64-apple-darwin
    flags: *ployz-flags

  - id: ployzd-linux-amd64
    builder: rust
    binary: ployzd
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployzd-linux-amd64") }}'
    targets:
      - x86_64-unknown-linux-musl
    flags: &ployzd-flags
      - --release
      - --locked
      - --package=ployzd
      - --bin=ployzd
    hooks: &ployzd-hooks
      pre:
        - cargo zigbuild --release --locked --package ployz-testkit --bin sqlite-probe --target {{ .Target }}

  - id: ployzd-linux-arm64
    builder: rust
    binary: ployzd
    skip: '{{ and (ne (index .Env "RELEASE_ID") "") (ne (index .Env "RELEASE_ID") "ployzd-linux-arm64") }}'
    targets:
      - aarch64-unknown-linux-musl
    flags: *ployzd-flags
    hooks: *ployzd-hooks

archives:
  - id: ployz
    builds: [ployz-linux-amd64, ployz-linux-arm64, ployz-darwin-amd64, ployz-darwin-arm64]
    format: tar.gz
    name_template: >-
      ployz_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    builds_info:
      mode: 0755
    files:
      - src: target/tailcat/{{ .Os }}_{{ .Arch }}/ployz-tailcat
        dst: ployz-tailcat
        info:
          mode: 0755

  - id: ployzd
    builds: [ployzd-linux-amd64, ployzd-linux-arm64]
    format: tar.gz
    name_template: "ployzd_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mode: 0755
    files:
      - src: target/tailcat/{{ .Os }}_{{ .Arch }}/ployz-tailcat
        dst: ployz-tailcat
        info:
          mode: 0755
      - src: scripts/uninstall.sh
        dst: ployz-uninstall
        info:
          mode: 0755

checksum:
  name_template: checksums.txt
  ids: [ployz, ployzd]

changelog:
  disable: true
