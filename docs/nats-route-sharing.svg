<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Ployz NATS route sharing and public exposure</title>
  <desc id="desc">Diagram of future Ployz route sharing through private routing events, owner-local grants, route export streams, installation-root sync streams, gateways, and withdraw events.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f2; }
      .panel { fill: #ffffff; stroke: #20231f; stroke-width: 2.5; }
      .owner { fill: #eef5f8; stroke: #17384d; stroke-width: 3; }
      .root { fill: #f1edff; stroke: #513a7a; stroke-width: 3; }
      .aud { fill: #fff7e8; stroke: #805b13; stroke-width: 2.5; }
      .private { fill: #dff1ff; stroke: #1d5f81; stroke-width: 1.7; }
      .grant { fill: #e8f4dc; stroke: #456622; stroke-width: 1.7; }
      .export { fill: #ffe8dc; stroke: #964222; stroke-width: 1.7; }
      .sync { fill: #ece6ff; stroke: #513a7a; stroke-width: 1.7; }
      .gateway { fill: #f0f2ed; stroke: #596158; stroke-width: 1.7; }
      .danger { fill: #fff0ef; stroke: #9b2d27; stroke-width: 1.7; }
      .flow { fill: none; stroke: #20231f; stroke-width: 2.5; marker-end: url(#arrow); }
      .flowGrant { fill: none; stroke: #456622; stroke-width: 2.5; marker-end: url(#arrowGrant); }
      .flowExport { fill: none; stroke: #964222; stroke-width: 2.6; marker-end: url(#arrowExport); }
      .flowSync { fill: none; stroke: #513a7a; stroke-width: 2.6; marker-end: url(#arrowSync); }
      .flowDeny { fill: none; stroke: #9b2d27; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrowDeny); }
      .h1 { font: 760 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h2 { font: 740 26px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h3 { font: 720 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .small { font: 500 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #242821; }
      .tiny { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d322b; }
      .micro { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #363b34; }
      .muted { fill: #5d655b; }
      .mono { font: 600 16px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
      .monoSmall { font: 600 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20231f"/>
    </marker>
    <marker id="arrowGrant" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#456622"/>
    </marker>
    <marker id="arrowExport" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#964222"/>
    </marker>
    <marker id="arrowSync" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#513a7a"/>
    </marker>
    <marker id="arrowDeny" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9b2d27"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1040"/>
  <text class="h1" x="70" y="72">Route Sharing Is an Export, Not a Prefix</text>
  <text class="small muted" x="72" y="108">Private routing truth stays authority-local; grants create export feeds; root sync streams serve named audiences</text>

  <rect class="owner" x="70" y="165" width="690" height="650" rx="18"/>
  <text class="h2" x="105" y="210">Owner Authority</text>
  <text class="mono" x="105" y="242">dom-&lt;owner_auth&gt; / NATS account &lt;owner_auth&gt;</text>
  <text class="tiny muted" x="105" y="274">Only this authority can read private route source truth.</text>

  <rect class="private" x="105" y="320" width="255" height="82" rx="9"/>
  <text class="label" x="126" y="354">Private routing events</text>
  <text class="monoSmall" x="126" y="379">routing_events_&lt;auth&gt;</text>
  <rect class="grant" x="415" y="320" width="285" height="82" rx="9"/>
  <text class="label" x="436" y="354">Owner-local grants</text>
  <text class="monoSmall" x="436" y="379">route_grants_&lt;auth&gt;</text>

  <rect class="export" x="105" y="455" width="255" height="92" rx="9"/>
  <text class="label" x="126" y="489">Route export stream</text>
  <text class="monoSmall" x="126" y="514">route_exports_&lt;auth&gt;</text>
  <text class="micro muted" x="126" y="535">public.global / authority.X</text>
  <rect class="export" x="415" y="455" width="285" height="92" rx="9"/>
  <text class="label" x="436" y="489">Export materializer</text>
  <text class="tiny" x="436" y="516">Checks grant before publishing</text>
  <text class="micro muted" x="436" y="538">Projection failures become status</text>

  <rect class="danger" x="105" y="625" width="595" height="112" rx="9"/>
  <text class="label" x="126" y="660">Revocation / TTL expiry</text>
  <text class="tiny" x="126" y="692">Writes durable lifecycle events first:</text>
  <text class="monoSmall" x="126" y="720">GrantRevoked / GrantExpired + RouteWithdrawn</text>

  <rect class="root" x="850" y="165" width="440" height="650" rx="18"/>
  <text class="h2" x="885" y="210">Installation Root</text>
  <text class="mono" x="885" y="242">dom-&lt;inst&gt;-root</text>
  <text class="tiny muted" x="885" y="274">Directory/projection authority, not private source truth.</text>

  <rect class="grant" x="885" y="320" width="365" height="82" rx="9"/>
  <text class="label" x="906" y="354">Grant index</text>
  <text class="monoSmall" x="906" y="379">grant_index_&lt;inst&gt;</text>
  <rect class="sync" x="885" y="455" width="365" height="92" rx="9"/>
  <text class="label" x="906" y="489">Public projection</text>
  <text class="monoSmall" x="906" y="514">sync_public_routes</text>
  <text class="micro muted" x="906" y="535">sources public.global exports</text>
  <rect class="sync" x="885" y="595" width="365" height="92" rx="9"/>
  <text class="label" x="906" y="629">Per-grantee projection</text>
  <text class="monoSmall" x="906" y="654">sync_authority_&lt;grantee&gt;</text>
  <text class="micro muted" x="906" y="675">one stream per grantee</text>
  <rect class="danger" x="885" y="725" width="365" height="52" rx="9"/>
  <text class="monoSmall" x="906" y="756">source removal is cleanup after withdraw</text>

  <rect class="aud" x="1380" y="165" width="350" height="650" rx="18"/>
  <text class="h2" x="1415" y="210">Audience Side</text>
  <text class="tiny muted" x="1415" y="242">Gateways subscribe to deterministic sets.</text>

  <rect class="gateway" x="1415" y="320" width="270" height="82" rx="9"/>
  <text class="label" x="1436" y="354">Owner local gateway</text>
  <text class="monoSmall" x="1436" y="379">routing_events_&lt;owner&gt;</text>
  <rect class="gateway" x="1415" y="455" width="270" height="92" rx="9"/>
  <text class="label" x="1436" y="489">Public gateway</text>
  <text class="monoSmall" x="1436" y="514">sync_public_routes</text>
  <text class="micro muted" x="1436" y="535">never private subjects</text>
  <rect class="gateway" x="1415" y="595" width="270" height="92" rx="9"/>
  <text class="label" x="1436" y="629">Grantee gateway</text>
  <text class="monoSmall" x="1436" y="654">sync_authority_self</text>
  <text class="micro muted" x="1436" y="675">plus local routes if it serves one</text>

  <rect class="panel" x="70" y="865" width="1660" height="105" rx="12"/>
  <text class="h2" x="105" y="908">Operational Rule</text>
  <text class="tiny" x="105" y="944">Adding or revoking visibility is a foreground command. It writes the owner-local grant or withdrawal, configures export and sync sources, and succeeds only after the serving path is observable.</text>

  <path class="flow" d="M232 402 L232 455"/>
  <path class="flowGrant" d="M557 402 L557 455"/>
  <path class="flowExport" d="M360 501 L415 501"/>
  <path class="flowExport" d="M700 501 C765 501, 810 501, 885 501"/>
  <path class="flowSync" d="M1250 501 C1310 501, 1345 501, 1415 501"/>
  <path class="flowSync" d="M1250 641 C1310 641, 1345 641, 1415 641"/>
  <path class="flow" d="M360 361 C705 270, 1120 290, 1415 361"/>
  <path class="flowGrant" d="M700 361 C760 361, 815 361, 885 361"/>
  <path class="flowDeny" d="M700 681 C775 681, 815 735, 885 751"/>
  <path class="flowDeny" d="M1250 751 C1320 751, 1360 680, 1415 660"/>

  <text class="micro muted" x="745" y="485">authorized exports only</text>
  <text class="micro muted" x="1308" y="485">public audience</text>
  <text class="micro muted" x="1308" y="625">grantee audience</text>
  <text class="micro muted" x="955" y="804">withdraw before cleanup</text>
</svg>
