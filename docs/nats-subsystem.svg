<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Ployz NATS subsystem, streams, and multi-node topology</title>
  <desc id="desc">Diagram of the Ployz NATS authority, JetStream assets, storage replicas, leaf nodes, request reply commands, and routing event consumers.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f2; }
      .panel { fill: #ffffff; stroke: #20231f; stroke-width: 2.5; }
      .soft { fill: #f3f5ee; stroke: #4f5a4a; stroke-width: 1.5; }
      .authority { fill: #eef4f8; stroke: #17384d; stroke-width: 3; }
      .node { fill: #ffffff; stroke: #17384d; stroke-width: 2; }
      .leaf { fill: #fff8e8; stroke: #775c18; stroke-width: 2; }
      .stream { fill: #def1ff; stroke: #14567a; stroke-width: 1.5; }
      .kv { fill: #e8f5dd; stroke: #40641f; stroke-width: 1.5; }
      .work { fill: #ffe7df; stroke: #8d3c22; stroke-width: 1.5; }
      .flow { fill: none; stroke: #20231f; stroke-width: 2.4; marker-end: url(#arrow); }
      .flowSoft { fill: none; stroke: #5e6860; stroke-width: 2; marker-end: url(#arrowSoft); stroke-dasharray: 7 6; }
      .raft { fill: none; stroke: #14567a; stroke-width: 2.2; marker-end: url(#arrowBlue); marker-start: url(#arrowBlue); }
      .leafLine { fill: none; stroke: #9a6b00; stroke-width: 2.4; marker-end: url(#arrowGold); }
      .small { font: 500 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #242821; }
      .tiny { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2c312b; }
      .micro { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #353a33; }
      .h1 { font: 760 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h2 { font: 740 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h3 { font: 720 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .label { font: 680 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .muted { fill: #596158; }
      .mono { font: 600 16px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
      .monoSmall { font: 600 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20231f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5e6860"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L9,5.5 L2,9 Z" fill="#14567a"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9a6b00"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1220"/>
  <text class="h1" x="70" y="72">Ployz NATS Subsystem</text>
  <text class="small muted" x="72" y="108">Authority-local durable truth, peer node commands, and compute-only leaf regions over the WireGuard overlay</text>

  <rect class="panel" x="58" y="142" width="400" height="270" rx="12"/>
  <text class="h2" x="88" y="186">Operator / ployzd</text>
  <text class="small" x="88" y="226">Foreground commands decide policy</text>
  <text class="tiny muted" x="88" y="256">No hidden reconciler mutates cluster truth</text>
  <rect class="soft" x="88" y="286" width="310" height="48" rx="8"/>
  <text class="mono" x="108" y="316">ployzctl deploy / machine / nats</text>
  <text class="tiny muted" x="88" y="366">Uses NATS client port 4222 on the overlay</text>

  <rect class="authority" x="520" y="142" width="810" height="715" rx="18"/>
  <text class="h2" x="552" y="186">Home / Data Authority</text>
  <text class="small muted" x="552" y="216">NATS account + JetStream domain, e.g. </text>
  <text class="mono" x="900" y="216">dom-auth-default</text>

  <rect class="node" x="565" y="252" width="205" height="132" rx="10"/>
  <text class="h3" x="592" y="288">storage node A</text>
  <text class="tiny" x="592" y="318">nats-server</text>
  <text class="monoSmall" x="592" y="348">4222 client</text>
  <text class="monoSmall" x="592" y="371">6222 route</text>

  <rect class="node" x="825" y="252" width="205" height="132" rx="10"/>
  <text class="h3" x="852" y="288">storage node B</text>
  <text class="tiny" x="852" y="318">JetStream replica</text>
  <text class="monoSmall" x="852" y="348">Raft follower</text>
  <text class="monoSmall" x="852" y="371">leaf listen 7422</text>

  <rect class="node" x="1085" y="252" width="205" height="132" rx="10"/>
  <text class="h3" x="1112" y="288">storage node C</text>
  <text class="tiny" x="1112" y="318">JetStream replica</text>
  <text class="monoSmall" x="1112" y="348">Raft follower</text>
  <text class="monoSmall" x="1112" y="371">monitor 8222 local</text>

  <path class="raft" d="M772 318 C805 292, 792 292, 825 318"/>
  <path class="raft" d="M1032 318 C1065 292, 1052 292, 1085 318"/>
  <path class="raft" d="M760 384 C900 432, 990 432, 1120 384"/>
  <text class="tiny muted" x="762" y="430">routes carry core NATS + JetStream Raft inside one low-latency authority</text>

  <rect class="panel" x="565" y="470" width="725" height="365" rx="12"/>
  <text class="h2" x="595" y="512">Replicated JetStream Assets</text>
  <text class="tiny muted" x="596" y="542">Replica target is explicit operator intent: R=1, R=3, or R=5. R=2 is never selected.</text>

  <rect class="stream" x="600" y="575" width="315" height="78" rx="8"/>
  <text class="label" x="620" y="606">Deploy commits stream</text>
  <text class="monoSmall" x="620" y="631">cp_deploy_commits_&lt;auth&gt;</text>
  <text class="tiny muted" x="620" y="644">append-only, immutable envelopes</text>

  <rect class="stream" x="945" y="575" width="315" height="78" rx="8"/>
  <text class="label" x="965" y="606">Routing events stream</text>
  <text class="monoSmall" x="965" y="631">routing_events_&lt;auth&gt;</text>
  <text class="tiny muted" x="965" y="644">one ordered fact per message</text>

  <rect class="work" x="600" y="680" width="315" height="78" rx="8"/>
  <text class="label" x="620" y="711">Cert jobs stream</text>
  <text class="monoSmall" x="620" y="736">work_cert_&lt;auth&gt;</text>
  <text class="tiny muted" x="620" y="749">WorkQueue + Nats-Schedule</text>

  <rect class="kv" x="945" y="680" width="315" height="78" rx="8"/>
  <text class="label" x="965" y="711">KV buckets</text>
  <text class="monoSmall" x="965" y="736">machines, instances, locks...</text>
  <text class="tiny muted" x="965" y="749">CAS, watches, TTL lease markers</text>

  <text class="micro muted" x="600" y="785">Authority-local KV: invites, deploy_status, instances, certificates, ACME, locks</text>
  <text class="micro muted" x="600" y="806">Installation-root KV: machines_&lt;installation&gt; membership and storage eligibility</text>

  <rect class="leaf" x="1390" y="176" width="330" height="230" rx="14"/>
  <text class="h2" x="1420" y="220">Compute-only Region</text>
  <text class="small" x="1420" y="258">nats-server leaf</text>
  <text class="tiny muted" x="1420" y="288">No local JetStream domain in MVP</text>
  <text class="tiny muted" x="1420" y="318">Not part of authority Raft quorum</text>
  <rect class="soft" x="1420" y="342" width="260" height="38" rx="7"/>
  <text class="monoSmall" x="1435" y="366">leaf remotes -&gt; :7422</text>

  <rect class="leaf" x="1390" y="455" width="330" height="185" rx="14"/>
  <text class="h2" x="1420" y="498">Regional Workloads</text>
  <text class="tiny" x="1420" y="535">containers, DNS, gateway, ployzd</text>
  <text class="tiny muted" x="1420" y="565">Can run apps without owning writes</text>
  <text class="tiny muted" x="1420" y="595">Reads and commits cross the leaf bridge</text>

  <path class="leafLine" d="M1390 292 C1345 292, 1345 356, 1290 356"/>
  <text class="tiny muted" x="1265" y="244">leafnode bridge</text>

  <rect class="panel" x="58" y="470" width="400" height="388" rx="12"/>
  <text class="h2" x="88" y="512">Deploy Write Path</text>
  <circle cx="95" cy="552" r="12" fill="#20231f"/><text class="tiny" x="91" y="557" fill="#fff">1</text>
  <text class="tiny" x="120" y="558">Acquire deploy lease in locks KV</text>
  <text class="monoSmall" x="120" y="584">cp.lock.deploy.&lt;namespace&gt;</text>
  <circle cx="95" cy="625" r="12" fill="#20231f"/><text class="tiny" x="91" y="630" fill="#fff">2</text>
  <text class="tiny" x="120" y="631">Probe and command selected nodes</text>
  <text class="monoSmall" x="120" y="657">ployz.v1.*.rpc.node.&lt;id&gt;.&gt;</text>
  <circle cx="95" cy="698" r="12" fill="#20231f"/><text class="tiny" x="91" y="703" fill="#fff">3</text>
  <text class="tiny" x="120" y="704">Append one deploy commit envelope</text>
  <circle cx="95" cy="746" r="12" fill="#20231f"/><text class="tiny" x="91" y="751" fill="#fff">4</text>
  <text class="tiny" x="120" y="752">Publish derived routing facts</text>
  <circle cx="95" cy="794" r="12" fill="#20231f"/><text class="tiny" x="91" y="799" fill="#fff">5</text>
  <text class="tiny" x="120" y="800">Consumers rebuild snapshot + follow events</text>

  <path class="flow" d="M398 310 C470 310, 492 570, 600 615"/>
  <path class="flow" d="M398 635 C485 635, 508 719, 600 719"/>
  <path class="flow" d="M398 746 C520 746, 520 614, 600 614"/>
  <path class="flow" d="M915 614 L945 614"/>
  <path class="flowSoft" d="M1260 719 C1340 719, 1350 560, 1390 540"/>

  <rect class="panel" x="520" y="905" width="810" height="210" rx="12"/>
  <text class="h2" x="552" y="948">Routing Projection Consumers</text>
  <rect class="soft" x="555" y="980" width="220" height="82" rx="8"/>
  <text class="label" x="580" y="1012">Gateway</text>
  <text class="tiny muted" x="580" y="1040">HTTP/TCP routes to backends</text>
  <rect class="soft" x="805" y="980" width="220" height="82" rx="8"/>
  <text class="label" x="830" y="1012">DNS</text>
  <text class="tiny muted" x="830" y="1040">service names to overlay IPs</text>
  <rect class="soft" x="1055" y="980" width="240" height="82" rx="8"/>
  <text class="label" x="1080" y="1012">Runtime watches</text>
  <text class="tiny muted" x="1080" y="1040">readiness and local projections</text>
  <text class="tiny muted" x="552" y="1086">Snapshot first; then an ephemeral push consumer from the observed routing stream sequence.</text>

  <path class="flow" d="M1102 653 C1102 820, 865 842, 865 980"/>
  <path class="flow" d="M1135 653 C1175 800, 1175 845, 1175 980"/>

  <rect class="panel" x="1390" y="720" width="330" height="246" rx="12"/>
  <text class="h2" x="1420" y="764">Multi-node Rules</text>
  <text class="tiny" x="1420" y="805">Machine add starts local NATS.</text>
  <text class="tiny" x="1420" y="835">It does not change stream replicas.</text>
  <text class="tiny" x="1420" y="875">storage=true means eligible, not selected.</text>
  <text class="tiny" x="1420" y="915">Promotion validates peers, capacity, RTT,</text>
  <text class="tiny" x="1420" y="940">failure domains, and quorum safety.</text>

  <rect class="panel" x="58" y="905" width="400" height="210" rx="12"/>
  <text class="h2" x="88" y="948">Failure Visibility</text>
  <text class="tiny" x="88" y="990">Foreground failures return typed errors.</text>
  <text class="tiny" x="88" y="1024">Watcher/worker failures surface via</text>
  <text class="monoSmall" x="88" y="1052">ployzctl status</text>
  <text class="tiny" x="228" y="1052"> health components.</text>
  <text class="tiny muted" x="88" y="1092">Logs are evidence, not the audience.</text>

  <path class="flowSoft" d="M1390 540 C1330 540, 1320 1018, 1295 1018"/>

  <rect class="soft" x="552" y="1144" width="1170" height="42" rx="8"/>
  <text class="tiny" x="575" y="1171">Ports on WireGuard overlay: client 4222, route 6222, leafnode 7422. Monitoring 8222 stays loopback-only.</text>
</svg>
