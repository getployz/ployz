<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">Ployz future NATS topology</title>
  <desc id="desc">Future Ployz NATS topology showing installation root, per-authority JetStream domains, route exports, sync projections, regions, gateways, and subject hierarchy.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f2; }
      .boundary { fill: #fbfbf6; stroke: #20231f; stroke-width: 3; }
      .root { fill: #f1edff; stroke: #4a356f; stroke-width: 2.5; }
      .auth { fill: #eef5f8; stroke: #17384d; stroke-width: 2.5; }
      .auth2 { fill: #edf6ea; stroke: #37642f; stroke-width: 2.5; }
      .auth3 { fill: #fff5e4; stroke: #7b5611; stroke-width: 2.5; }
      .panel { fill: #ffffff; stroke: #22251f; stroke-width: 2; }
      .region { fill: #f7fbff; stroke: #4c6577; stroke-width: 1.8; }
      .compute { fill: #fff9ec; stroke: #8a6518; stroke-width: 1.8; }
      .stream { fill: #dff1ff; stroke: #1d5f81; stroke-width: 1.5; }
      .export { fill: #ffe8dc; stroke: #964222; stroke-width: 1.5; }
      .kv { fill: #e8f4dc; stroke: #456622; stroke-width: 1.5; }
      .sync { fill: #ece6ff; stroke: #513a7a; stroke-width: 1.5; }
      .gateway { fill: #f0f2ed; stroke: #596158; stroke-width: 1.5; }
      .flow { fill: none; stroke: #20231f; stroke-width: 2.4; marker-end: url(#arrow); }
      .flowSoft { fill: none; stroke: #5c645c; stroke-width: 2.1; stroke-dasharray: 8 6; marker-end: url(#arrowSoft); }
      .flowExport { fill: none; stroke: #964222; stroke-width: 2.5; marker-end: url(#arrowExport); }
      .flowSync { fill: none; stroke: #513a7a; stroke-width: 2.5; marker-end: url(#arrowSync); }
      .flowGold { fill: none; stroke: #8a6518; stroke-width: 2.3; marker-end: url(#arrowGold); }
      .h1 { font: 760 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h2 { font: 740 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .h3 { font: 720 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a17; }
      .small { font: 500 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #242821; }
      .tiny { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d322b; }
      .micro { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #363b34; }
      .muted { fill: #5d655b; }
      .mono { font: 600 16px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
      .monoSmall { font: 600 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #20231f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20231f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5c645c"/>
    </marker>
    <marker id="arrowExport" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#964222"/>
    </marker>
    <marker id="arrowSync" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#513a7a"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8a6518"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320"/>
  <text class="h1" x="70" y="72">Ployz Future NATS Topology</text>
  <text class="small muted" x="72" y="108">No tier in subjects: installation + authority + plane, with grants and projection streams for visibility</text>

  <rect class="boundary" x="55" y="140" width="1790" height="1040" rx="20"/>
  <text class="h2" x="88" y="182">Installation: acme</text>
  <text class="tiny muted" x="88" y="212">Compute, trust, substrate, and blast-radius boundary. Regions live here, but regions are not subject tokens.</text>

  <rect class="panel" x="88" y="245" width="445" height="212" rx="12"/>
  <text class="h2" x="118" y="288">Subject Spine</text>
  <text class="mono" x="118" y="326">ployz.v1.&lt;inst&gt;.&lt;auth&gt;.&lt;plane&gt;...</text>
  <text class="tiny" x="118" y="362">Planes: cp, route, rpc, work, audit</text>
  <text class="monoSmall" x="118" y="396">ployz.v1.&lt;inst&gt;.substrate...</text>
  <text class="tiny muted" x="118" y="430">Tier is metadata; subjects stay stable.</text>

  <rect class="root" x="585" y="245" width="470" height="335" rx="14"/>
  <text class="h2" x="615" y="288">Installation Root Domain</text>
  <text class="mono" x="615" y="322">dom-&lt;inst&gt;-root</text>
  <text class="tiny muted" x="615" y="350">Directory and projection authority, not a master.</text>
  <rect class="kv" x="615" y="382" width="190" height="70" rx="8"/>
  <text class="label" x="635" y="412">Registry KV</text>
  <text class="monoSmall" x="635" y="438">authorities, regions</text>
  <rect class="kv" x="825" y="382" width="200" height="70" rx="8"/>
  <text class="label" x="845" y="412">Substrate KV</text>
  <text class="monoSmall" x="845" y="438">machines, gateways, dns</text>
  <rect class="sync" x="615" y="475" width="190" height="70" rx="8"/>
  <text class="label" x="635" y="505">Public Sync</text>
  <text class="monoSmall" x="635" y="531">sync_public_routes</text>
  <rect class="sync" x="825" y="475" width="200" height="70" rx="8"/>
  <text class="label" x="845" y="505">Grantee Sync</text>
  <text class="monoSmall" x="845" y="531">sync_authority_*</text>

  <rect class="panel" x="1095" y="245" width="690" height="335" rx="12"/>
  <text class="h2" x="1125" y="288">Regions Are Placement, Not Authority</text>
  <rect class="region" x="1125" y="322" width="190" height="105" rx="8"/>
  <text class="h3" x="1148" y="356">us-west</text>
  <text class="tiny" x="1148" y="385">home/data</text>
  <text class="monoSmall" x="1148" y="410">auth-default</text>
  <rect class="compute" x="1340" y="322" width="190" height="105" rx="8"/>
  <text class="h3" x="1363" y="356">sin</text>
  <text class="tiny" x="1363" y="385">compute-only</text>
  <text class="monoSmall" x="1363" y="410">authority: none</text>
  <rect class="compute" x="1555" y="322" width="190" height="105" rx="8"/>
  <text class="h3" x="1578" y="356">eu</text>
  <text class="tiny" x="1578" y="385">compute-only</text>
  <text class="monoSmall" x="1578" y="410">authority: none</text>
  <rect class="auth2" x="1340" y="465" width="405" height="72" rx="8"/>
  <text class="label" x="1363" y="495">Explicit promotion creates an authority</text>
  <text class="monoSmall" x="1363" y="520">region promote sin --data --replicas 3</text>

  <rect class="auth" x="88" y="640" width="515" height="360" rx="15"/>
  <text class="h2" x="118" y="682">Authority: auth-default</text>
  <text class="tiny muted" x="118" y="712">NATS account + JetStream domain, R=3 in home/data region</text>
  <text class="mono" x="118" y="742">dom-auth-default</text>
  <rect class="stream" x="118" y="772" width="218" height="64" rx="8"/>
  <text class="label" x="136" y="800">Private route truth</text>
  <text class="monoSmall" x="136" y="823">routing_events_default</text>
  <rect class="stream" x="358" y="772" width="215" height="64" rx="8"/>
  <text class="label" x="376" y="800">Deploy commits</text>
  <text class="monoSmall" x="376" y="823">cp_deploy_commits</text>
  <rect class="export" x="118" y="858" width="218" height="64" rx="8"/>
  <text class="label" x="136" y="886">Route exports</text>
  <text class="monoSmall" x="136" y="909">public / authority / group</text>
  <rect class="kv" x="358" y="858" width="215" height="64" rx="8"/>
  <text class="label" x="376" y="886">Authority KV</text>
  <text class="monoSmall" x="376" y="909">instances, locks, grants</text>
  <rect class="export" x="118" y="940" width="455" height="40" rx="7"/>
  <text class="monoSmall" x="138" y="965">withdraw events are lifecycle truth before cleanup</text>

  <rect class="auth2" x="695" y="640" width="515" height="360" rx="15"/>
  <text class="h2" x="725" y="682">Authority: auth-sin</text>
  <text class="tiny muted" x="725" y="712">Created only after region promotion, R=3 within sin</text>
  <text class="mono" x="725" y="742">dom-auth-sin</text>
  <rect class="stream" x="725" y="772" width="218" height="64" rx="8"/>
  <text class="label" x="743" y="800">Private route truth</text>
  <text class="monoSmall" x="743" y="823">routing_events_sin</text>
  <rect class="export" x="965" y="772" width="215" height="64" rx="8"/>
  <text class="label" x="983" y="800">Route exports</text>
  <text class="monoSmall" x="983" y="823">selected grants only</text>
  <rect class="kv" x="725" y="858" width="218" height="64" rx="8"/>
  <text class="label" x="743" y="886">Authority KV</text>
  <text class="monoSmall" x="743" y="909">local lifecycle + locks</text>
  <rect class="stream" x="965" y="858" width="215" height="64" rx="8"/>
  <text class="label" x="983" y="886">Work queues</text>
  <text class="monoSmall" x="983" y="909">work_cert_sin</text>
  <text class="tiny muted" x="725" y="965">No stream is written by two authorities. Sources are one-way.</text>

  <rect class="auth3" x="1302" y="640" width="483" height="360" rx="15"/>
  <text class="h2" x="1332" y="682">Authority: auth-dev-nick</text>
  <text class="tiny muted" x="1332" y="712">Laptop/dev authority when it must progress while partitioned</text>
  <text class="mono" x="1332" y="742">dom-auth-dev-nick, R=1</text>
  <rect class="stream" x="1332" y="772" width="205" height="64" rx="8"/>
  <text class="label" x="1350" y="800">Private dev routes</text>
  <text class="monoSmall" x="1350" y="823">routing_events_dev</text>
  <rect class="export" x="1557" y="772" width="198" height="64" rx="8"/>
  <text class="label" x="1575" y="800">Shared exports</text>
  <text class="monoSmall" x="1575" y="823">authority.&lt;grantee&gt;</text>
  <rect class="sync" x="1332" y="858" width="423" height="64" rx="8"/>
  <text class="label" x="1350" y="886">Consumes public and granted projections</text>
  <text class="monoSmall" x="1350" y="909">sync_public_routes + sync_authority_auth-dev-nick</text>
  <text class="tiny muted" x="1332" y="965">Partitioned dev keeps its own cp, route, export, and work streams.</text>

  <rect class="panel" x="88" y="1050" width="1697" height="115" rx="12"/>
  <text class="h2" x="118" y="1092">Gateway Subscription Set</text>
  <text class="tiny" x="118" y="1128">A gateway subscribes to local authority routing events for authorities it serves.</text>
  <text class="monoSmall" x="118" y="1152">local_routes(auth) + sync_public_routes + sync_authority_&lt;self_auth&gt;</text>

  <rect class="gateway" x="248" y="1205" width="290" height="64" rx="8"/>
  <text class="label" x="268" y="1233">Public gateways</text>
  <text class="monoSmall" x="268" y="1256">sync_public_routes only</text>
  <rect class="gateway" x="805" y="1205" width="290" height="64" rx="8"/>
  <text class="label" x="825" y="1233">Promoted region gateway</text>
  <text class="monoSmall" x="825" y="1256">auth-sin + public sync</text>
  <rect class="gateway" x="1360" y="1205" width="290" height="64" rx="8"/>
  <text class="label" x="1380" y="1233">Dev gateway</text>
  <text class="monoSmall" x="1380" y="1256">auth-dev + granted sync</text>

  <path class="flowExport" d="M227 836 L227 858"/>
  <path class="flowExport" d="M336 890 C470 890, 500 520, 615 510"/>
  <path class="flowExport" d="M965 804 C965 650, 912 575, 912 545"/>
  <path class="flowSync" d="M710 545 C600 760, 438 1095, 393 1205"/>
  <path class="flowSync" d="M925 545 L950 1205"/>
  <path class="flowSync" d="M1025 512 C1210 675, 1410 1030, 1505 1205"/>
  <path class="flowSoft" d="M1340 501 C1240 565, 1145 610, 1035 640"/>
  <path class="flowGold" d="M1435 427 L1435 465"/>
  <path class="flowSoft" d="M1315 374 C1110 410, 1015 548, 963 640"/>
  <path class="flowSoft" d="M1148 427 C965 520, 695 585, 548 640"/>
</svg>
