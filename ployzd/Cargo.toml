[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bollard = { version = "0.21.0", features = ["json_data_content"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
defguard_wireguard_rs = "=0.7.1"
# 0.2.4 mixes incompatible netlink-packet-generic major versions with defguard 0.7.
netlink-packet-wireguard = "=0.2.3"
fs2 = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
ipnet = "2.12.1"
ployz-core.workspace = true
prometheus = "0.14.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.4"
tonic = { version = "0.13.1", features = ["transport"] }

[dev-dependencies]
ployz-testkit.workspace = true

[lints]
workspace = true
