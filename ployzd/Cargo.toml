[package]
name = "ployzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
bollard = { version = "0.21.0", features = ["json_data_content"] }
bytes = "1.12.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
defguard_wireguard_rs = "=0.7.1"
# 0.2.4 mixes incompatible netlink-packet-generic major versions with defguard 0.7.
netlink-packet-wireguard = "=0.2.3"
fs2 = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
hickory-server = "0.26.1"
http-body = "1.1.0"
http-body-util = "0.1.5"
ipnet = "2.12.1"
ployz-core.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
shell-words = "1.1.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
toml = "1.1.4"
tonic = { version = "0.13.1", features = ["transport"] }

[dev-dependencies]
ployz = { path = "../ployz" }
ployz-testkit.workspace = true

[lints]
workspace = true
