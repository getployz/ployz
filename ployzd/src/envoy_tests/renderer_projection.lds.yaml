version_info: "7fea0e6032bb92f9cc4f67fd0838b5563fc40835d520ee514720bab4b9f7a052"
resources:
- "@type": type.googleapis.com/envoy.config.listener.v3.Listener
  name: ployz-http
  per_connection_buffer_limit_bytes: 32768
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8080
  metadata:
    filter_metadata:
      com.ployz:
        projection_digest: 7fea0e6032bb92f9cc4f67fd0838b5563fc40835d520ee514720bab4b9f7a052
  filter_chains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        stat_prefix: ingress_http
        codec_type: AUTO
        use_remote_address: true
        generate_request_id: true
        preserve_external_request_id: false
        always_set_request_id_in_response: true
        common_http_protocol_options:
          idle_timeout: 300s
        http2_protocol_options:
          max_concurrent_streams: 100
          initial_stream_window_size: 65536
          initial_connection_window_size: 1048576
        stream_idle_timeout: 300s
        request_headers_timeout: 15s
        upgrade_configs:
        - upgrade_type: websocket
        access_log:
        - name: envoy.access_loggers.stdout
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
            log_format:
              json_format:
                request_id: "%REQ(X-REQUEST-ID)%"
                hostname: "%REQ(:AUTHORITY)%"
                method: "%REQ(:METHOD)%"
                path: "%PATH(NQ:PATH)%"
                status: "%RESPONSE_CODE%"
                duration_ms: "%DURATION%"
                upstream: "%UPSTREAM_HOST%"
                envoy_failure_details: "%RESPONSE_CODE_DETAILS%"
        rds:
          route_config_name: http
          config_source:
            resource_api_version: V3
            path_config_source:
              path: /config/rds.yaml
              watched_directory:
                path: /config
        http_filters:
        - name: envoy.filters.http.router
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
