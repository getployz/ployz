:root {
  --background:#fff; --foreground:#111; --card:#fff; --popover:#fff; --muted:#f2f2f2; --muted-fg:#666; --secondary:#fafafa;
  --border:#dedede; --ring10:rgba(17,17,17,.10); --ring20:rgba(17,17,17,.20);
  --destructive:hsl(1 62% 44%); --destructive-soft:hsl(1 68% 95%); --destructive-border:hsl(1 64% 85%);
  --success:hsl(152 38% 42%); --success-soft:hsl(152 38% 91%); --success-border:hsl(152 38% 80%);
  --warning:hsl(44 70% 40%); --warning-soft:hsl(44 78% 90%); --warning-border:hsl(44 78% 80%);
  --info:hsl(220 72% 45%); --info-soft:hsl(220 80% 95%); --info-border:hsl(220 80% 85%);
  --changed:#d0268c; --changed-deep:#a80068; --changed-soft:#fff0f7; --changed-border:#efb3ce;
  --shadow-md:0 1px 3px 0 hsl(0 0% 0% / .10), 0 2px 4px -1px hsl(0 0% 0% / .10);
  --shadow-lg:0 1px 3px 0 hsl(0 0% 0% / .10), 0 4px 6px -1px hsl(0 0% 0% / .10);
  --sans:"Geist Variable", ui-sans-serif, sans-serif; --mono:"Geist Mono Variable", ui-monospace, monospace;
  --proto:#6d28d9;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { font:14px/1.43 var(--sans); color:var(--foreground); background:#e9e9ec; display:flex; gap:16px; padding:10px; min-width:1630px; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.mono { font-family:var(--mono); }
.muted { color:var(--muted-fg); }

/* app frame */
#app { position:relative; width:1280px; height:800px; background:var(--background); overflow:hidden; flex-shrink:0; border-radius:10px; box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08); }
.side { position:absolute; left:0; top:0; bottom:0; width:56px; border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding-top:12px; gap:6px; background:#fff; z-index:5; }
.side .nav { width:40px; height:36px; display:grid; place-items:center; border-radius:10px; color:#444; }
.side .nav svg.i { width:20px; height:20px; stroke-width:1.75; }
.side .nav.on { background:var(--muted); color:#111; }
.side .sep { width:22px; height:1px; background:var(--border); margin:6px 0; }
.side .grow { flex:1; }
.avatar-me { width:32px; height:32px; border-radius:50%; background:var(--muted); display:grid; place-items:center; font-size:12px; font-weight:500; color:#444; border:1px solid var(--border); margin:6px 0 12px; }
.logo { width:26px; height:26px; position:relative; margin-bottom:14px; }
.logo span { position:absolute; width:18px; height:18px; border-radius:5px; }
.logo span:first-child { left:0; bottom:0; background:#f2a3c8; }
.logo span:last-child { right:0; top:0; background:var(--changed); }
.top { position:absolute; left:56px; right:0; top:0; height:48px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:10px; font-size:12px; background:#fff; z-index:4; }
.crumb { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 8px; border-radius:8px; }
.crumb.boxed { border:1px solid var(--border); }
.crumb svg.i { width:12px; height:12px; color:#666; }
.top .slash { color:#999; font-size:14px; }
.top .here { font-weight:600; font-size:14px; }

/* canvas */
.canvas { position:absolute; left:56px; top:48px; right:0; bottom:0; background-color:#fff; background-image:radial-gradient(circle, #cfcfcf 1px, transparent 1.3px); background-size:14px 14px; overflow:hidden; }
.canvas .dim { position:absolute; inset:0; background:rgba(0,0,0,.11); pointer-events:none; z-index:20; }
.world { position:absolute; inset:0; transition:transform .35s ease; }
.canvas-tools { position:absolute; right:16px; top:16px; display:flex; gap:8px; z-index:3; }
.node { position:absolute; width:330px; }
.card { position:relative; z-index:2; width:330px; min-height:165px; background:var(--card); border-radius:16px; box-shadow:0 0 0 1px var(--ring10); display:flex; flex-direction:column; justify-content:space-between; font-size:12px; cursor:pointer; }
.card:hover { box-shadow:0 0 0 1px var(--ring20); }
.card.sel { box-shadow:0 0 0 2px var(--foreground); }
.card.down { box-shadow:0 0 0 1px var(--destructive); }
.card .hd { display:flex; align-items:flex-start; gap:12px; padding:24px 24px 0; }
.card .who { min-width:0; flex:1; }
.card .name { font-weight:500; font-size:13px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .sub { color:var(--muted-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.card .bd { padding:0 24px 22px; }
.card .mid { padding:10px 24px 0; }
.av { width:34px; height:34px; border-radius:50%; background:var(--muted); display:grid; place-items:center; color:#555; box-shadow:0 0 0 1px var(--border); flex-shrink:0; }
.av svg.i { width:18px; height:18px; stroke-width:1.6; }
.status { display:flex; align-items:center; gap:8px; min-width:0; }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.ok { background:var(--success); box-shadow:0 0 0 4px var(--success-soft); }
.dot.warn { background:var(--warning); box-shadow:0 0 0 4px var(--warning-soft); animation:pulse 1.4s ease-in-out infinite; }
.dot.bad { background:var(--destructive); box-shadow:0 0 0 4px var(--destructive-soft); }
.dot.idle { border:1.5px solid var(--muted-fg); }
@keyframes pulse { 50% { opacity:.45; } }
.w-ok { color:var(--success); } .w-warn { color:var(--warning); } .w-bad { color:var(--destructive); } .w-quiet { color:var(--muted-fg); }
.tabular { font-variant-numeric:tabular-nums; }

function fmt(s) { return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`; }

function statusHtml(s) {
  switch (s.tone) {
    case 'quiet': return `${I('cloudoff', 'w-warn')}<span class="w-warn">${s.text}</span>`;
    case 'warn': return `<span class="dot warn"></span><span class="w-warn">${s.text}</span>`;
    case 'bad': return `<span class="dot bad"></span><span class="w-bad">${s.text}</span>`;
    case 'idle': return `<span class="dot idle"></span><span class="w-quiet">${s.text}</span>`;
    case 'busy': return `${I('loader', 'spin')}<span class="w-quiet">${s.text}</span>`;
    default: return `<span class="dot ok"></span><span class="w-ok">${s.text || 'Online'}</span>`;
  }
}
function dbStatus(w) {
  const db = w.db;
  switch (db.mode) {
    case 'switching': return `<span class="dot warn"></span><span class="w-warn tabular">${db.word || 'Moving'} · down <span data-tick="${db.secs}">${fmt(db.secs)}</span></span>`;
    case 'down': return `<span class="dot bad"></span><span class="w-bad">Down since ${STOP}</span>`;
    case 'notrunning': return `${I('crash', 'w-bad')}<span class="w-bad">Not running</span>`;
    case 'waiting': return `${I('loader', 'spin')}<span class="w-quiet">Restore waits until 09:49</span>`;
    case 'restoring': return `${I('loader', 'spin')}<span class="w-quiet">Restoring on fsn-2</span>`;
    case 'stopped': return `<span class="dot idle"></span><span class="w-quiet">Not running · restored</span>`;
    case 'starting': return `${I('loader', 'spin')}<span class="w-quiet">Starting on fsn-2</span>`;
  }
  return statusHtml(w.st.db || { tone:'ok' });
}

function actBtns(w, acts, size) {
  return acts.map((a) => `<button class="btn ${size} ${a.ink ? 'ink' : 'outline'}${hint(w, a.act)}"${A(a.act)}>${a.label}</button>`).join('');
}
function issueTray(w, i) {
  const cls = i.tone === 'bad' ? '' : i.tone === 'info' ? ' info' : ' warn';
  const ic = i.tone === 'info' ? 'info' : 'alert';
  const facts = i.facts.length ? `<div class="d">${i.facts.map((f) => `<div>${f}</div>`).join('')}</div>` : '<div class="d"></div>';
  const acts = i.busy ? `<div class="busy">${I('loader', 'spin')}${i.busy}</div>` : i.acts.length ? `<div class="acts">${actBtns(w, i.acts, 'xs')}</div>` : '';
  return `<div class="alert-tray${cls}"><div class="t">${I(ic)}<span>${i.title}</span></div>${facts}${acts}</div>`;
}
function dbTray(w) {
  const v = w.vol, sel = w.panel === 'vol';
  const wl = v.writer ? `<div class="ln">${I('drive')}<span class="tn">data · ${v.writer}</span>${v.wnote ? `<span class="rt">${v.wnote}</span>` : ''}</div>`
    : `<div class="ln warn">${I('drive')}<span class="tn">data</span><span class="rt">no writer</span></div>`;
  const ml = v.mirror ? `<div class="ln">${I('layers')}<span class="tn">${mname(w)} · mirror</span><span class="rt">${v.mirror.note}</span></div>` : '';
  if (w.vol.writer === null && !v.mirror) return '';
  return `<div class="tray${ml ? ' two' : ''}${sel ? ' sel' : ''}${hint(w, 'tray-data')}"${A('tray-data')}>${ml ? wl + ml : wl.replace('<div class="ln">', '').replace(/<\/div>$/, '')}</div>`;
}

function dbMid(w) {
  const db = w.db;
  if (db.mode === 'copying') return { chip:`<span class="badge info">Moving</span>`, sub:'Copying changes to fsn-2',
    mid:`<div class="mid"><div class="progress"><i style="width:${db.pct}%"></i></div><div class="prog-meta"><span>${db.line}</span><span class="tabular">${db.pct}%</span></div></div>`,
    right:`<button class="btn xs outline${hint(w, 'card-cancel')}"${A('card-cancel')} style="margin-left:auto">Cancel</button>` };
  if (db.mode === 'switching') {
    const to = db.dir || 'fsn-2';
    const steps = db.word === 'Releasing' ? ['Start on fsn-1'] : ['Freeze', 'Final copy', `Start on ${to}`];
    const at = /Start/.test(db.stage) ? steps.length - 1 : /Final/.test(db.stage) ? 1 : 0;
    return { chip:`<span class="badge warning">${db.word || 'Moving'}</span>`, sub:db.stage,
      mid:`<div class="mid" style="display:flex;gap:4px">${steps.map((s, i) => `<div style="flex:1"><div class="progress amber"><i style="width:${i < at ? 100 : i === at ? 50 : 0}%"></i></div><div class="prog-meta" style="margin-top:4px"><span${i === at ? ' style="color:#111"' : ''}>${s}</span></div></div>`).join('')}</div>` };
  }
  if (db.mode === 'down') return { chip:`<span class="badge destructive">${I('alert')}Move stopped</span>`, sub:'Moving to fsn-2' };
  if (db.mode === 'waiting' || db.mode === 'restoring') return { chip:`<span class="badge info">Restoring</span>` };
  return {};
}

function card(w, svc, issueOnCard) {
  const [x, y] = POS[variant][svc];
  const meta = SVC[svc];
  let chip = '', mid = '', right = '', sub = w.sub[svc] || meta.sub, status;
  if (svc === 'db') {
    const m = dbMid(w); chip = m.chip || ''; mid = m.mid || ''; right = m.right || '';
    sub = m.sub || w.sub.db || `postgres:17 · ${w.db.on}`;
    if (w.db.chip) chip = `<span class="badge ${w.db.chip.v}">${w.db.chip.t}</span>`;
    status = dbStatus(w);
  } else status = statusHtml(w.st[svc] || { tone:'ok' });
  const down = svc === 'db' && (w.db.mode === 'down' || w.db.mode === 'notrunning');
  const ctx = svc === 'db' ? `${A('db-menu')} data-ctx="db"` : '';
  const c = `<div class="card${down ? ' down' : ''}${svc === 'db' ? hint(w, 'db-menu') : ''}"${ctx}>
    <div class="hd"><div class="av">${I(meta.icon)}</div><div class="who"><div class="name">${svc}</div><div class="sub">${sub}</div></div>${chip}</div>
    ${mid}<div class="bd"><div class="status">${status}${right}</div></div></div>`;
  let tray = '';
  if (svc === 'db') tray = dbTray(w);
  if (svc === 'cache') tray = `<div class="tray">${I('drive')}<span class="tn">cache-data · ${w.cacheTray}</span>${w.cacheTray === 'lost' ? '' : ''}</div>`;
  const iss = w.issues.filter((i) => i.svc === svc && (issueOnCard || i.pin)).map((i) => issueTray(w, i)).join('');
  return `<div class="node" style="left:${x}px;top:${y}px">${c}${tray}${iss}</div>`;
}

function strip(w) {
  const rows = w.issues.filter((i) => !i.pin);
  if (!w.notice && !rows.length) return { html:'', h:0 };
  const tone = w.notice ? w.notice.tone : 'warn';
  const r = rows.map((i) => {
    const ac = i.busy ? `<span class="busy">${I('loader', 'spin')}${i.busy}</span>` : actBtns(w, i.acts, 'xs');
    return `<div class="sr"><div class="nm">${I(SVC[i.svc].icon)}${i.svc}</div><div class="fx"><b>${i.title}.</b> ${i.facts.join(' ')}</div><div class="ac">${ac}</div></div>`;
  }).join('');
  const head = w.notice ? w.notice.html : 'Needs attention';
  return { html:`<div class="strip${tone === 'info' ? ' info' : ''}"><div class="sh">${I(tone === 'info' ? 'info' : 'cloudoff')}<span>${head}</span></div>${r}</div>`, h:44 + 44 * rows.length + 12 };
}

const DEFAULT_RUNS = [{ t:'Sync data-fsn-2', s:'Succeeded · 1.1 GB', when:'09:31' }, { t:'Mirror data to fsn-2', s:'Succeeded · 412 GB', when:'2 days ago' }];

function outcome(lines, plain) {
  return `<div class="outcome${plain ? ' plain' : ''}">${lines.map(([ic, t]) => `<div class="o">${I(ic)}<div>${t}</div></div>`).join('')}</div>`;
}
function dialog(w) {
  const d = w.dialog; if (!d) return '';
  if (d.kind === 'cache') {
    return `<div class="overlay"><div class="dialog"><button class="btn icon ghost x">${I('x')}</button>
      <div class="dh"><div class="dt">Start cache empty on fsn-2</div><div class="dd">cache-data had no other copy.</div></div>
      <div class="db">${outcome([['alert', 'cache starts on fsn-2 with an empty cache-data. Nothing comes back from fsn-1.']])}</div>
      <div class="df"><button class="btn outline">Cancel</button><button class="btn ink${hint(w, 'cache-go')}"${A('cache-go')}>Start empty</button></div></div></div>`;
  }
  const restore = d.kind === 'restore';
  const liveOn = d.from || 'fsn-1', mirOn = w.vol.mirror ? w.vol.mirror.on : (liveOn === 'fsn-1' ? 'fsn-2' : 'fsn-1');
  const fromOpt = (on, off, s1, s2, why) => `<div class="srv-opt${on ? ' on' : ''}${off ? ' off' : ''}"><span class="radio"></span>${I(s1.startsWith('data-') ? 'layers' : 'drive')}<div><div class="s1">${s1}</div><div class="s2">${s2}${why ? ` · <span class="why">${why}</span>` : ''}</div></div></div>`;
  const live = restore ? fromOpt(false, true, `data on ${liveOn}`, 'the writer', 'fsn-1 not reporting since 09:38')
    : fromOpt(true, false, `data on ${liveOn}`, 'the writer · live, db keeps running while it copies');
  const mir = restore ? fromOpt(true, false, `data-${mirOn} on ${mirOn}`, 'read-only mirror · synced 09:31')
    : fromOpt(false, true, `data-${mirOn} on ${mirOn}`, `read-only mirror`, `${liveOn} still holds data`);
  const servers = ['fsn-1', 'fsn-2', 'fsn-3'].map((s) => {
    const here = s === liveOn && !restore, gone = restore && s === 'fsn-1';
    const target = s === d.to;
    const note = here ? 'Runs here now' : gone ? 'Not reporting since 09:38' : target ? `Holds the mirror ${restore ? 'data-' + s : 'data-' + s}` : restore ? 'Restore stays on the copy\'s Server' : 'Delete the mirror first';
    return `<div class="srv-opt${target ? ' on' : ''}${target ? '' : ' off'}"><span class="radio"></span>${I('server')}<div><div class="s1">${s}</div><div class="s2">${note}</div></div></div>`;
  }).join('');
  let more, foot;
  if (!restore) {

      ${outcome([['check', `db runs on ${d.to}. ${liveOn} keeps <b>data-${liveOn}</b> as the mirror.`]], true)}
      <div class="note warn">${I('alert')}<span>If the Move stops before the handover, Put back returns db to ${liveOn}. After the handover, only Move again.</span></div>`;
    foot = `<button class="btn outline">Cancel</button><button class="btn ink${hint(w, 'move-go')}"${A('move-go')}>Move</button>`;
  } else {
    more = `${outcome([
        ['undo', '<b>db\'s data goes back to 09:31.</b> Writes after 09:31 are lost.'],
        ['server', '<b>fsn-1 is removed.</b> web and api lose their replicas there.'],
        ['alert', '<b>cache-data has no other copy.</b> It is lost with fsn-1.'],
        ['square', 'db does not start by itself. You start it when the restore is done.'],
        ['history', 'Restore can start at <b>09:49</b>, 11 min after fsn-1 last reported.'],
      ])}
      <div class="guard"><div class="lbl" style="margin-bottom:6px">Type <b>fsn-1</b> to confirm</div><div class="input${d.typed ? ' typed' : ''}${hint(w, 'guard')}"${A('guard')}>${d.typed ? 'fsn-1' : '<span class="ph">fsn-1</span>'}</div></div>`;

    <div class="df">${foot}</div></div></div>`;
}

      <div class="grow"></div><div class="sep"></div><div class="nav">${I('grid')}</div><div class="nav">${I('server')}</div><div class="avatar-me">AL</div></nav>
    <header class="top"><span class="crumb">shop ${I('updown')}</span><span class="slash">/</span><span class="crumb boxed">production ${I('updown')}</span>${deploysOn ? '<span class="slash">/</span><span class="here">Deployments</span>' : ''}<span style="margin-left:auto;color:var(--muted-fg);font-size:12px" class="tabular">simulated time ${w.clock}</span></header>
    <main class="canvas">
      <div class="world" style="transform:translateY(${sp.h}px)">${cards}</div>
      ${notice}${sp.html}
      <div class="canvas-tools"><button class="btn outline" style="height:30px">${I('search')}Find <kbd>/</kbd></button><button class="btn ink" style="height:30px">${I('plus')}Create</button></div>
      ${w.panel ? '<div class="dim"></div>' : ''}${menu(w)}
    </main>
    ${inspector(w)}${dialog(w)}${toast(w)}`;
  renderProto();
  enteredAt = Date.now(); tick();
  history.replaceState(null, '', `#${sc.id}/${cur.n + 1}${list ? '/list' : ''}`);
}
function tick() {
  const el = (Date.now() - enteredAt) / 1000 | 0;
  document.querySelectorAll('[data-tick]').forEach((e) => { e.textContent = fmt(+e.dataset.tick + el); });
}
setInterval(tick, 1000);

function renderProto() {
  const sc = S[cur.s], st = sc.steps[cur.n];
  document.getElementById('proto').innerHTML = `
    <div><h1>Volume recovery · prototype</h1><div class="sub0">Warm Move rev16 primitives · throwaway, not product code</div></div>
    <div class="varl">Where the quiet Server shows</div>
    <div class="var"><button class="${variant === 'cards' ? 'on' : ''}" data-var="cards">On each card</button><button class="${variant === 'list' ? 'on' : ''}" data-var="list">One list on top</button></div>
    <div class="scen">${S.map((x, i) => `<button class="${i === cur.s ? 'on' : ''}" data-scen="${i}"><span class="num">${i + 1}.</span>${x.title}</button>`).join('')}</div>
    <div class="stepbox">
      <div class="stepn"><span>Step ${cur.n + 1} of ${sc.steps.length}</span><span>← → keys</span></div>
      <div class="dots">${sc.steps.map((_, i) => `<i class="${i === cur.n ? 'on' : i < cur.n ? 'done' : ''}" data-dot="${i}"></i>`).join('')}</div>
      <div class="cap">${st.cap}</div>
      ${st.q ? `<div class="q"><b>Open.</b> ${st.q}</div>` : ''}
      <div style="flex:1"></div>
      <div class="ctl"><button id="back" ${cur.n === 0 ? 'disabled' : ''}>Back</button><button id="next" class="next" ${cur.n === sc.steps.length - 1 ? 'disabled' : ''}>Next</button></div>
    </div>
    <label><input type="checkbox" id="hints" ${document.body.classList.contains('nohints') ? '' : 'checked'}> Outline what to click (dashed purple)</label>
    <div class="foot">Click the outlined control, or press Next. Other controls are inert.</div>`;
}

function go(s, n) { cur = { s, n: Math.max(0, Math.min(n, S[s].steps.length - 1)) }; render(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-scen],[data-dot],[data-var],#back,#next,[data-act]');
  if (!t) return;
  if (t.dataset.var) { variant = t.dataset.var; return render(); }
  if (t.dataset.scen) return go(+t.dataset.scen, 0);
  if (t.dataset.dot) return go(cur.s, +t.dataset.dot);
  if (t.id === 'back') return go(cur.s, cur.n - 1);
  if (t.id === 'next') return go(cur.s, cur.n + 1);
  const w = S[cur.s].steps[cur.n].w;
  if (w.hints.includes(t.dataset.act)) { e.preventDefault(); go(cur.s, cur.n + 1); }
  else { t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge'); }
});
document.addEventListener('contextmenu', (e) => {
  const t = e.target.closest('[data-ctx]'); if (!t) return;
  e.preventDefault(); const w = S[cur.s].steps[cur.n].w; if (w.hints.includes('db-menu')) go(cur.s, cur.n + 1);
});
document.addEventListener('change', (e) => { if (e.target.id === 'hints') document.body.classList.toggle('nohints', !e.target.checked); });
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(cur.s, cur.n + 1); if (e.key === 'ArrowLeft') go(cur.s, cur.n - 1); });
(function boot() {
  const [id, n, v] = location.hash.slice(1).split('/');
  if (v === 'list') variant = 'list';
  const s = Math.max(0, S.findIndex((x) => x.id === id));
  go(s, (+n || 1) - 1);
})();
</script></body></html>
