<!doctype html>
<!--
  PROTOTYPE, throw away. Question: what do automatic Server upgrades and manual upgrades from Cloud look like
  when the copy assumes upgrades work? Variant A (a quiet line on Servers), iteration 2.
  Assumptions shown here:
  - Cloud runs the rollout (one Server at a time, like `ployz server upgrade`) and reads each Server's durable
    MachineUpgradeAttempt outcome, so Cloud always learns the result and reports it to PostHog.
  - Automatic is on by default and starts as soon as a release is out. No upgrade windows or holds.
  - Nothing advertises failure. If one fails, the rollout quietly halts and the page falls back to the ordinary
    "release is out" state. Only that Server's page says the upgrade didn't install.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Server upgrades · prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0a0a0a; --surface: #111; --raised: #161616; --muted-surface: #1c1c1c;
    --rule: #2a2a2a; --rule-soft: #202020; --ink: #ededed; --muted: #a1a1a1; --faint: #6f6f6f;
    --green: #5fb98e; --amber: #d4a72c; --red: #e5534b; --blue: #6c9cff; --blue-bg: #111c33;
    --font: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.43 var(--font); }
  button, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .side { border-right: 1px solid var(--rule); padding: 16px 8px; display: flex; flex-direction: column; gap: 4px; }
  .logo { width: 22px; height: 22px; margin: 0 10px 24px; border-radius: 6px; background: linear-gradient(135deg, #d0268c, #8a1a5c); }
  .nav { padding: 8px 10px; border-radius: 10px; color: var(--muted); cursor: pointer; border: 0; background: none; text-align: left; }
  .nav.on { background: var(--muted-surface); color: var(--ink); }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { height: 48px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 500; }
  .crumb { cursor: pointer; }
  .crumb-pill { border: 1px solid var(--rule); border-radius: 8px; padding: 2px 8px; font-size: 12px; }
  .page { padding: 32px 40px 160px; max-width: 1056px; width: 100%; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .small { font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--green); display: inline-block; flex: none; }
  .dot.off { background: var(--red); } .dot.busy { background: var(--blue); animation: pulse 1s infinite; } .dot.amber { background: var(--amber); }
  @keyframes pulse { 50% { opacity: .35; } }
  .btn { height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--muted-surface); }
  .btn.ink { background: var(--ink); color: #0a0a0a; border-color: var(--ink); }
  .btn.danger { color: var(--red); border-color: #5a2020; background: #2a1212; }
  .card { border: 1px solid var(--rule); border-radius: 14px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .srv { padding: 12px 16px; display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; cursor: pointer; }
  .srv:hover { background: var(--surface); }
  .srv .ic { grid-row: span 3; color: var(--muted); padding-top: 2px; }
  .srv .st { grid-row: 1 / span 3; grid-column: 3; align-self: center; display: flex; align-items: center; gap: 8px; }
  .h { font-weight: 500; margin: 28px 0 10px; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; }
  .setting + .setting { border-top: 1px solid var(--rule-soft); }
  .lbl { display: flex; flex-direction: column; }
  select { height: 32px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); padding: 0 10px; color-scheme: dark; }
  .toggle { width: 34px; height: 20px; border-radius: 99px; background: var(--rule); position: relative; border: 0; cursor: pointer; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 99px; background: #0a0a0a; transition: left .16s; }
  .toggle.on { background: var(--ink); } .toggle.on::after { left: 17px; }
  .strip { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; border: 1px solid var(--rule); margin-bottom: 14px; }
  .quiet { margin: -6px 0 14px; display: block; font-size: 12px; color: var(--muted); min-height: 20px; }
  .info { padding: 12px 14px; border-radius: 12px; border: 1px solid #22386a; background: var(--blue-bg); margin-bottom: 14px; }
  .link { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .6); display: grid; place-items: center; z-index: 50; }
  .dialog { width: 480px; background: var(--raised); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgb(0 0 0 / .1), 0 4px 6px -1px rgb(0 0 0 / .1); }
  .dialog h3 { margin: 0 0 16px; font-size: 16px; font-weight: 500; }
  /* prototype chrome */
  .proto { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: #fafafa; color: #111; border-radius: 14px; box-shadow: 0 8px 30px rgb(0 0 0 / .5); font-size: 12px; }
  .proto > * { white-space: nowrap; flex: none; }
  .proto button, .proto select { height: 28px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #111; padding: 0 10px; cursor: pointer; }
  .proto .sep { width: 1px; height: 20px; background: #ddd; }
  .events { position: fixed; right: 16px; top: 64px; bottom: 76px; width: 380px; overflow: auto; background: #000; border: 1px solid var(--rule); border-radius: 12px; padding: 12px; font: 11px/1.5 var(--mono); z-index: 90; }
  .events h4 { margin: 0 0 4px; font: 500 12px var(--font); color: var(--ink); }
  .events p { margin: 0 0 12px; font: 12px var(--font); color: var(--muted); }
  .ev { border-top: 1px solid var(--rule-soft); padding: 8px 0; white-space: pre; color: #9fd3b6; }
  .ev.bad { color: #f0b3b0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="proto" id="proto"></div>
<div class="events" id="events" hidden></div>
<script>
const SCENARIOS = {
  auto: 'Release out, automatic',
  manual: 'Release out, manual',
  current: 'Up to date',
  failed: 'bughunt-2 upgrade fails',
  offline: 'One server offline',
  major: 'New line 1.0 out',
};
const ICON_SRV = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2"/><rect x="2" y="9" width="12" height="4.5" rx="1.2"/></svg>';
const PROFILE = { os: 'ubuntu-24.04', arch: 'x86_64', provider: 'hetzner' };

let S, timer;

function load(scenario) {
  clearInterval(timer);
  scenario ??= new URLSearchParams(location.search).get('scenario') ?? 'auto';
  S = {
    scenario, sel: null, dialog: false, showEvents: S?.showEvents ?? true,
    auto: scenario !== 'manual', channel: 'stable', latest: '0.2.2', major: null,
    servers: ['bughunt-1', 'bughunt-2', 'ployz-prod-1', 'ployz-stable-soak'].map((name, i) => ({
      name, version: '0.2.1', online: true, failNext: false, lastFailure: null,
      services: ['Only runs builds', 'web · express-hello-world · postgres', 'db · gh · redis · nginx', 'mongodb · web · whoami'][i],
    })),
    run: null, lastRun: null, events: [],
  };
  if (scenario === 'current' || scenario === 'major') S.servers.forEach(s => (s.version = '0.2.2'));
  if (scenario === 'current') S.lastRun = { when: 'last night' };
  if (scenario === 'major') S.major = '1.0.0';
  if (scenario === 'failed') S.servers[1].failNext = true;
  if (scenario === 'offline') S.servers[2].online = false;
  if (S.auto) startRun(behind().map(s => s.name), 'automatic');
  history.replaceState(null, '', `?scenario=${scenario}`);
  render();
}

const srv = n => S.servers.find(s => s.name === n);
const behind = () => S.servers.filter(s => s.version !== S.latest);

function startRun(names, trigger) {
  const order = names.filter(n => srv(n).online && srv(n).version !== S.latest);
  if (!order.length) return;
  S.run = { target: S.latest, trigger, order, i: 0, ticks: 0 };
  clearInterval(timer);
  timer = setInterval(step, 900);
}

// ponytail: two ticks per server; install stages stay out of the UI in this design
function step() {
  const r = S.run;
  const s = srv(r.order[r.i]);
  if (++r.ticks < 2) return render();
  r.ticks = 0;
  const from = s.version;
  if (s.failNext) {
    s.failNext = false;
    s.lastFailure = r.target;
    // the new daemon never answered, so the upgrade worker put the previous release back
    const error = `Machine API readiness timed out after 10s; restored ${from}`;
    s.lastError = `Readiness: ${error}`;
    capture(s, from, r, { outcome: 'failed', failed_stage: 'readiness', error });
    S.run = null; // halt quietly so a bad release doesn't reach the next Server
    clearInterval(timer);
    return render();
  }
  s.version = r.target;
  s.lastFailure = null;
  capture(s, from, r, { outcome: 'succeeded' });
  if (++r.i >= r.order.length) {
    S.lastRun = { when: 'just now' };
    S.run = null;
    clearInterval(timer);
  }
  render();
}

function capture(s, from, r, result) {
  S.events.unshift({
    event: `server_upgrade_${result.outcome}`,
    // automatic runs have no clicking user, so they land on the org's system person
    distinct_id: r.trigger === 'automatic' ? 'system:org_7f3k' : 'user_2b9q',
    properties: { ...result, trigger: r.trigger, from_version: from, to_version: r.target, ...PROFILE, total_seconds: 41 + Math.round(Math.random() * 20) },
  });
}

/* ---------- pages ---------- */

function summaryLine() {
  const off = S.servers.filter(s => !s.online).length;
  return off ? `<span class="dot off"></span>${off} offline · ${S.servers.length - off} online` : `<span class="dot"></span>All ${S.servers.length} online`;
}

function newsLine() {
  const n = behind().length;
  const done = S.servers.length - n;
  const offBehind = behind().filter(s => !s.online);
  const settings = `<button class="link" data-act="settings">${S.auto ? 'Upgrades automatically' : 'Manual upgrades'}</button>`;
  if (S.run) {
    return `<div class="quiet"><span class="dot busy" style="margin-right:6px"></span>Upgrading to <span class="mono">${S.run.target}</span> · ${done} of ${S.servers.length} done</div>`;
  }
  if (!n) {
    return `<div class="quiet">On Ployz <span class="mono">${S.latest}</span>${S.lastRun ? `, upgraded ${S.lastRun.when}` : ''} · ${settings}</div>`;
  }
  if (S.auto && n === offBehind.length) {
    return `<div class="quiet">On Ployz <span class="mono">${S.latest}</span> · ${offBehind.map(s => s.name).join(', ')} upgrades when it's back · ${settings}</div>`;
  }
  // the one actionable state: manual mode, or an automatic run that halted
  return `<div class="strip"><span class="dot amber"></span>
    <div style="flex:1">Ployz <span class="mono">${S.latest}</span> is out<span class="muted"> · ${done ? `${done} of ${S.servers.length} upgraded` : `your servers run ${behind()[0].version}`}</span></div>
    <button class="btn ghost" data-act="settings" style="border-color:transparent;background:none;color:var(--muted)">${S.auto ? 'Automatic' : 'Manual'}</button>
    <button class="btn ${S.auto ? '' : 'ink'}" data-act="upgrade">Upgrade${done ? ' the rest' : ''}</button></div>`;
}

function majorNotice() {
  return S.major ? `<div class="info row between"><div class="lbl"><span>Ployz ${S.major} is out</span>
    <span class="muted small">New lines install only when you choose. Your servers stay on 0.x and keep getting its upgrades.</span></div>
    <button class="btn">See what's new</button></div>` : '';
}

function statusFor(s) {
  if (S.run && S.run.order[S.run.i] === s.name) return '<span class="dot busy"></span><span>Upgrading</span>';
  if (!s.online) return '<span class="dot off"></span><span>Offline</span>';
  return '<span class="dot"></span><span>Online</span>';
}

function serversPage() {
  return `
    <div class="row between" style="margin-bottom:18px"><div class="row">${summaryLine()}</div><button class="btn">+ Add server</button></div>
    ${majorNotice()}${newsLine()}
    <div class="list">${S.servers.map(s => `
      <div class="card srv" data-act="open:${s.name}">
        <span class="ic">${ICON_SRV}</span>
        <span style="font-weight:500">${s.name}</span>
        <span class="st">${statusFor(s)}<span class="faint">›</span></span>
        <span class="muted">${s.services}</span>
        <span class="muted">Managed volumes available · <span class="mono">${s.version}</span></span>
      </div>`).join('')}</div>`;
}

function serverPage(s) {
  const behindHere = s.version !== S.latest;
  let note = 'Up to date';
  if (S.run?.order[S.run.i] === s.name) note = `Upgrading to ${S.run.target}`;
  else if (s.lastFailure) note = `${s.lastFailure} didn't install. Nothing changed, and we're on it. <button class="link" data-act="details">${S.showDetails ? 'Hide details' : 'Show details'}</button>`;
  else if (behindHere && !s.online && S.auto) note = `Upgrades to ${S.latest} when it's back`;
  else if (behindHere) note = `${S.latest} is out`;
  return `
    <div class="row" style="margin-bottom:22px">${statusFor(s)}<span class="mono muted" style="margin-left:10px">203.0.113.10</span></div>
    <div class="h">Ployz</div>
    <div class="card"><div class="setting"><div class="lbl"><span class="mono">${s.version}</span><span class="muted small">${note}</span></div>
      ${behindHere && s.online && !S.run ? `<button class="btn" data-act="upgrade-one:${s.name}">${s.lastFailure ? 'Try again' : 'Upgrade'}</button>` : ''}</div>
      ${s.lastFailure && S.showDetails ? `<div class="setting"><pre class="mono muted" style="margin:0;white-space:pre-wrap">${s.lastError}</pre><button class="btn" data-act="copy">Copy</button></div>` : ''}</div>
    <div class="h">Running here</div><div class="card setting"><span>4 services</span><span class="faint">›</span></div>
    <div class="h">Builds</div><div class="card setting"><span>Run builds here</span><button class="toggle on"></button></div>
    <div class="card setting" style="margin-top:28px;border-color:#5a2020;background:#2a1212"><div class="lbl"><span>Remove ${s.name}</span><span class="muted">Resets it and takes it out of the cluster.</span></div><button class="btn danger">Remove server</button></div>`;
}

function settingsDialog() {
  return `<div class="scrim" data-act="close"><div class="dialog">
    <h3>Server upgrades</h3>
    <div class="card">
      <div class="setting"><div class="lbl"><span>Upgrade automatically</span><span class="muted small">Your apps keep running while servers upgrade.</span></div>
        <button class="toggle ${S.auto ? 'on' : ''}" data-act="auto"></button></div>
      <div class="setting"><span>Releases</span><select data-change="channel"><option ${S.channel === 'stable' ? 'selected' : ''}>Stable</option><option ${S.channel === 'beta' ? 'selected' : ''}>Beta</option></select></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ink" data-act="close">Done</button></div>
  </div></div>`;
}

/* ---------- render ---------- */

function render() {
  const s = S.sel && srv(S.sel);
  const crumb = s ? `<span class="crumb muted" data-act="back">Servers</span><span class="faint">/</span><span class="crumb-pill">${s.name} ⌄</span>` : 'Servers';
  document.getElementById('app').innerHTML = `
    <div class="app">
      <aside class="side"><div class="logo"></div><button class="nav">Projects</button><button class="nav on" data-act="back">Servers</button><button class="nav">Organization</button></aside>
      <main class="main"><div class="top">${crumb}</div><div class="page" style="${S.showEvents ? 'padding-right:420px' : ''}">${s ? serverPage(s) : serversPage()}</div></main>
    </div>${S.dialog ? settingsDialog() : ''}`;
  document.getElementById('proto').innerHTML = `
    <b>A · Upgrades just work</b><span class="sep"></span>
    <select data-scenario>${Object.entries(SCENARIOS).map(([k, l]) => `<option value="${k}" ${k === S.scenario ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <button data-act="restart">Restart</button>
    ${S.servers.some(s => !s.online) ? '<button data-act="bring-back">Bring server back</button>' : ''}
    <button data-act="events">${S.showEvents ? 'Hide' : 'Show'} PostHog</button>`;
  const ev = document.getElementById('events');
  ev.hidden = !S.showEvents;
  ev.innerHTML = `<h4>PostHog · Ployz team only</h4><p>Cloud captures one event per Server per upgrade attempt, read from the Server's own upgrade record. Users never see this.</p>
    ${S.events.map(e => `<div class="ev ${e.properties.outcome === 'succeeded' ? '' : 'bad'}">${e.event} · ${e.distinct_id}\n${JSON.stringify(e.properties, null, 2)}</div>`).join('') || '<p class="faint">No events yet.</p>'}`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const [act, arg] = el.dataset.act.split(/:(.*)/s);
  if (act === 'close' && e.target !== el) return;
  switch (act) {
    case 'open': S.sel = arg; break;
    case 'back': S.sel = null; break;
    case 'upgrade': startRun(behind().map(s => s.name), 'manual'); break;
    case 'upgrade-one': startRun([arg], 'manual'); break;
    case 'settings': S.dialog = true; break;
    case 'close': S.dialog = false; break;
    case 'auto': S.auto = !S.auto; if (S.auto && !S.run) startRun(behind().map(s => s.name), 'automatic'); break;
    case 'details': S.showDetails = !S.showDetails; break;
    case 'copy': navigator.clipboard?.writeText(S.servers.find(x => x.name === S.sel).lastError); break;
    case 'events': S.showEvents = !S.showEvents; break;
    case 'restart': return load(S.scenario);
    case 'bring-back': S.servers.forEach(s => (s.online = true)); if (S.auto && !S.run) startRun(behind().map(s => s.name), 'automatic'); break;
  }
  render();
});

document.addEventListener('change', e => {
  if (e.target.matches('[data-scenario]')) return load(e.target.value);
  if (e.target.dataset.change === 'channel') S.channel = e.target.value.toLowerCase();
  render();
});

load();
</script>
</body>
</html>
