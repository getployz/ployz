name: ployz-cloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: ployz-cloud-postgres
    command:
      - -c
      - listen_addresses=*
    ports:
      - '8394:5432'
    environment:
      POSTGRES_DB: ployz_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d ployz_cloud' ]
      interval: 5s
      timeout: 5s
      retries: 10

  # The uptime checker in `all` mode. Apply migrations first with `pnpm db:migrate`.
  uptime:
    profiles: [ uptime ]
    build:
      context: ..
      dockerfile: dashboard/uptime/Dockerfile
    container_name: ployz-cloud-uptime
    command: [ all ]
    ports:
      - '8395:8080'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ployz_cloud
      # Probe regions, comma separated, each `code` or `code=Name`. The dashboard shows the name, else the code.
      # `all` probes from the first region only and defaults to `local`.
      # UPTIME_REGIONS: ams=Amsterdam
    depends_on:
      postgres:
        condition: service_healthy

  inngest:
    image: inngest/inngest
    container_name: ployz-cloud-inngest
    network_mode: host
    command:
      - inngest
      - dev
      - --no-discovery
      - --no-poll

volumes:
  postgres-data:
