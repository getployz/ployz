name: ployz-cloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: ployz-cloud-postgres
    command:
      - -c
      - listen_addresses=*
    ports:
      - '8394:5432'
    environment:
      POSTGRES_DB: ployz_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d ployz_cloud' ]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest
    container_name: ployz-cloud-inngest
    network_mode: host
    command:
      - inngest
      - dev
      - -u
      - https://ployz-cloud.localhost/api/inngest

volumes:
  postgres-data:
