minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # CVE-2026-102989 patch (#1312), published 2026-09-30; drop once past 2026-10-02.
  - "@tanstack/*"
  # Polar API 2026-10 clients, requested before they aged in; drop once past 2026-10-02.
  - "@polar-sh/sdk@1.0.0"
  - "@polar-sh/better-auth@2.0.0"
  - "@polar-sh/adapter-utils@1.0.0"
blockExoticSubdeps: false

allowBuilds:
  core-js: false
  esbuild: true
  inngest-cli: true
  lightningcss: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - lightningcss
ignoredBuiltDependencies:
  - msw
  - protobufjs

overrides:
  nf3: 0.3.17

patchedDependencies:
  '@better-auth/core@1.7.7': patches/@better-auth__core@1.7.7.patch
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
