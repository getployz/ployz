minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@tanstack/*"
blockExoticSubdeps: false

allowBuilds:
  esbuild: true
  inngest-cli: true
  lightningcss: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - lightningcss
ignoredBuiltDependencies:
  - msw
  - protobufjs

overrides:
  nf3: 0.3.17

patchedDependencies:
  '@tanstack/db@0.9.2': patches/@tanstack__db@0.9.2.patch
