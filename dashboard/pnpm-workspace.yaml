minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # CVE-2026-102989 patch (#1312), published 2026-09-30; drop once past 2026-10-02.
  - "@tanstack/*"
  # Polar API 2026-10 clients, requested before they aged in; drop once past 2026-10-02.
  - "@polar-sh/sdk@1.0.0"
  - "@polar-sh/better-auth@2.0.0"
  - "@polar-sh/adapter-utils@1.0.0"
  # Better Auth 1.7.16 security fixes (revoked sessions, OAuth email_verified, wildcard origins), published 2026-11-03; drop once past 2026-11-05.
  - "better-auth@1.7.16"
  - "@better-auth/cimd@1.7.16"
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/mcp@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/oauth-provider@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - "better-call@1.4.5"
blockExoticSubdeps: false

allowBuilds:
  core-js: false
  esbuild: true
  inngest-cli: true
  lightningcss: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - lightningcss
ignoredBuiltDependencies:
  - msw
  - protobufjs

overrides:
  nf3: 0.3.17
  # Below 1.6.11 a request body sent to a server function can stall the server while it is read.
  'seroval@>=1.6.0 <1.6.11': 1.6.11
  'seroval-plugins@>=1.6.0 <1.6.11': 1.6.11
  # Floors for Dependabot advisories on transitive packages whose parents still allow the vulnerable versions.
  '@azure/identity@<4.14.1': ^4.14.1
  '@modelcontextprotocol/sdk@<1.32.0': ^1.32.0
  'adm-zip@<0.6.1': 0.6.1
  'dompurify@<3.4.17': ^3.4.17
  'hono@<4.13.16': ^4.13.16
  'launch-editor@<2.14.2': ^2.14.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.8
  'shell-quote@<1.11.0': ^1.11.0
  'solid-js@>=1.9.0 <1.9.19': ^1.9.19
  'source-map-js@<1.2.2': ^1.2.2
  'systeminformation@<5.33.16': ^5.33.16
  'undici@>=7.0.0 <7.30.1': ^7.30.1

patchedDependencies:
  '@better-auth/core@1.7.16': patches/@better-auth__core@1.7.16.patch
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
