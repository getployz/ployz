[workspace]
members = [
    "crates/ployz-build-executor",
    "crates/ployz-core",
    "crates/ployz-nats",
    "ebpf/common",
    "ebpf/control",
    "crates/ployz-host-runner",
    "testing/ployz-test-support",
    "testing/ployz-e2e",
    "testing/ployz-test-lease-worker",
    "crates/ployzd",
    "crates/ployz",
    "crates/ployz-sdk-types",
    "crates/ployz-telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
atomic-write-file = "0.3"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getifs = "0.6"
getrandom = "0.3"
hickory-proto = "0.26"
hmac = "0.12"
local-ip-address = "0.6"
public-ip-address = { version = "0.4", default-features = false, features = ["blocking"] }
defguard_wireguard_rs = "0.10"
ployz-core = { path = "crates/ployz-core" }
ployz-build-executor = { path = "crates/ployz-build-executor" }
ployz-host-runner = { path = "crates/ployz-host-runner" }
ployz-nats = { path = "crates/ployz-nats" }
ployz-sdk-types = { path = "crates/ployz-sdk-types" }
ployz-test-support = { path = "testing/ployz-test-support" }
ployz-telemetry = { path = "crates/ployz-telemetry" }
posthog-rs = { version = "0.19", default-features = false }
rtnetlink = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "reqwest", "rustls"] }
sha2 = "0.10"
sysctl = "0.7"
nuid = "0.5"
thiserror = "2"
tokio = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
wait-timeout = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
