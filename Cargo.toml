[workspace]
members = [
    "crates/ployz-core",
    "crates/ployz-nats",
    "crates/ployz-ebpf-common",
    "crates/ployz-ebpf-ctl",
    "crates/ployz-keeper",
    "crates/ployz-test-support",
    "crates/ployz-e2e",
    "crates/ployzd",
    "crates/ployzctl",
    "crates/ployz-sdk-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
atomic-write-file = "0.3"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getifs = "0.6"
local-ip-address = "0.6"
public-ip-address = { version = "0.4", default-features = false, features = ["blocking"] }
defguard_wireguard_rs = "0.10"
ployz-core = { path = "crates/ployz-core" }
ployz-nats = { path = "crates/ployz-nats" }
ployz-sdk-types = { path = "crates/ployz-sdk-types" }
ployz-test-support = { path = "crates/ployz-test-support" }
rtnetlink = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysctl = "0.7"
nuid = "0.5"
thiserror = "2"
tokio = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
wait-timeout = "0.2"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
