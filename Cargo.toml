[workspace]
members = [
    "crates/ployz-test-support",
    "crates/ployz-config",
    "crates/ployz-api",
    "crates/ployz-types",
    "crates/ployz-orchestrator",
    "crates/ployz-sdk",
    "crates/ployz-runtime-backends",
    "crates/ployz-runtime-api",
    "crates/ployz-store-api",
    "crates/ployzd",
    "crates/ployz-e2e",
    "crates/ployz-corrosion",
    "crates/ployz-gateway",
    "crates/ployz-dns",
    "crates/ebpf-common",
    "crates/ployz-bpfctl",
]
exclude = ["ebpf"]
default-members = [
    "crates/ployz-test-support",
    "crates/ployz-config",
    "crates/ployz-api",
    "crates/ployz-types",
    "crates/ployz-orchestrator",
    "crates/ployz-sdk",
    "crates/ployz-runtime-backends",
    "crates/ployz-runtime-api",
    "crates/ployz-store-api",
    "crates/ployzd",
    "crates/ployz-e2e",
    "crates/ployz-corrosion",
    "crates/ployz-gateway",
    "crates/ployz-dns",
    "crates/ebpf-common",
]
resolver = "3"

[workspace.package]
version = "0.3.2"

[workspace.lints.rust]
unused_lifetimes = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
manual_ok_or = "warn"
needless_collect = "warn"
large_enum_variant = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time", "net", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", features = ["display"] }
ipnet = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10"
async-trait = "0.1"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-util = "0.7"
http = "1"
libc = "0.2"
directories = "6"
figment = { version = "0.10", features = ["env", "toml"] }
strum = { version = "0.26", features = ["derive"] }
