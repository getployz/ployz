[workspace]
members = [
    "crates/ployz-core",
    "ebpf/common",
    "ebpf/control",
    "crates/ployz-host-runner",
    "testing/ployz-test-support",
    "testing/ployz-e2e",
    "crates/ployzd",
    "crates/ployz",
    "crates/ployz-telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
atomic-write-file = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getifs = "0.6"
getrandom = "0.3"
gotatun = { version = "=0.7.0", default-features = false, features = ["device", "ring"] }
hickory-proto = "0.26"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnetwork = "0.21"
defguard_wireguard_rs = "0.10"
duroxide = { version = "=0.1.30", features = ["sqlite"] }
ployz-core = { path = "crates/ployz-core" }
ployz-host-runner = { path = "crates/ployz-host-runner" }
ployz-test-support = { path = "testing/ployz-test-support" }
ployz-telemetry = { path = "crates/ployz-telemetry" }
posthog-rs = { version = "0.19", default-features = false }
rtnetlink = "0.21"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "reqwest", "rustls"] }
sha2 = "0.10"
smoltcp = { version = "=0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
thiserror = "2"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "json"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
wait-timeout = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }
ulid = "1"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
