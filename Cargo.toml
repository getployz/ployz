[workspace]
members = ["crates/ployz-core", "crates/ployz", "crates/ployz-relay", "crates/ployz-sdk", "crates/ployz-config-wasm", "crates/ployzd", "crates/ployz-testkit"]
default-members = ["crates/ployz-core", "crates/ployz", "crates/ployz-relay", "crates/ployz-sdk", "crates/ployzd"]
resolver = "3"

[workspace.package]
version = "0.1.2-beta.35"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/getployz/ployz2"

[workspace.dependencies]
ployz-core = { path = "crates/ployz-core" }
ployz-relay = { path = "crates/ployz-relay" }
ployz-testkit = { path = "crates/ployz-testkit" }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
# ployz-sdk is the napi exception and does not inherit workspace lints.
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"

[profile.release]
# ponytail: DWARF only; keeps the symbol table so release backtraces stay readable.
strip = "debuginfo"
