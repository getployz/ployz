[workspace]
members = ["ployz-core", "ployz", "ployz-relay", "ployzd", "ployz-testkit"]
default-members = ["ployz-core", "ployz", "ployz-relay", "ployzd"]
resolver = "3"

[workspace.package]
version = "0.1.2-beta.2"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/getployz/ployz2"

[workspace.dependencies]
ployz-core = { path = "ployz-core" }
ployz-relay = { path = "ployz-relay" }
ployz-testkit = { path = "ployz-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
