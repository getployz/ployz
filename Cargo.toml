[workspace]
members = [
    "crates/ployz-core",
    "crates/ployz-nats",
    "crates/ployz-transport",
    "crates/ployzd",
    "crates/ployzctl",
    "crates/ployz-sdk-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
ployz-core = { path = "crates/ployz-core" }
ployz-nats = { path = "crates/ployz-nats" }
ployz-transport = { path = "crates/ployz-transport" }
ployz-sdk-types = { path = "crates/ployz-sdk-types" }
