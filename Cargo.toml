[workspace]
members = [
    "crates/ployz-config",
    "crates/ployz-api",
    "crates/ployz-build",
    "crates/ployz-image",
    "crates/ployz-builder-dockerfile",
    "crates/ployz-builder-railpack",
    "crates/ployz-error",
    "crates/ployz-model",
    "crates/ployz-spec",
    "crates/ployz-time",
    "crates/ployz-metrics",
    "crates/ployz-operation-store",
    "crates/ployz-supervision",
    "crates/ployz-orchestrator",
    "crates/ployz-sdk",
    "crates/ployz-build-api",
    "crates/ployz-cert-api",
    "crates/ployz-cert-acme-api",
    "crates/ployz-cert-acme",
    "crates/ployz-cert-static",
    "crates/ployz-host-backends",
    "crates/ployz-runtime-api",
    "crates/ployz-runtime-docker",
    "crates/ployz-storage-api",
    "crates/ployz-volume",
    "crates/ployz-volume-api",
    "crates/ployz-volume-btrfs",
    "crates/ployz-volume-docker",
    "crates/ployz-volume-zfs",
    "crates/ployz-store-api",
    "crates/ployz-store-memory",
    "crates/ployz-sim",
    "crates/ployz-nats",
    "crates/ployz-node-api",
    "crates/ployz-node-runtime",
    "crates/ployzd",
    "crates/ployz-e2e",
    "crates/ployz-gateway",
    "crates/ployz-dns",
    "crates/ployz-install",
    "crates/ployzctl",
    "crates/ebpf-common",
    "crates/ployz-bpfctl",
    "crates/ployz-wireguard-backends",
]
default-members = [
    "crates/ployz-config",
    "crates/ployz-api",
    "crates/ployz-build",
    "crates/ployz-image",
    "crates/ployz-builder-dockerfile",
    "crates/ployz-builder-railpack",
    "crates/ployz-error",
    "crates/ployz-model",
    "crates/ployz-spec",
    "crates/ployz-time",
    "crates/ployz-metrics",
    "crates/ployz-operation-store",
    "crates/ployz-supervision",
    "crates/ployz-orchestrator",
    "crates/ployz-sdk",
    "crates/ployz-build-api",
    "crates/ployz-cert-api",
    "crates/ployz-cert-acme-api",
    "crates/ployz-cert-static",
    "crates/ployz-node-runtime",
    "crates/ployz-runtime-api",
    "crates/ployz-volume",
    "crates/ployz-volume-api",
    "crates/ployz-volume-btrfs",
    "crates/ployz-volume-docker",
    "crates/ployz-store-api",
    "crates/ployz-store-memory",
    "crates/ployz-install",
    "crates/ployzctl",
    "crates/ebpf-common",
]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", features = ["display"] }
ipnet = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10"
async-trait = "0.1"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-util = "0.7"
http = "1"
libc = "0.2"
directories = "6"
figment = { version = "0.10", features = ["env", "toml"] }
strum = { version = "0.26", features = ["derive"] }
prometheus = "0.13"
backon = "1.6"
axum = "0.8"
xshell = "0.3.0-pre.2"
humantime-serde = "1.1"
tar = "0.4"
async-nats = "0.47"
reqwest = { version = "0.12", default-features = false }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = "2"
hostname = "0.4.2"
if-addrs = "0.13"
aya = "0.13"
bytes = "1"
hickory-server = "0.25"
instant-acme = { version = "0.8.5", default-features = false }
pingora = "0.8.0"
rcgen = "0.14"
tower = "0.5"
x509-parser = "0.18"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
