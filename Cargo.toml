[workspace]
members = ["ployz-core", "ployz", "ployzd", "ployz-testkit"]
default-members = ["ployz-core", "ployz", "ployzd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/getployz/ployz2"

[workspace.lints.rust]
unsafe_code = "forbid"
