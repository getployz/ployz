[workspace]
members = [
    "crates/polis",
    "crates/ployz",
    "crates/ployz-e2e",
]
default-members = [
    "crates/polis",
    "crates/ployz",
    "crates/ployz-e2e",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
polis = { path = "crates/polis" }
thiserror = "2"

[workspace.lints.clippy]
indexing_slicing = "warn"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
