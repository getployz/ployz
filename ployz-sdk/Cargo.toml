[package]
name = "ployz-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16.13"
ployz = { path = "../ployz" }
ployz-core.workspace = true
ployz-sdk-payloads = { path = "../ployz-sdk-payloads" }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.1.4"

[lints.rust]
unsafe_code = "allow"
