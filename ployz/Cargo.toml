[package]
name = "ployz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["env"] }
clap_complete = "4.6.9"
hyper-util = { version = "0.1.20", features = ["tokio"] }
ployz-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tonic = { version = "0.13.1", features = ["transport"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
ployz-testkit.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }

[lints]
workspace = true
