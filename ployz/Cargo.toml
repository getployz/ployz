[package]
name = "ployz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["env"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1.4.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
oci-client = "0.17.0"
ployz-core.workspace = true
ployz-relay.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
shell-words = "1.1.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
tonic = { version = "0.13.1", features = ["transport"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
ployz-testkit.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
