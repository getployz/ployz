name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and draft
        required: true
        type: string
      sha:
        description: Commit the tag must point at
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  bounce:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-release-tag.sh "${{ github.ref_name }}"
      - run: bash scripts/bounce-release-to-main.sh release.yml "Release ${{ github.ref_name }}" "${{ github.event.repository.default_branch }}" -f "tag=${{ github.ref_name }}" -f "sha=${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          bash scripts/check-release-tag.sh "${{ inputs.tag }}"

  artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: [tag]
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
      packages: write
    with:
      goreleaser-args: release --clean --skip=publish
      push-relay-image: true
      release-tag: ${{ inputs.tag }}

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [tag, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-contracts
          path: .
      - run: bash scripts/publish-github-release.sh "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
