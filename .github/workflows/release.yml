name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and draft
        required: true
        type: string
      sha:
        description: Commit the tag must point at
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.sha || github.sha }}

defaults:
  run:
    working-directory: core

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/check-release-tag.sh "$RELEASE_TAG"

  artifacts:
    needs: [tag]
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    with:
      goreleaser-args: release --clean --skip=publish
      release-tag: ${{ inputs.tag || github.ref_name }}

  cloud:
    needs: [tag]
    uses: ./.github/workflows/cloud.yml
    permissions:
      contents: read
      actions: write
      packages: write
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}

  # Only this job sees the signing key. The release environment admits v* tags, so a
  # workflow_dispatch must run from the tag (gh workflow run release.yml --ref vX.Y.Z).
  sign:
    needs: [tag, artifacts]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-contracts
          path: core
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bash scripts/sign-release.sh "$RELEASE_TAG"
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature
          path: core/dist/checksums.txt.minisig
          if-no-files-found: error

  publish:
    needs: [tag, artifacts, cloud, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-contracts
          path: core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature
          path: core/dist
      - run: bash scripts/publish-github-release.sh "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach self-host Compose pinned to this release
        working-directory: dashboard/self-host
        run: |
          sed "s|\${PLOYZ_CLOUD_VERSION:?[^}]*}|$RELEASE_TAG|" compose.yml > ployz-cloud-compose.yml
          grep -Fq "ghcr.io/getployz/ployz-cloud:$RELEASE_TAG" ployz-cloud-compose.yml
          cp .env.example ployz-cloud.env.example
          gh release upload "$RELEASE_TAG" ployz-cloud-compose.yml ployz-cloud.env.example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
