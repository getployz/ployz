name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and draft
        required: true
        type: string
      sha:
        description: Commit the tag must point at
        required: true
        type: string

permissions:
  contents: read
  actions: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.sha || github.sha }}

defaults:
  run:
    working-directory: core

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/check-release-tag.sh "$RELEASE_TAG"

  artifacts:
    needs: [tag]
    uses: ./.github/workflows/release-contracts.yml
    secrets:
      KACHE_S3_READ_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
      KACHE_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      actions: write
    with:
      goreleaser-args: release --clean --skip=publish
      release-tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: [tag, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-contracts
          path: core
      - run: bash scripts/publish-github-release.sh "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
