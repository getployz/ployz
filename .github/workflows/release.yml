name: release

# Main pushes warm Linux build caches. A dispatch on main packages one exact
# version tag and uploads it to a draft GitHub release. The public installer
# (scripts/ployz.sh) resolves ployz-release-<os>-<arch>.env manifests from the
# published release.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v* tag to package from the current main commit
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm-linux-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Linux build cache
        uses: actions/cache@v6
        with:
          path: |
            /tmp/ployz-dind-machine-target
            /tmp/ployz-dind-ebpf-target
            /tmp/ployz-dind-cargo-registry
            /tmp/ployz-dind-cargo-git
          key: ployz-release-${{ matrix.slug }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'ebpf/**/Cargo.lock', 'ebpf/**/Cargo.toml', 'ebpf/**/*.rs', 'corrosion-release.json', 'docs/design/corrosion-schema-v1.sql', 'scripts/build-dind-machine-image.sh', 'scripts/build-ebpf-bytecode.sh', 'scripts/lib.sh') }}
          restore-keys: ployz-release-${{ matrix.slug }}-
      - name: Warm release build cache
        env:
          PLOYZ_DIND_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/build-dind-machine-image.sh artifacts-only
      - name: Repair Linux cache ownership
        if: always()
        run: |
          for path in /tmp/ployz-dind-{machine-target,ebpf-target,cargo-registry,cargo-git}; do
            [ ! -e "${path}" ] || sudo chown -R "$(id -u):$(id -g)" "${path}"
          done

  prune-linux-caches:
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: warm-linux-cache
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Retain newest Linux cache per architecture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for prefix in ployz-release-linux-amd64- ployz-release-linux-arm64-; do
            gh api --method GET "/repos/${GH_REPO}/actions/caches" \
              -f ref=refs/heads/main \
              -f key="${prefix}" \
              -f sort=created_at \
              -f direction=desc \
              -F per_page=100 \
              --paginate \
              --slurp |
            jq -r '[.[].actions_caches[]][1:][].id' |
            while IFS= read -r cache_id; do
              gh api --method DELETE "/repos/${GH_REPO}/actions/caches/${cache_id}"
            done
          done

  validate-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Validate release tag
        env:
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "release packaging must be dispatched with --ref main" >&2
            exit 1
          fi
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "release tag must start with v: ${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${tag_sha}" != "${DISPATCH_SHA}" ]; then
            echo "${RELEASE_TAG} points at ${tag_sha}, not dispatched main ${DISPATCH_SHA}" >&2
            exit 1
          fi

  precheck-sdk-publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Precheck SDK publish
        working-directory: packages/ployz-sdk
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          npm version --no-git-tag-version "${version}"
          if npm view "@ployz/sdk@${version}" version >/dev/null 2>&1; then
            echo "@ployz/sdk@${version} is already published" >&2
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm check:generated
          pnpm typecheck
          pnpm test
          npm publish --dry-run --access public --tag alpha

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
          - platform: darwin/arm64
            slug: darwin-arm64
            runner: macos-14
          - platform: darwin/amd64
            slug: darwin-amd64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Restore Linux build cache
        if: startsWith(matrix.platform, 'linux/')
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: |
            /tmp/ployz-dind-machine-target
            /tmp/ployz-dind-ebpf-target
            /tmp/ployz-dind-cargo-registry
            /tmp/ployz-dind-cargo-git
          key: ployz-release-${{ matrix.slug }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'ebpf/**/Cargo.lock', 'ebpf/**/Cargo.toml', 'ebpf/**/*.rs', 'corrosion-release.json', 'docs/design/corrosion-schema-v1.sql', 'scripts/build-dind-machine-image.sh', 'scripts/build-ebpf-bytecode.sh', 'scripts/lib.sh') }}
          restore-keys: ployz-release-${{ matrix.slug }}-
      - name: Restore macOS build cache
        if: startsWith(matrix.platform, 'darwin/')
        uses: actions/cache@v6
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ployz-release-${{ matrix.slug }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: ployz-release-${{ matrix.slug }}-
      - name: Package release assets
        env:
          PLOYZ_RELEASE_SKIP_BUILD: ${{ steps.linux-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          PLOYZ_RELEASE_VERSION: ${{ inputs.tag }}
          PLOYZ_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package-release.sh
      - name: Repair Linux cache ownership
        if: always() && startsWith(matrix.platform, 'linux/')
        run: |
          for path in /tmp/ployz-dind-{machine-target,ebpf-target,cargo-registry,cargo-git}; do
            [ ! -e "${path}" ] || sudo chown -R "$(id -u):$(id -g)" "${path}"
          done
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/releases/${{ inputs.tag }}/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.slug }}
          path: dist/releases/${{ inputs.tag }}/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs:
      - precheck-sdk-publish
      - package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/assets
          merge-multiple: true
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --draft --verify-tag --title "${RELEASE_TAG}" --notes "Ployz ${RELEASE_TAG}"
          fi
          gh release upload "${RELEASE_TAG}" dist/assets/* --clobber

  publish-sdk:
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Install SDK dependencies
        working-directory: packages/ployz-sdk
        run: pnpm install --frozen-lockfile
      - name: Verify SDK
        working-directory: packages/ployz-sdk
        run: |
          pnpm check:generated
          pnpm typecheck
          pnpm test
      - name: Publish SDK to npm
        working-directory: packages/ployz-sdk
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          publish_args=(--access public)
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            publish_args+=(--tag alpha)
          fi
          npm version --no-git-tag-version "${RELEASE_TAG#v}"
          npm publish "${publish_args[@]}"
