name: release

# Packages release assets for every alpha platform when a version tag is
# pushed, then uploads them to a draft GitHub release. The public installer
# (scripts/ployz.sh) resolves ployz-release-<os>-<arch>.env manifests from
# the published release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-linux:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
            nats-server-sha256: b3e7b14eb10c895fd90c2dacdb6b65bd3208adcc9524dd7689ba2c1024e6b97a
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
            nats-server-sha256: 15fd0c3438e7178e5316e63be68373ad581c8d78db26e649113aa303b74e5e58
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Package release assets
        env:
          PLOYZ_RELEASE_VERSION: ${{ github.ref_name }}
          PLOYZ_RELEASE_PLATFORM: ${{ matrix.platform }}
          PLOYZ_NATS_SERVER_VERSION: 2.14.2
          PLOYZ_NATS_SERVER_URL: https://github.com/nats-io/nats-server/releases/download/v2.14.2/nats-server-v2.14.2-${{ matrix.slug }}.tar.gz
          PLOYZ_NATS_SERVER_SHA256: ${{ matrix.nats-server-sha256 }}
        run: bash scripts/package-release.sh
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/releases/${{ github.ref_name }}/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: dist/releases/${{ github.ref_name }}/*
          if-no-files-found: error

  package-macos:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/arm64
            slug: darwin-arm64
          - platform: darwin/amd64
            slug: darwin-amd64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package release assets
        env:
          PLOYZ_RELEASE_VERSION: ${{ github.ref_name }}
          PLOYZ_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package-release.sh
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/releases/${{ github.ref_name }}/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: dist/releases/${{ github.ref_name }}/*
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs:
      - package-linux
      - package-macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/assets
          merge-multiple: true
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [ -z "${tag}" ] || [ "${tag#v}" = "${tag}" ]; then
            echo "release tag must start with v: ${tag}" >&2
            exit 1
          fi
          semver="${tag#v}"
          if [ -z "${semver}" ]; then
            echo "release tag must include a version after v: ${tag}" >&2
            exit 1
          fi
          version_core="${semver%%-*}"
          major="${version_core%%.*}"
          minor_patch="${version_core#*.}"
          if [ "${minor_patch}" = "${version_core}" ]; then
            echo "release tag must look like vX.Y.Z or vX.Y.Z-suffix: ${tag}" >&2
            exit 1
          fi
          minor="${minor_patch%%.*}"
          patch="${minor_patch#*.}"
          if [ "${patch}" = "${minor_patch}" ]; then
            echo "release tag must look like vX.Y.Z or vX.Y.Z-suffix: ${tag}" >&2
            exit 1
          fi
          case "${major}:${minor}:${patch}" in
            *[!0-9:]* | :* | *::*)
              echo "release tag must look like vX.Y.Z or vX.Y.Z-suffix: ${tag}" >&2
              exit 1
              ;;
          esac
          case "${tag}" in
            *[!A-Za-z0-9._-]*)
              echo "release tag contains unsupported characters: ${tag}" >&2
              exit 1
              ;;
          esac
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --draft --verify-tag --title "${tag}" --notes "Ployz ${tag}"
          fi
          gh release upload "${tag}" dist/assets/* --clobber
