name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and draft
        required: true
        type: string
      sha:
        description: Commit the tag must point at
        required: true
        type: string

permissions:
  contents: read
  actions: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.sha || github.sha }}

defaults:
  run:
    working-directory: core

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/check-release-tag.sh "$RELEASE_TAG"

  artifacts:
    needs: [tag]
    uses: ./.github/workflows/release-contracts.yml
    secrets:
      KACHE_S3_READ_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
      KACHE_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      actions: write
    with:
      goreleaser-args: release --clean --skip=publish
      release-tag: ${{ inputs.tag || github.ref_name }}

  cloud:
    needs: [tag]
    uses: ./.github/workflows/cloud.yml
    secrets:
      KACHE_S3_READ_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
      KACHE_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      actions: write
      packages: write
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}

  agent-eval:
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Refuse a release commit whose nightly or dispatched agent eval failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-eval.yml --commit "$RELEASE_SHA" \
            --json event,conclusion --jq '.[] | select(.event != "pull_request") | .conclusion')
          if grep -qx success <<<"$conclusions"; then exit 0; fi
          if grep -qxE 'failure|timed_out|cancelled|stale|startup_failure|action_required' <<<"$conclusions"; then
            echo "::error::the agent eval on $RELEASE_SHA did not pass; see agent-eval.yml's run for its blockers"
            exit 1
          fi
          echo "::warning::no finished agent eval (agent-eval.yml) on $RELEASE_SHA; releasing without it"

  publish:
    needs: [tag, artifacts, cloud, agent-eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-contracts
          path: core
      - run: bash scripts/publish-github-release.sh "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach self-host Compose pinned to this release
        working-directory: dashboard/self-host
        run: |
          sed "s|\${PLOYZ_CLOUD_VERSION:?[^}]*}|$RELEASE_TAG|" compose.yml > ployz-cloud-compose.yml
          grep -Fq "ghcr.io/getployz/ployz-cloud:$RELEASE_TAG" ployz-cloud-compose.yml
          cp .env.example ployz-cloud.env.example
          gh release upload "$RELEASE_TAG" ployz-cloud-compose.yml ployz-cloud.env.example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
