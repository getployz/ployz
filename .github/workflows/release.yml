name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-release-tag.sh "${{ github.ref_name }}"

  artifacts:
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    with:
      goreleaser-args: release --clean --skip=publish

  publish:
    needs: [tag, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-contracts
          path: .
      - run: bash scripts/publish-github-release.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
