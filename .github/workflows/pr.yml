name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Format, clippy, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Corrosion
        run: just install-corrosion

      - name: Expose Corrosion
        run: echo "CORROSION_BIN=${GITHUB_WORKSPACE}/target/tools/bin/corrosion" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --exclude ployz-bpfctl

      - name: Run tests
        run: just test-all
