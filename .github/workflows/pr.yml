name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (containerd-client gRPC bindings)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install nats-server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.2/nats-server-v2.14.2-linux-amd64.tar.gz \
            | tar -xz
          sudo install nats-server-v2.14.2-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - run: cargo test --workspace

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: packages/ployz-sdk
      - run: pnpm check:generated
        working-directory: packages/ployz-sdk
      - run: pnpm typecheck
        working-directory: packages/ployz-sdk
      - run: pnpm test
        working-directory: packages/ployz-sdk

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
