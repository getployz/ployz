name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.event_name == 'push' }}
      - name: Install protoc (containerd-client gRPC bindings)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  sdk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: packages/ployz-sdk
      - run: pnpm check:generated
        working-directory: packages/ployz-sdk
      - run: pnpm typecheck
        working-directory: packages/ployz-sdk
      - run: pnpm test
        working-directory: packages/ployz-sdk

  workflows:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  keeper-mesh-dind:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      PLOYZ_DIND_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/ployz-dind-machine-target
            /tmp/ployz-dind-ebpf-target
            /tmp/ployz-dind-cargo-registry
            /tmp/ployz-dind-cargo-git
          key: ployz-release-linux-amd64-
          restore-keys: ployz-release-linux-amd64-
      - uses: docker/setup-buildx-action@v3
      - run: scripts/dind-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dind-evidence
          path: target/dind-evidence/
          if-no-files-found: ignore
