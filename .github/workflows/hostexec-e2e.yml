name: HostExec E2E

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hostexec-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".nats-version"
      - "ployz.sh"
      - "Dockerfile.e2e-node"
      - "Dockerfile.payload-builder"
      - "crates/**"
      - "scripts/**"
      - "packaging/**"
      - "ebpf/**"
  pull_request:
    paths:
      - ".github/workflows/hostexec-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".nats-version"
      - "ployz.sh"
      - "Dockerfile.e2e-node"
      - "Dockerfile.payload-builder"
      - "crates/**"
      - "scripts/**"
      - "packaging/**"
      - "ebpf/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/getployz/ployz-e2e-node

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
      arches: ${{ steps.matrix.outputs.arches }}
      scenarios: ${{ steps.scenarios.outputs.list }}
      multi_arch: ${{ steps.matrix.outputs.multi_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ployz-e2e

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run_e2e=true" >> "${GITHUB_OUTPUT}"
            echo "workflow_dispatch requested hostexec e2e"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA}"
            head_ref="${PR_HEAD_SHA}"
          else
            base_ref="${PUSH_BEFORE}"
            head_ref="${CURRENT_SHA}"
          fi

          result="$(
            bash scripts/should-run-hostexec-e2e.sh \
              --base-ref "${base_ref}" \
              --head-ref "${head_ref}"
          )"
          echo "run_e2e=${result}" >> "${GITHUB_OUTPUT}"

      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          amd64='{"runner":"ubuntu-latest","platform":"linux/amd64","suffix":"amd64"}'
          arm64='{"runner":"ubuntu-24.04-arm","platform":"linux/arm64","suffix":"arm64"}'
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] \
             || { [[ "${EVENT_NAME}" == "push" ]] && [[ "${REF}" == "refs/heads/main" ]]; }; then
            echo "arches=[${amd64},${arm64}]" >> "${GITHUB_OUTPUT}"
            echo "multi_arch=true" >> "${GITHUB_OUTPUT}"
          else
            echo "arches=[${amd64}]" >> "${GITHUB_OUTPUT}"
            echo "multi_arch=false" >> "${GITHUB_OUTPUT}"
          fi

      - id: scenarios
        if: steps.detect.outputs.run_e2e == 'true'
        run: |
          list="$(cargo run --quiet -p ployz-e2e -- --zfs real ls)"
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          echo "scenarios: ${list}"

  build-image:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - name: Cache eBPF toolchain and bytecode
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bpf-linker
            ebpf/target
          key: ${{ runner.os }}-${{ matrix.arch.suffix }}-ebpf-${{ hashFiles('scripts/build-ebpf-bytecode.sh', 'ebpf/Cargo.lock', 'ebpf/src/**', 'crates/ebpf-common/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch.suffix }}-ebpf-

      - name: Build eBPF bytecode for payloads
        env:
          CARGO_TARGET_DIR: ebpf/target
        run: bash scripts/build-ebpf-bytecode.sh

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Export preloaded built-in images
        run: bash scripts/export-e2e-preloaded-images.sh

      - name: Build and push prebuilt node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e-node
          platforms: ${{ matrix.arch.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=e2e-node-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=e2e-node-${{ matrix.arch.suffix }},mode=max

      - name: Upload preloaded image tars
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preloaded-images-${{ matrix.arch.suffix }}
          path: packaging/e2e/preloaded-images
          if-no-files-found: error
          retention-days: 1

  build-runner:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ployz-e2e

      - name: Build E2E runner
        run: cargo build -p ployz-e2e

      - name: Build E2E payload
        run: |
          set -euo pipefail
          bash scripts/build-install-payload.sh \
            --output e2e-artifacts/payload-cache \
            --target-platform ${{ matrix.arch.platform }} \
            --profile debug
          bash scripts/payload-stamp.sh "$(pwd)" "${{ matrix.arch.platform }}" debug \
            > e2e-artifacts/payload-cache/.payload-stamp

      - name: Upload E2E runner binary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runner-${{ matrix.arch.suffix }}
          path: target/debug/ployz-e2e
          if-no-files-found: error
          retention-days: 1

      - name: Upload E2E payload cache
        uses: actions/upload-artifact@v4
        with:
          name: e2e-payload-${{ matrix.arch.suffix }}
          path: e2e-artifacts/payload-cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs:
      - changes
      - build-image
      - build-runner
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
        scenario: ${{ fromJson(needs.changes.outputs.scenarios) }}
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ZFS kernel module
        if: matrix.scenario.zfs != 'off'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          test -e /dev/zfs
          zfs version

      - name: Pull node image tag under test
        run: docker pull ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch.suffix }}

      - name: Download E2E runner binary
        uses: actions/download-artifact@v4
        with:
          name: e2e-runner-${{ matrix.arch.suffix }}
          path: bin
      - run: chmod +x bin/ployz-e2e

      - name: Download E2E payload cache
        uses: actions/download-artifact@v4
        with:
          name: e2e-payload-${{ matrix.arch.suffix }}
          path: e2e-artifacts/payload-cache

      - name: Download preloaded image tars
        uses: actions/download-artifact@v4
        with:
          name: e2e-preloaded-images-${{ matrix.arch.suffix }}
          path: packaging/e2e/preloaded-images

      - name: Load preloaded image tars on outer docker
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tar in packaging/e2e/preloaded-images/*.tar; do
            echo "loading ${tar}"
            docker load -i "${tar}"
          done

      - name: Run scenario ${{ matrix.scenario.scenario }}
        run: |
          ./bin/ployz-e2e \
            --image ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch.suffix }} \
            --scenario ${{ matrix.scenario.scenario }} \
            --zfs ${{ matrix.scenario.zfs }} \
            --artifacts-dir e2e-artifacts \
            --fail-fast

      - name: Upload HostExec E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostexec-e2e-artifacts-${{ matrix.arch.suffix }}-${{ matrix.scenario.scenario }}
          path: e2e-artifacts/
          if-no-files-found: ignore

  manifest:
    needs:
      - changes
      - e2e
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && needs.changes.outputs.run_e2e == 'true' && needs.changes.outputs.multi_arch == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64

      - name: Update latest on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64
