name: Fast CI

on:
  # Draft PRs run no checks, and CI ready reports skipped on them. A draft can't merge, and the merge queue runs
  # CI ready again on its own merge_group run, so skipped there lets nothing unchecked onto main.
  # Marking a PR ready starts CI, later pushes run it again, and converting back to draft skips CI ready again.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The merge queue runs the PR checks on the PR merged with main and the PRs queued ahead of it. The queue then
  # fast-forwards main to that exact commit, so this run is also main's: it writes kache, publishes the Cloud and
  # uptime images, and uploads the verify binaries, and a push to main runs nothing more (#3206). The trade-off,
  # accepted: a PR the queue later drops has already written the cache and pushed images and binaries under its
  # own commit, which never reaches main.
  merge_group:
  workflow_dispatch:

concurrency:
  # Each queue entry has its own ref, so its run is never replaced by another entry's. A manual run of main
  # groups by commit; a newer manual run of the same commit can replace it while it waits, and a running one
  # always finishes. PR runs and other branches cancel their older run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only merge queue runs receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'merge_group' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'merge_group' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'merge_group' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'merge_group' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  # Without write keys a queue run silently falls back to read keys, so setup-rust fails it instead.
  KACHE_S3_WRITES: ${{ github.event_name == 'merge_group' && secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET != '' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      postgres: ${{ steps.select.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select checks from the complete change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          # cargo metadata --no-deps needs no compiler, so skip installing the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci.py select "$BASE_SHA" "$GITHUB_SHA"

  contracts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          bash dashboard/scripts/install-actionlint.sh "$RUNNER_TEMP/ployz-tools"
          "$RUNNER_TEMP/ployz-tools/actionlint"
      - name: Check routing and the required result
        run: python3 scripts/test-ci.py
      - name: Keep generated SDK files out of git
        run: test -z "$(git ls-files -- core/crates/ployz-sdk/generated)"
      - run: bash core/scripts/check-layer3-runner.sh
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bash core/scripts/test-cli-installer.sh
      - run: bash core/scripts/test-release-packaging.sh
      - run: bash core/scripts/test-daemon-lifecycle.sh
      - run: python3 core/scripts/verify/test_ackprobe.py
      - run: python3 core/scripts/verify/test_boat.py
      - run: python3 core/scripts/verify/test_host.py
      - run: python3 core/scripts/verify/test_commands.py
      - run: python3 core/scripts/verify/test_doctor.py
      - run: python3 core/scripts/test_artifacts.py
      - uses: dtolnay/rust-toolchain@1.97.1
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: core
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')

  rust-lint:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-lint
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check tests wait on events or paused time, not the real clock
        run: |
          cargo test --locked --manifest-path scripts/real-wait-lint/Cargo.toml
          cargo run --locked --manifest-path scripts/real-wait-lint/Cargo.toml -- crates/*
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  # Each shard builds one group of crates on its own runner and runs half of their tests:
  # the job is bound by the runner's 4 cores. Groups build without workspace-wide feature
  # unification, so a group sees only the features its own crates turn on.
  rust-tests:
    name: rust-tests (${{ matrix.group }}-${{ matrix.half }})
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        group: [cli, daemon, store]
        half: [1, 2]
        include:
          # Every crate the other groups leave out, so a new crate's tests run here.
          - group: cli
            packages: --workspace --exclude ployzd --exclude ployz-store
            node: true
          - group: daemon
            packages: -p ployzd
          # The Store suites on SQLite, then on Postgres.
          - group: store
            packages: -p ployz-store
            postgres: true
    services:
      postgres:
        # An empty image starts no service.
        image: ${{ matrix.postgres && needs.changes.outputs.postgres == 'true' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Docker's 64 MB /dev/shm can run out over the suite's thousand databases.
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15 --shm-size=256m
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          # Both halves of a group build the same crates, so they share one cache manifest.
          cache-key: tests-${{ matrix.group }}
      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: 22
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build the group's tests
        run: cargo build ${{ matrix.packages }} --all-targets --all-features --profile test --locked --timings
      - name: Write a hostile ambient Ployz context
        run: |
          cat > "$RUNNER_TEMP/hostile-ployz-config.yaml" <<'EOF'
          current_context: hostile
          contexts:
            hostile:
              connections:
                - tcp: 127.0.0.1:1
          EOF
      - name: Test with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
          # Built above with `eval`; the SDK tests would otherwise rebuild it with other features.
          PLOYZ_SDK_ADDON: ${{ github.workspace }}/core/target/debug/libployz_sdk.so
        run: cargo nextest run ${{ matrix.packages }} --partition hash:${{ matrix.half }}/2 --all-features --locked --no-fail-fast
      - name: Doc tests with a hostile ambient Ployz context
        if: matrix.half == 1 && !cancelled()
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: cargo test --doc ${{ matrix.packages }} --all-features --locked
      # A throwaway server: durability only slows each test's new database.
      - name: Stop the test Postgres syncing to disk
        if: matrix.postgres && needs.changes.outputs.postgres == 'true'
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c 'ALTER SYSTEM SET fsync = off'
          -c 'ALTER SYSTEM SET synchronous_commit = off'
          -c 'ALTER SYSTEM SET full_page_writes = off'
          -c 'SELECT pg_reload_conf()'
      - name: ployz-store tests on Postgres
        if: matrix.postgres && needs.changes.outputs.postgres == 'true'
        env:
          PLOYZ_STORE_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432
        run: cargo nextest run ${{ matrix.packages }} --partition hash:${{ matrix.half }}/2 --all-features --locked
      - name: Check the missing SSH prerequisite
        if: matrix.group == 'cli' && matrix.half == 1 && !cancelled()
        env:
          PLOYZ_BIN: ${{ github.workspace }}/core/target/debug/ployz
        run: bash scripts/test-missing-ssh-client.sh
      # Merge queue runs only: it mostly catches drift in the newest Docker release, and costs 2 minutes per run.
      - name: Decode the latest Docker's local log files as docker logs prints them
        if: matrix.group == 'daemon' && matrix.half == 1 && github.event_name == 'merge_group'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: |
          curl -fsSL https://get.docker.com | sudo sh >/dev/null
          docker version --format 'Docker {{.Server.Version}}'
          docker pull --quiet alpine:3.23.3
          cargo nextest run --package ployzd --all-features --locked --run-ignored only -E 'test(observe::integration_tests::decoding_matches_docker_logs_byte_for_byte)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-timings-${{ matrix.group }}-${{ matrix.half }}
          path: core/target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  uptime:
    defaults:
      run:
        working-directory: dashboard/uptime
    needs: changes
    # Every queue run runs it, so every main commit has a ployz-uptime:<sha> for Railway to pin.
    if: github.event_name == 'merge_group' || contains(fromJSON(needs.changes.outputs.jobs), 'uptime')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: uptime
          components: clippy,rustfmt
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The Postgres tests start their own postgres:16-alpine containers through the Docker CLI.
      - run: docker pull --quiet postgres:16-alpine
      - run: cargo nextest run --locked
      # The queue builds and publishes the image for every commit, so PRs skip the 3-4 minute release build.
      - name: Build and publish the Railway image
        if: github.event_name == 'merge_group'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/getployz/ployz-uptime:${{ github.sha }}
        run: |
          docker build --file dashboard/uptime/Dockerfile --tag "$IMAGE" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  macos-cli:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos-cli')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-cli
      - run: cargo check --package ployz --all-targets --locked

  cloud:
    needs: changes
    if: github.event_name == 'merge_group' || contains(fromJSON(needs.changes.outputs.jobs), 'cloud')
    uses: ./.github/workflows/cloud.yml
    permissions:
      contents: read
      actions: write
      # Queue runs (main's commits) and release tags publish the Cloud image.
      packages: write
    secrets: inherit

  release-contracts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'release-contracts')
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  # The binaries the verify harness runs, built for each main commit in its queue run so local runs download
  # them. A cancelled run may upload none, so a commit's nearest build can be several commits back.
  # Not a check: no PR waits on it, so it stays out of ready.
  verify-binaries:
    needs: changes
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: ployz
        run: python3 scripts/artifacts.py lookup ployz >> "$GITHUB_OUTPUT"
      - id: ployzd
        run: python3 scripts/artifacts.py lookup ployzd >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        with:
          cache-key: verify-binaries
      - name: Build what no earlier run uploaded
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        run: >-
          python3 scripts/artifacts.py binaries "$RUNNER_TEMP/binaries"
          ${{ steps.ployz.outputs.run-id == '' && 'ployz' || '' }}
          ${{ steps.ployzd.outputs.run-id == '' && 'ployzd' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.ployz.outputs.run-id == ''
        with:
          name: ${{ steps.ployz.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployz
          retention-days: ${{ github.event_name == 'merge_group' && 14 || 3 }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.ployzd.outputs.run-id == ''
        with:
          name: ${{ steps.ployzd.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployzd
          retention-days: ${{ github.event_name == 'merge_group' && 14 || 3 }}
          if-no-files-found: error

  ready:
    name: CI ready
    # Skipped only on a draft. Branch protection counts a skipped required check as passing, so every other run
    # must reach the step below, whatever its checks did: a draft can't merge, and the queue runs this job again.
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, contracts, rust-lint, rust-tests, uptime, macos-cli, cloud, release-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py ready
