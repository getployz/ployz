name: Fast CI

on:
  # Draft PRs run nothing. Marking a PR ready starts CI, and later pushes run it again.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Main pushes share one group, so a newer one cancels older ones. Kache's main builds come mostly from the
  # latest main run, though a cancelled run keeps what it wrote first, and an older main commit may have no
  # finished run. A manual run of main groups by commit and is never cancelled once it runs; a newer manual
  # run of the same commit can still replace it while it waits. Manual runs and pushes never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  # Without write keys a main push silently falls back to read keys, so setup-rust fails it instead.
  KACHE_S3_WRITES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET != '' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      postgres: ${{ steps.select.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select checks from the complete change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          # cargo metadata --no-deps needs no compiler, so skip installing the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci.py select "$BASE_SHA" "$GITHUB_SHA"

  contracts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          bash dashboard/scripts/install-actionlint.sh "$RUNNER_TEMP/ployz-tools"
          "$RUNNER_TEMP/ployz-tools/actionlint"
      - name: Check routing and the required result
        run: python3 scripts/test-ci.py
      - name: Keep generated SDK files out of git
        run: test -z "$(git ls-files -- core/crates/ployz-sdk/generated)"
      - run: bash core/scripts/check-layer3-runner.sh
      - run: bash core/scripts/test-cli-installer.sh
      - run: bash core/scripts/test-release-packaging.sh
      - run: bash core/scripts/test-daemon-lifecycle.sh
      - run: python3 core/scripts/verify/test_ackprobe.py
      - run: python3 core/scripts/verify/test_boat.py
      - run: python3 core/scripts/verify/test_host.py
      - run: python3 core/scripts/verify/test_commands.py
      - run: python3 core/scripts/verify/test_doctor.py
      - run: python3 core/scripts/test_artifacts.py
      - uses: dtolnay/rust-toolchain@1.97.1
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: core
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')

  rust-lint:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-lint
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  # One build pulls the compiler cache once. Four shards that each built pulled it four times at
  # once, and a shard whose downloads lagged compiled a third of the workspace again.
  rust-build:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-tests
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build native SDK and Rust tests together
        run: cargo build --workspace --all-targets --all-features --profile test --locked --timings
      # The SDK tests load this addon, built above with `eval`; they would otherwise rebuild it with other features.
      - name: Archive the tests for the shards
        run: |
          mkdir -p "$RUNNER_TEMP/rust-tests"
          cargo nextest archive --workspace --all-features --locked --archive-file "$RUNNER_TEMP/rust-tests/tests.tar.zst"
          cp target/debug/libployz_sdk.so "$RUNNER_TEMP/rust-tests/"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-archive
          path: ${{ runner.temp }}/rust-tests
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Doc tests with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: |
          printf 'current_context: hostile\ncontexts:\n  hostile:\n    connections:\n      - tcp: 127.0.0.1:1\n' > "$PLOYZ_CONFIG"
          cargo test --doc --workspace --all-features --locked
      - name: Check the missing SSH prerequisite
        env:
          PLOYZ_BIN: ${{ github.workspace }}/core/target/debug/ployz
        run: bash scripts/test-missing-ssh-client.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-timings
          path: core/target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  rust-tests:
    defaults:
      run:
        working-directory: core
    needs: [changes, rust-build]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-tests')
    name: rust-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Extracting into the checkout keeps the paths the binaries were built with, such as CARGO_BIN_EXE_*.
    # cargo-nextest is called directly: `cargo` would make rustup install the pinned toolchain first.
    env:
      NEXTEST: cargo-nextest nextest run --archive-file ${{ github.workspace }}/.rust-tests/tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite --partition count:${{ matrix.shard }}/4
      PLOYZ_SDK_ADDON: ${{ github.workspace }}/.rust-tests/libployz_sdk.so
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Docker's 64 MB /dev/shm can run out over the suite's thousand databases.
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15 --shm-size=256m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v4
        with:
          name: rust-tests-archive
          path: ${{ github.workspace }}/.rust-tests
      - name: Test with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: |
          cat > "$PLOYZ_CONFIG" <<'EOF'
          current_context: hostile
          contexts:
            hostile:
              connections:
                - tcp: 127.0.0.1:1
          EOF
          # Cargo creates CARGO_TARGET_TMPDIR while building; the archive leaves the empty directory out.
          mkdir -p target/tmp
          $NEXTEST --no-fail-fast
      # A throwaway server: durability only slows each test's new database.
      - name: Stop the test Postgres syncing to disk
        if: needs.changes.outputs.postgres == 'true'
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c 'ALTER SYSTEM SET fsync = off'
          -c 'ALTER SYSTEM SET synchronous_commit = off'
          -c 'ALTER SYSTEM SET full_page_writes = off'
          -c 'SELECT pg_reload_conf()'
      - name: ployz-store tests on Postgres
        if: needs.changes.outputs.postgres == 'true'
        env:
          PLOYZ_STORE_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432
        run: $NEXTEST -E 'package(ployz-store)'
      # Last: installing Docker restarts dockerd, which stops the Postgres service.
      # Main pushes only: it mostly catches drift in the newest Docker release, and costs 2 minutes per run.
      - name: Decode the latest Docker's local log files as docker logs prints them
        if: github.event_name == 'push' && matrix.shard == 4
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: |
          curl -fsSL https://get.docker.com | sudo sh >/dev/null
          docker version --format 'Docker {{.Server.Version}}'
          docker pull --quiet alpine:3.23.3
          cargo-nextest nextest run --archive-file "$GITHUB_WORKSPACE/.rust-tests/tests.tar.zst" --workspace-remap . --extract-to . --extract-overwrite --run-ignored only -E 'package(ployzd) and test(observe::integration_tests::decoding_matches_docker_logs_byte_for_byte)'

  uptime:
    defaults:
      run:
        working-directory: dashboard/uptime
    needs: changes
    # Main always runs it, so every main commit has a ployz-uptime:<sha> for Railway to pin.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(fromJSON(needs.changes.outputs.jobs), 'uptime')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: uptime
          components: clippy,rustfmt
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The Postgres tests start their own postgres:16-alpine containers through the Docker CLI.
      - run: docker pull --quiet postgres:16-alpine
      - run: cargo nextest run --locked
      # Main builds and publishes the image for every commit, so PRs skip the 3-4 minute release build.
      - name: Build and publish the Railway image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/getployz/ployz-uptime:${{ github.sha }}
        run: |
          docker build --file dashboard/uptime/Dockerfile --tag "$IMAGE" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  macos-cli:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos-cli')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-cli
      - run: cargo check --package ployz --all-targets --locked

  cloud:
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(fromJSON(needs.changes.outputs.jobs), 'cloud')
    uses: ./.github/workflows/cloud.yml
    permissions:
      contents: read
      actions: write
      # Main commits and release tags publish the Cloud image.
      packages: write
    secrets: inherit

  release-contracts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'release-contracts')
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  # The binaries the verify harness runs, built on main so local runs download them. A cancelled main run may
  # upload none, so a commit's nearest build can be several commits back.
  # Not a check: no PR waits on it, so it stays out of ready.
  verify-binaries:
    needs: changes
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: ployz
        run: python3 scripts/artifacts.py lookup ployz >> "$GITHUB_OUTPUT"
      - id: ployzd
        run: python3 scripts/artifacts.py lookup ployzd >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        with:
          cache-key: verify-binaries
      - name: Build what no earlier run uploaded
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        run: >-
          python3 scripts/artifacts.py binaries "$RUNNER_TEMP/binaries"
          ${{ steps.ployz.outputs.run-id == '' && 'ployz' || '' }}
          ${{ steps.ployzd.outputs.run-id == '' && 'ployzd' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.ployz.outputs.run-id == ''
        with:
          name: ${{ steps.ployz.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployz
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.ployzd.outputs.run-id == ''
        with:
          name: ${{ steps.ployzd.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployzd
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: error

  ready:
    name: CI ready
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, contracts, rust-lint, rust-tests, uptime, macos-cli, cloud, release-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py ready
