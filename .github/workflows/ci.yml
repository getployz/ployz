name: Fast CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: bash scripts/test-release-contracts.sh
      - run: bash scripts/test-cli-installer.sh
      - run: bash scripts/test-daemon-lifecycle.sh

  macos-cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo check --package ployz --all-targets --locked
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  layer3-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ployz-testkit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/getployz/ployz2-testkit:main
          cache-from: type=gha,scope=ployz-testkit
          cache-to: type=gha,mode=max,scope=ployz-testkit
      - name: Inspect the manifest and boot both image architectures
        env:
          IMAGE: ghcr.io/getployz/ployz2-testkit:main
        run: |
          platforms=$(docker buildx imagetools inspect --raw "$IMAGE" | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | sort)
          test "$platforms" = $'linux/amd64\nlinux/arm64'
          container=
          trap 'test -z "$container" || docker rm --force --volumes "$container"' EXIT
          for arch in amd64 arm64; do
            container=$(docker run --detach --privileged --platform "linux/$arch" "$IMAGE")
            for attempt in $(seq 1 60); do
              if docker exec "$container" docker info >/dev/null 2>&1 \
                && docker exec "$container" docker image inspect ghcr.io/unlabs-dev/corrosion:2026.6.15 >/dev/null 2>&1 \
                && docker exec "$container" sh -c 'test -s /run/ployzd.pid && kill -0 "$(cat /run/ployzd.pid)"'
              then
                break
              fi
              test "$attempt" -lt 60
              sleep 1
            done
            docker exec "$container" ployzd version
            docker exec "$container" wg --version
            docker rm --force --volumes "$container"
            container=
          done

  layer3:
    if: github.event_name != 'pull_request'
    needs: layer3-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ignored Cluster suite, retrying one failed attempt
        run: |
          retry_once() { "$@" || "$@"; }

          attempts=0
          fail_once() { attempts=$((attempts + 1)); test "$attempts" -eq 2; }
          retry_once fail_once
          test "$attempts" -eq 2

          attempts=0
          always_fail() { attempts=$((attempts + 1)); return 1; }
          if retry_once always_fail; then
            exit 1
          fi
          test "$attempts" -eq 2

          mapfile -t scenarios < <(cargo test --package ployz-testkit --test cluster --locked -- --ignored --list | sed -n 's/: test$//p')
          test "${#scenarios[@]}" -gt 0
          for scenario in "${scenarios[@]}"; do
            retry_once cargo test --package ployz-testkit --test cluster --locked "$scenario" -- --ignored --exact
          done
