name: Fast CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Every main commit runs to the end, so each leaves its builds behind for later runs and local verify.
  # A shared group would still cancel a pending main run, so main groups by commit.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  # Without write keys a main push silently falls back to read keys, so setup-rust fails it instead.
  KACHE_S3_WRITES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET != '' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # Linux jobs run on the self-hosted pool when CI_SELF_HOSTED is on, the run is a push or a same-repo PR
  # (fork PRs never), and a ployz-omarchy runner is online and idle. Otherwise, or on any error, GitHub's.
  # Ported from mikehardy/runner-fallback-action: picks happen one at a time, each after a pause that lets
  # the previous pick's jobs claim their runners. queue: max keeps every waiting pick instead of cancelling it.
  runner:
    name: Pick runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ci-runner-pick' || format('ci-runner-pick-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          TRUSTED: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          # Fine-grained PAT with Administration: Read on this repo; GITHUB_TOKEN cannot list runners.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          runner=ubuntu-24.04
          if [ "$TRUSTED" = true ]; then
            sleep 15
            if idle=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" --jq '[.runners[] | select(.status == "online" and (.busy | not) and any(.labels[]; .name == "ployz-omarchy"))] | length'); then
              echo "Idle ployz-omarchy runners: $idle"
              [ "$idle" -ge 1 ] && runner=ployz-omarchy
            else
              echo "::warning::Could not list self-hosted runners; using $runner"
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $runner" >> "$GITHUB_STEP_SUMMARY"

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select checks from the complete change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          # cargo metadata --no-deps needs no compiler, so skip installing the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci.py select "$BASE_SHA" "$GITHUB_SHA"

  contracts:
    needs: [changes, runner]
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          bash dashboard/scripts/install-actionlint.sh "$RUNNER_TEMP/ployz-tools"
          "$RUNNER_TEMP/ployz-tools/actionlint"
      - name: Check routing and the required result
        run: python3 scripts/test-ci.py
      - name: Keep generated SDK files out of git
        run: test -z "$(git ls-files -- core/crates/ployz-sdk/generated)"
      - run: bash core/scripts/check-layer3-runner.sh
      - run: bash core/scripts/test-cli-installer.sh
      - run: bash core/scripts/test-release-packaging.sh
      - run: bash core/scripts/test-daemon-lifecycle.sh
      - run: python3 core/scripts/verify/test_ackprobe.py
      - run: python3 core/scripts/verify/test_boat.py
      - run: python3 core/scripts/verify/test_host.py
      - run: python3 core/scripts/verify/test_commands.py
      - run: python3 core/scripts/verify/test_doctor.py
      - run: python3 core/scripts/test_artifacts.py
      - uses: dtolnay/rust-toolchain@1.97.1
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: core
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')

  rust-lint:
    defaults:
      run:
        working-directory: core
    needs: [changes, runner]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-lint
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  rust-tests:
    defaults:
      run:
        working-directory: core
    needs: [changes, runner]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-tests')
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build native SDK and Rust tests together
        run: cargo build --workspace --all-targets --all-features --profile test --locked --timings
      - name: Test with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: |
          cat > "$PLOYZ_CONFIG" <<'EOF'
          current_context: hostile
          contexts:
            hostile:
              connections:
                - tcp: 127.0.0.1:1
          EOF
          cargo nextest run --workspace --all-features --locked
          cargo test --doc --workspace --all-features --locked
      - name: ployz-store tests on Postgres
        env:
          PLOYZ_STORE_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432
        run: cargo nextest run --package ployz-store --locked
      - name: Check the missing SSH prerequisite
        env:
          PLOYZ_BIN: ${{ github.workspace }}/core/target/debug/ployz
        run: bash scripts/test-missing-ssh-client.sh
      # Last: installing Docker restarts dockerd, which stops the Postgres service.
      # Main pushes only: it mostly catches drift in the newest Docker release, and costs 2 minutes per run.
      - name: Decode the latest Docker's local log files as docker logs prints them
        if: github.event_name == 'push'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: |
          curl -fsSL https://get.docker.com | sudo sh >/dev/null
          docker version --format 'Docker {{.Server.Version}}'
          docker pull --quiet alpine:3.23.3
          cargo nextest run --package ployzd --all-features --locked --run-ignored only -E 'test(observe::integration_tests::decoding_matches_docker_logs_byte_for_byte)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-timings
          path: core/target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  uptime:
    defaults:
      run:
        working-directory: dashboard/uptime
    needs: [changes, runner]
    # Main always runs it, so every main commit has a ployz-uptime:<sha> for Railway to pin.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(fromJSON(needs.changes.outputs.jobs), 'uptime')
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: uptime
          components: clippy,rustfmt
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The Postgres tests start their own postgres:16-alpine containers through the Docker CLI.
      - run: docker pull --quiet postgres:16-alpine
      - run: cargo nextest run --locked
      # Main builds and publishes the image for every commit, so PRs skip the 3-4 minute release build.
      - name: Build and publish the Railway image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/getployz/ployz-uptime:${{ github.sha }}
        run: |
          docker build --file dashboard/uptime/Dockerfile --tag "$IMAGE" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  macos-cli:
    defaults:
      run:
        working-directory: core
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos-cli')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-cli
      - run: cargo check --package ployz --all-targets --locked

  cloud:
    needs: [changes, runner]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(fromJSON(needs.changes.outputs.jobs), 'cloud')
    uses: ./.github/workflows/cloud.yml
    permissions:
      contents: read
      actions: write
      # Main commits and release tags publish the Cloud image.
      packages: write
    with:
      runner: ${{ needs.runner.outputs.runner }}
    secrets: inherit

  release-contracts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'release-contracts')
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  # The binaries the verify harness runs, built once per change on main so local runs download them.
  # Not a check: no PR waits on it, so it stays out of ready.
  verify-binaries:
    needs: runner
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: core
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: ployz
        run: python3 scripts/artifacts.py lookup ployz >> "$GITHUB_OUTPUT"
      - id: ployzd
        run: python3 scripts/artifacts.py lookup ployzd >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        with:
          cache-key: verify-binaries
      - name: Build what no earlier run uploaded
        if: steps.ployz.outputs.run-id == '' || steps.ployzd.outputs.run-id == ''
        run: >-
          python3 scripts/artifacts.py binaries "$RUNNER_TEMP/binaries"
          ${{ steps.ployz.outputs.run-id == '' && 'ployz' || '' }}
          ${{ steps.ployzd.outputs.run-id == '' && 'ployzd' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.ployz.outputs.run-id == ''
        with:
          name: ${{ steps.ployz.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployz
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.ployzd.outputs.run-id == ''
        with:
          name: ${{ steps.ployzd.outputs.name }}
          path: ${{ runner.temp }}/binaries/ployzd
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: error

  ready:
    name: CI ready
    if: always()
    needs: [changes, contracts, rust-lint, rust-tests, uptime, macos-cli, cloud, release-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py ready
