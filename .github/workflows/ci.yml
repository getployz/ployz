name: Fast CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only protected main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/ployz/compose-helper/go.mod
          cache-dependency-path: crates/ployz/compose-helper/go.sum
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: workspace-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-workspace
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          pr-comment: false
      - name: Check Compose helper
        working-directory: crates/ployz/compose-helper
        run: |
          test -z "$(gofmt -l ./*.go)"
          go vet ./...
          go test ./...
      - run: cargo fmt --all -- --check
      - run: bash scripts/check-layer3-runner.sh
      - run: python3 scripts/test-cloud-sdk-version.py
      - run: python3 scripts/check-cloud-sdk-version.py
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build -p ployz-sdk --locked
      - name: Test with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: |
          cat > "$PLOYZ_CONFIG" <<'EOF'
          current_context: hostile
          contexts:
            hostile:
              connections:
                - tcp: 127.0.0.1:1
          EOF
          cargo test --workspace --all-features --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/check-sdk-types.sh
      - run: bash scripts/test-cli-installer.sh
      - run: bash scripts/test-missing-ssh-client.sh
      - run: bash scripts/test-daemon-lifecycle.sh
      - run: bash scripts/test-qualify-release.sh
      - run: bash scripts/test-qualify-clean-init.sh
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  macos-cli:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/ployz/compose-helper/go.mod
          cache-dependency-path: crates/ployz/compose-helper/go.sum
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: macos-cli-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-macos-cli
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          pr-comment: false
      - run: cargo check --package ployz --all-targets --locked

  layer3-image-amd64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-testkit-image
        with:
          arch: amd64

  layer3-image-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-testkit-image
        with:
          arch: arm64

  layer3:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: layer3-image-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      PLOYZ_TESTKIT_IMAGE: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/ployz/compose-helper/go.mod
          cache-dependency-path: crates/ployz/compose-helper/go.sum
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: layer3-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-layer3
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          pr-comment: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ignored Cluster suite, retrying one failed attempt
        run: bash scripts/run-layer3-tests.sh

  layer3-manifest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [layer3-image-amd64, layer3-image-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch manifest
        env:
          AMD64: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-amd64
          ARM64: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-arm64
          SHA: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}
          MAIN: ghcr.io/getployz/ployz2-testkit:main
        run: |
          docker buildx imagetools create -t "$SHA" "$AMD64" "$ARM64"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create -t "$MAIN" "$AMD64" "$ARM64"
          fi
          platforms=$(docker buildx imagetools inspect --raw "$SHA" | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | sort)
          test "$platforms" = $'linux/amd64\nlinux/arm64'
