name: Fast CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only protected main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select checks from the complete change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/ci.py select "$BASE_SHA" "$GITHUB_SHA"

  contracts:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          bash cloud/scripts/install-actionlint.sh "$RUNNER_TEMP/ployz-tools"
          "$RUNNER_TEMP/ployz-tools/actionlint"
      - name: Check routing and the required result
        run: python3 scripts/test-ci.py
      - run: bash scripts/check-layer3-runner.sh
      - run: python3 scripts/test-cloud-sdk-version.py
      - run: python3 scripts/check-cloud-sdk-version.py
      - run: bash scripts/test-cli-installer.sh
      - run: bash scripts/test-release-packaging.sh
      - run: bash scripts/test-daemon-lifecycle.sh
      - run: bash scripts/test-qualify-release.sh
      - run: bash scripts/test-qualify-clean-init.sh
      - uses: dtolnay/rust-toolchain@1.97.1
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')

  compose:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'compose')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/ployz/compose-helper/go.mod
          cache-dependency-path: crates/ployz/compose-helper/go.sum
      - name: Check Compose helper
        working-directory: crates/ployz/compose-helper
        run: |
          test -z "$(gofmt -l ./*.go)"
          go vet ./...
          go test ./...

  rust-lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-lint')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-lint
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check the daemon stays outside the CLI graph
        run: |
          if cargo tree --package ployz --target all --edges normal --prefix none --locked | grep -q '^ployzd '; then
            echo 'ployz must not depend on the Linux-only ployzd crate'
            exit 1
          fi

  rust-tests:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build native SDK and Rust tests together
        run: cargo build --workspace --all-targets --all-features --profile test --locked --timings
      - name: Test with a hostile ambient Ployz context
        env:
          PLOYZ_CONFIG: ${{ runner.temp }}/hostile-ployz-config.yaml
        run: |
          cat > "$PLOYZ_CONFIG" <<'EOF'
          current_context: hostile
          contexts:
            hostile:
              connections:
                - tcp: 127.0.0.1:1
          EOF
          cargo nextest run --workspace --all-features --locked
          cargo test --doc --workspace --all-features --locked
      - name: Check the missing SSH prerequisite
        env:
          PLOYZ_BIN: ${{ github.workspace }}/target/debug/ployz
        run: bash scripts/test-missing-ssh-client.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-timings
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  sdk-types:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'sdk-types')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/check-sdk-types.sh

  macos-cli:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos-cli')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-cli
      - run: cargo check --package ployz --all-targets --locked

  cloud:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'cloud')
    uses: ./.github/workflows/cloud.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  release-contracts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'release-contracts')
    uses: ./.github/workflows/release-contracts.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit

  ready:
    name: CI ready
    if: always()
    needs: [changes, contracts, compose, rust-lint, rust-tests, sdk-types, macos-cli, cloud, release-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py ready
