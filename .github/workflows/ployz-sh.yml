name: ployz.sh

on:
  push:
    branches: [main]
    paths:
      - core/install.sh
      - core/scripts/stage-ployz-sh-site.sh
      - core/site/**
      - .github/workflows/ployz-sh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref, so a preview never cancels a production deploy waiting its turn.
  group: ployz-sh-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: cloudflare-pages
      url: https://ployz.sh
    runs-on: ubuntu-latest
    steps:
      # Only the main branch deploys production. Running this workflow on any other ref deploys it as
      # a Pages preview named preview-<ref>, such as preview-heads-my-branch.ployz-sh.pages.dev.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch channel pointers
        run: |
          mkdir -p dist/channels-src
          if git ls-remote --heads origin channels | grep -q .; then
            git fetch --depth 1 origin channels
            git archive origin/channels | tar -x -C dist/channels-src
          fi
      - name: Stage ployz.sh site
        run: PLOYZ_SH_CHANNELS_DIR=dist/channels-src bash core/scripts/stage-ployz-sh-site.sh
      - name: Name the Pages branch
        id: target
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            branch=main
          else
            branch=preview-$(printf %s "${GITHUB_REF#refs/}" | tr -c 'A-Za-z0-9-' -)
          fi
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages builds the release proxy from functions/ in this directory.
          workingDirectory: core/site
          command: pages deploy ../dist/ployz-sh-site --project-name=ployz-sh --branch=${{ steps.target.outputs.branch }}
