name: ployz.sh

on:
  push:
    branches:
      - main
    paths:
      - scripts/ployz.sh
      - scripts/stage-ployz-sh-site.sh
      - site/**
      - .github/workflows/ployz-sh.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage ployz.sh site
        run: bash scripts/stage-ployz-sh-site.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ployz-sh-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
