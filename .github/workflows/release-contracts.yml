name: Release contracts

on:
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        required: false
      KACHE_S3_READ_ACCESS_KEY_ID:
        required: false
      KACHE_S3_READ_SECRET_ACCESS_KEY:
        required: false
    inputs:
      goreleaser-args:
        type: string
        default: release --snapshot --clean --skip=publish
      release-tag:
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: release-contracts-${{ github.event.pull_request.number || inputs.release-tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  # Only main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  # Without write keys a main push silently falls back to read keys, so the builds fail it instead.
  KACHE_S3_WRITES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET != '' }}
  RUST_VERSION: 1.97.1
  ZIG_VERSION: 0.13.0
  CARGO_ZIGBUILD_VERSION: 0.19.7
  GORELEASER_VERSION: 2.6.0

defaults:
  run:
    working-directory: core

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        binary: [ployz, ployzd]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_ID: ${{ format('{0}-linux-{1}', matrix.binary, matrix.arch) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ inputs.release-tag == '' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      # Release builds compile from scratch: main pushes write these caches.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.release-tag == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - name: Require compiler cache writes on main
        if: inputs.release-tag == '' && github.repository == 'getployz/ployz' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "$KACHE_S3_WRITES" != true ]; then
            echo "::error::Main push has no R2 write credentials, so the compiler cache would not be saved."
            exit 1
          fi
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        if: inputs.release-tag == ''
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: release-${{ matrix.binary }}-${{ matrix.arch }}-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-release-${{ matrix.binary }}-${{ matrix.arch }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          workdir: core
          distribution: goreleaser
          version: v${{ env.GORELEASER_VERSION }}
          args: ${{ inputs.goreleaser-args || 'release --snapshot --clean --skip=publish' }} --skip=homebrew
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.binary }}-${{ matrix.arch }}
          path: |
            core/dist/*.tar.gz
            core/target/${{ matrix.rust_target }}/release/sqlite-probe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-apple-darwin
          - arch: arm64
            rust_target: aarch64-apple-darwin
    runs-on: macos-15
    env:
      RELEASE_ID: ployz-darwin-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}
      # Release builds compile from scratch: main pushes write these caches.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.release-tag == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - name: Require compiler cache writes on main
        if: inputs.release-tag == '' && github.repository == 'getployz/ployz' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "$KACHE_S3_WRITES" != true ]; then
            echo "::error::Main push has no R2 write credentials, so the compiler cache would not be saved."
            exit 1
          fi
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        if: inputs.release-tag == ''
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: release-ployz-darwin-${{ matrix.arch }}-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-release-darwin-${{ matrix.arch }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          workdir: core
          distribution: goreleaser
          version: v${{ env.GORELEASER_VERSION }}
          args: ${{ inputs.goreleaser-args || 'release --snapshot --clean --skip=publish' }} --skip=homebrew
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-darwin-${{ matrix.arch }}
          path: core/dist/*.tar.gz
          if-no-files-found: error

  macos-smoke:
    needs: [build-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-darwin-*
          merge-multiple: true
          path: core/dist
      - run: softwareupdate --install-rosetta --agree-to-license
      - run: brew install minisign
      - run: scripts/verify-release.sh macos

  pack:
    needs: [build-linux, macos-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: core/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-darwin-*
          merge-multiple: true
          path: core/darwin
      - run: |
          mkdir -p dist
          cp linux/dist/*.tar.gz dist/
          cp darwin/*.tar.gz dist/
          bash scripts/pack-release.sh
          bash scripts/verify-release.sh artifacts
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          cp linux/target/x86_64-unknown-linux-musl/release/sqlite-probe target/x86_64-unknown-linux-musl/release/
          cp linux/target/aarch64-unknown-linux-musl/release/sqlite-probe target/aarch64-unknown-linux-musl/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-contracts
          path: |
            core/dist
            core/target/x86_64-unknown-linux-musl/release/sqlite-probe
            core/target/aarch64-unknown-linux-musl/release/sqlite-probe

  linux-smoke:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: core
      - run: sudo apt-get update && sudo apt-get install -y file minisign qemu-user
      - run: scripts/verify-release.sh linux
