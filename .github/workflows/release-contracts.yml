name: Release contracts

on:
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        required: false
      KACHE_S3_READ_ACCESS_KEY_ID:
        required: false
      KACHE_S3_READ_SECRET_ACCESS_KEY:
        required: false
    inputs:
      goreleaser-args:
        type: string
        default: release --snapshot --clean --skip=publish
      release-tag:
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: release-contracts-${{ github.event.pull_request.number || inputs.release-tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  # Only protected main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  RUST_VERSION: 1.97.1
  ZIG_VERSION: 0.13.0
  CARGO_ZIGBUILD_VERSION: 0.19.7
  GORELEASER_VERSION: 2.6.0

defaults:
  run:
    working-directory: core

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        binary: [ployz, ployzd]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_ID: ${{ format('{0}-linux-{1}', matrix.binary, matrix.arch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/native/tailcat/go.mod
          cache-dependency-path: |
            core/crates/ployz/compose-helper/go.sum
            core/native/tailcat/go.sum
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: release-${{ matrix.binary }}-${{ matrix.arch }}-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-release-${{ matrix.binary }}-${{ matrix.arch }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
          pr-comment: false
      - name: Build Tailcat helper
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          PLOYZ_VERSION=$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n1)
          export PLOYZ_VERSION
          bash native/tailcat/build.sh "$PWD/target/tailcat/linux_${{ matrix.arch }}/ployz-tailcat"
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: core
          distribution: goreleaser
          version: v${{ env.GORELEASER_VERSION }}
          args: ${{ inputs.goreleaser-args || 'release --snapshot --clean --skip=publish' }} --skip=homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.binary }}-${{ matrix.arch }}
          path: |
            core/dist/*.tar.gz
            core/target/${{ matrix.rust_target }}/release/sqlite-probe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-apple-darwin
          - arch: arm64
            rust_target: aarch64-apple-darwin
    runs-on: macos-15
    env:
      RELEASE_ID: ployz-darwin-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/native/tailcat/go.mod
          cache-dependency-path: |
            core/crates/ployz/compose-helper/go.sum
            core/native/tailcat/go.sum
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: release-ployz-darwin-${{ matrix.arch }}-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-release-darwin-${{ matrix.arch }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
          pr-comment: false
      - name: Build Tailcat helper
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          PLOYZ_VERSION=$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n1)
          export PLOYZ_VERSION
          bash native/tailcat/build.sh "$PWD/target/tailcat/darwin_${{ matrix.arch }}/ployz-tailcat"
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: core
          distribution: goreleaser
          version: v${{ env.GORELEASER_VERSION }}
          args: ${{ inputs.goreleaser-args || 'release --snapshot --clean --skip=publish' }} --skip=homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.arch }}
          path: core/dist/*.tar.gz
          if-no-files-found: error

  macos-smoke:
    needs: [build-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-darwin-*
          merge-multiple: true
          path: core/dist
      - run: softwareupdate --install-rosetta --agree-to-license
      - run: scripts/verify-release.sh macos

  pack:
    needs: [build-linux, macos-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - if: github.event_name != 'pull_request'
        run: bash scripts/test-cli-installer.sh
      - if: github.event_name != 'pull_request'
        run: bash scripts/test-daemon-lifecycle.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: core/linux
      - uses: actions/download-artifact@v4
        with:
          pattern: release-darwin-*
          merge-multiple: true
          path: core/darwin
      - run: |
          mkdir -p dist
          cp linux/dist/*.tar.gz dist/
          cp darwin/*.tar.gz dist/
          bash scripts/pack-release.sh
          bash scripts/verify-release.sh artifacts
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          cp linux/target/x86_64-unknown-linux-musl/release/sqlite-probe target/x86_64-unknown-linux-musl/release/
          cp linux/target/aarch64-unknown-linux-musl/release/sqlite-probe target/aarch64-unknown-linux-musl/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-contracts
          path: |
            core/dist
            core/target/x86_64-unknown-linux-musl/release/sqlite-probe
            core/target/aarch64-unknown-linux-musl/release/sqlite-probe

  linux-smoke:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: core
      - run: sudo apt-get update && sudo apt-get install -y file qemu-user
      - run: scripts/verify-release.sh linux
