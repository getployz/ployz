name: Cluster checks

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Scheduled, release, and manual jobs only read the shared compiler cache.
  KACHE_S3_BUCKET: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID && secrets.KACHE_S3_READ_SECRET_ACCESS_KEY && vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  layer3-image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-testkit-image
        with:
          arch: amd64

  layer3-image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-testkit-image
        with:
          arch: arm64

  layer3:
    # Compile (10m), then twelve independently bounded suites (5m each).
    timeout-minutes: 75
    needs: layer3-image-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      PLOYZ_TESTKIT_IMAGE: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: layer3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run informing suites with independent results
        run: bash scripts/run-layer3-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-test-logs
          path: target/layer3-logs
          retention-days: 7
          if-no-files-found: ignore

  layer3-manifest:
    needs: [layer3-image-amd64, layer3-image-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch manifest
        env:
          AMD64: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-amd64
          ARM64: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-arm64
          SHA: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}
          MAIN: ghcr.io/getployz/ployz2-testkit:main
        run: |
          docker buildx imagetools create -t "$SHA" "$AMD64" "$ARM64"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create -t "$MAIN" "$AMD64" "$ARM64"
          fi
          platforms=$(docker buildx imagetools inspect --raw "$SHA" | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | sort)
          test "$platforms" = $'linux/amd64\nlinux/arm64'
