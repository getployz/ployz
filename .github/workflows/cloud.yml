name: Cloud

on:
  pull_request:
    paths:
      - "cloud/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cloud.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cloud.yml"

defaults:
  run:
    working-directory: cloud

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Fork PRs have no credentials and use the action's GitHub cache fallback.
  KACHE_S3_BUCKET: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cloud/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: Install actionlint
        run: |
          scripts/install-actionlint.sh "$RUNNER_TEMP/ployz-tools"
          echo "$RUNNER_TEMP/ployz-tools" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: cloud-sdk-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-cloud-sdk
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          pr-comment: false
      - run: pnpm pr:check
        env:
          PLOYZ_TEST_ENV_FILE: .env.test
