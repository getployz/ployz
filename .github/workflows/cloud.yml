name: Cloud

on:
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        required: false
      KACHE_S3_READ_ACCESS_KEY_ID:
        required: false
      KACHE_S3_READ_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:

concurrency:
  group: cloud-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

defaults:
  run:
    working-directory: cloud

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only protected main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cloud
      - name: Typecheck
        run: pnpm pr:check typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm pr:check lint

  sdk:
    name: Prepare matching SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            crates/ployz-sdk/ployz-sdk.node
            crates/ployz-sdk/generated/config-wasm.mjs
          # No restore prefix: a binding from different source is not valid evidence.
          key: cloud-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', '!crates/*/tests/**', '!crates/ployzd/**', '!crates/ployz-testkit/**', 'scripts/build-cloud-sdk.sh', 'scripts/build-config-browser.sh', '.github/actions/setup-rust/action.yml') }}
      - uses: ./.github/actions/setup-rust
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          cache-key: cloud-sdk
      - uses: taiki-e/install-action@v2
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-bindgen@0.2.127
      - name: Build SDK when its inputs changed
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/pr-check.sh sdk
      - name: Verify native and browser config agree
        run: node ../crates/ployz-sdk/tests/config-contract.mjs
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
        with:
          path: |
            crates/ployz-sdk/ployz-sdk.node
            crates/ployz-sdk/generated/config-wasm.mjs
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-sdk
          path: |
            crates/ployz-sdk/ployz-sdk.node
            crates/ployz-sdk/generated/config-wasm.mjs
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build:
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cloud
      - uses: actions/download-artifact@v4
        with:
          name: cloud-sdk
          path: crates/ployz-sdk
      - name: Build and verify frontend package
        run: pnpm pr:check build

  test:
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cloud
      - uses: actions/download-artifact@v4
        with:
          name: cloud-sdk
          path: crates/ployz-sdk
      - name: Unit and PostgreSQL tests
        env:
          PLOYZ_TEST_ENV_FILE: .env.test
        run: pnpm test --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-test-results
          path: cloud/test-results
          retention-days: 7
          if-no-files-found: ignore
