name: Cloud

on:
  workflow_call:
    inputs:
      release-tag:
        description: Build this release tag and publish ghcr.io/getployz/ployz-cloud:<tag>
        type: string
        default: ''
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        required: false
      KACHE_S3_READ_ACCESS_KEY_ID:
        required: false
      KACHE_S3_READ_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:

concurrency:
  # Main groups by commit and never cancels a running main run here, though a newer run of the same commit can
  # replace one still waiting. Fast CI calls this workflow; its main runs finish once started, but a waiting one
  # can be replaced, so not every main commit leaves builds behind.
  group: cloud-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write

defaults:
  run:
    working-directory: dashboard

# CI does not use debugger symbols or per-checkout incremental compilation.
env:
  # Only main pushes receive write keys; all other runs use R2 read-only keys.
  # Missing credentials (including fork PRs) select the GitHub-cache fallback.
  KACHE_S3_BUCKET: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID) &&
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY) &&
        vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID || secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_SECRET_ACCESS_KEY || secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  # Without write keys a main push silently falls back to read keys, so setup-rust fails it instead.
  KACHE_S3_WRITES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KACHE_S3_ACCESS_KEY_ID != '' && secrets.KACHE_S3_SECRET_ACCESS_KEY != '' && vars.KACHE_S3_BUCKET != '' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # Every leg needs the SDK. The test suite is CPU-bound, so it splits across legs that each build or
  # download the SDK themselves; standard runners cost a public repo nothing, and the legs finish sooner
  # than one job running everything. Within a leg, later checks run after an earlier one fails.
  check:
    name: ${{ matrix.part == 'build' && 'Build' || format('Test {0}/3', matrix.part) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [build, '1', '2', '3']
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release-tag }}
      - name: Find an earlier build of these sources
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          EVENT: ${{ github.event_name }}
        # A release builds its own SDK rather than reuse one an earlier run uploaded.
        # A PR builds dev, so its upload takes a name no release lookup matches.
        run: |
          python3 ../core/scripts/artifacts.py lookup sdk --extra "features= profile=release" > "$RUNNER_TEMP/lookup.out"
          if [ -n "$RELEASE_TAG" ]; then sed -i 's/^run-id=.*/run-id=/' "$RUNNER_TEMP/lookup.out"; fi
          if [ "$EVENT" = pull_request ] && grep -qx 'run-id=' "$RUNNER_TEMP/lookup.out"; then sed -i 's/^name=.*/&-pr-dev/' "$RUNNER_TEMP/lookup.out"; fi
          cat "$RUNNER_TEMP/lookup.out" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-cloud
        with:
          package-cache: ${{ inputs.release-tag == '' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.lookup.outputs.run-id != ''
        with:
          name: ${{ steps.lookup.outputs.name }}
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: core/crates/ployz-sdk
      - uses: ./.github/actions/setup-rust
        if: steps.lookup.outputs.run-id == ''
        with:
          cache-key: cloud-sdk
          remote-cache: ${{ inputs.release-tag == '' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: steps.lookup.outputs.run-id == ''
        with:
          tool: wasm-bindgen@0.2.127
      # A PR only tests against its SDK, so it builds dev.
      - name: Build and test the SDK
        if: steps.lookup.outputs.run-id == ''
        env:
          PLOYZ_SDK_PROFILE: ${{ github.event_name == 'pull_request' && 'dev' || 'release' }}
        run: bash scripts/pr-check.sh sdk
      # Local verify runs download these too, so main keeps them longer. One leg uploads: a run's artifact names are unique.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.lookup.outputs.run-id == '' && matrix.part == 'build'
        with:
          name: ${{ steps.lookup.outputs.name }}
          path: |
            core/crates/ployz-sdk/ployz-sdk.node
            core/crates/ployz-sdk/generated/**
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: error
      # Runs only when every step above passed; each check below needs the SDK and nothing else before it.
      - name: SDK ready
        id: sdk
        run: test -f ../core/crates/ployz-sdk/ployz-sdk.node
      - name: Typecheck the SDK package
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && matrix.part == 'build' }}
        run: bash ../core/scripts/check-sdk-types.sh
      - name: Typecheck
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && matrix.part == 'build' }}
        run: pnpm pr:check typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && matrix.part == 'build' }}
        run: pnpm pr:check lint
      - name: Unit and PostgreSQL tests
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && matrix.part != 'build' }}
        env:
          PLOYZ_TEST_ENV_FILE: .env.test
        run: pnpm test --shard=${{ matrix.part }}/3 --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.part != 'build'
        with:
          name: cloud-test-results-${{ matrix.part }}
          path: dashboard/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Build and verify frontend package
        id: frontend
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && matrix.part == 'build' }}
        run: pnpm pr:check build
      # Last before publishing: pruning dev dependencies leaves the checks above unable to run.
      - name: Package and smoke-test runtime image
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          pnpm prune --prod
          docker build -f ../Dockerfile.cloud -t ployz-cloud:ci ..
          docker run --rm --entrypoint node ployz-cloud:ci -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const { parseServiceSetting } = require("@ployz/sdk/config");
            assert.equal(parseServiceSetting("source", { version: 1, type: "empty", rootDir: "/" }).type, "empty");
            assert.equal(typeof require("@ployz/sdk").openConfigStore, "function");
            for (const file of [".output/server/index.mjs", ".output/worker/index.mjs", "node_modules/drizzle-kit/bin.cjs"]) assert.ok(fs.existsSync(file), file);
            require.resolve("inngest/connect");
          '
      # The publish job pushes this exact image once every leg has passed.
      - name: Save the image for publishing
        if: matrix.part == 'build' && (inputs.release-tag != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          set -o pipefail
          docker save ployz-cloud:ci | zstd -T0 -3 > "$RUNNER_TEMP/ployz-cloud.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.part == 'build' && (inputs.release-tag != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          name: ployz-cloud-image
          path: ${{ runner.temp }}/ployz-cloud.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Railway's web and worker deploy a pinned ployz-cloud:<sha>, so every main commit publishes one.
  publish:
    name: Publish image
    needs: check
    if: inputs.release-tag != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ployz-cloud-image
          path: ${{ runner.temp }}
      - name: Push the tested image
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/getployz/ployz-cloud:${{ inputs.release-tag || github.sha }}
        run: |
          set -o pipefail
          zstd -dc ployz-cloud.tar.zst | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ployz-cloud:ci "$IMAGE"
          docker push "$IMAGE"
