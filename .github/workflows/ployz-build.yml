name: Ployz build
on:
  workflow_dispatch:
    inputs:
      build: { required: true, type: string }
      cloud: { required: true, type: string }
      runner: { required: false, type: string, default: ubuntu-latest }
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: getployz/build@6f3b5a76ad939acfb605ba4070916e827a13cf2a
        with:
          build: ${{ inputs.build }}
          cloud: ${{ inputs.cloud }}
