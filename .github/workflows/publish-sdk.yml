name: Publish SDK
run-name: Publish SDK ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose @ployz/sdk to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # Scheduled, release, and manual jobs only read the shared compiler cache.
  KACHE_S3_BUCKET: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID && secrets.KACHE_S3_READ_SECRET_ACCESS_KEY && vars.KACHE_S3_BUCKET || '' }}
  KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION || 'auto' }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_READ_ACCESS_KEY_ID }}
  KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_READ_SECRET_ACCESS_KEY }}
  ZIG_VERSION: 0.13.0
  CARGO_ZIGBUILD_VERSION: 0.19.7

permissions:
  contents: read
  id-token: write

jobs:
  build-binding:
    strategy:
      matrix:
        include:
          # zigbuild pins the glibc floor at 2.28 (Node 18's own floor) instead of inheriting
          # the runner's, and cross-links arm64 from the x64 runner. Apple targets link with
          # the macOS toolchain: zig 0.13 segfaults on them, same as the CLI's darwin build.
          - runner: ubuntu-latest
            command: zigbuild
            target: x86_64-unknown-linux-gnu
            glibc: ".2.28"
            cdylib: libployz_sdk.so
            binding: ployz-sdk.linux-x64.node
          - runner: ubuntu-latest
            command: zigbuild
            target: aarch64-unknown-linux-gnu
            glibc: ".2.28"
            cdylib: libployz_sdk.so
            binding: ployz-sdk.linux-arm64.node
          - runner: macos-14
            command: build
            target: aarch64-apple-darwin
            cdylib: libployz_sdk.dylib
            binding: ployz-sdk.darwin-arm64.node
          - runner: macos-14
            command: build
            target: x86_64-apple-darwin
            cdylib: libployz_sdk.dylib
            binding: ployz-sdk.darwin-x64.node
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/tailcat/go.mod
          cache-dependency-path: native/tailcat/go.sum
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        if: matrix.command == 'zigbuild'
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        if: matrix.command == 'zigbuild'
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: 0.18.0
          s3-bucket: ${{ env.KACHE_S3_BUCKET }}
          s3-region: ${{ env.KACHE_S3_REGION }}
          s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
          s3-prefix: ployz2/kache-v1
          manifest-key: sdk-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}
          cache-key-prefix: kache-sdk-${{ matrix.target }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: true
          cache-c-cpp: true
          warm: true
          sync: false
          save-cache: false
          pr-comment: false
      - run: cargo ${{ matrix.command }} -p ployz-sdk --release --locked --target ${{ matrix.target }}${{ matrix.glibc }}
      - run: cp "target/${{ matrix.target }}/release/${{ matrix.cdylib }}" "${{ matrix.binding }}"
      - name: Build matching Tailcat helper
        env:
          BINDING: ${{ matrix.binding }}
          PLOYZ_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          platform=${BINDING#ployz-sdk.}
          platform=${platform%.node}
          export GOOS=${platform%-*}
          export GOARCH=${platform#*-}
          [ "$GOARCH" != x64 ] || export GOARCH=amd64
          export CGO_ENABLED=0
          export PLOYZ_VERSION=${PLOYZ_VERSION#v}
          bash native/tailcat/build.sh "$PWD/ployz-tailcat.$platform"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binding }}
          path: |
            ${{ matrix.binding }}
            ployz-tailcat.*
          if-no-files-found: error

  publish-sdk:
    needs: build-binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: bindings
          merge-multiple: true
      - run: bash scripts/publish-sdk-package.sh "$RELEASE_TAG" bindings/*.node
