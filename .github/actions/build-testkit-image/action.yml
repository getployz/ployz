name: Build testkit image
description: Build and push one native Ployz testkit image

inputs:
  arch:
    description: Image architecture suffix (amd64 or arm64)
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        cache-key: testkit-release
    - name: Build host binaries
      shell: bash
      working-directory: core
      run: |
        cargo build --locked --release --package ployz --package ployzd
        install -D target/release/ployz crates/ployz-testkit/prebuilt/ployz
        install -D target/release/ployzd crates/ployz-testkit/prebuilt/ployzd
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ github.workspace }}/core
        file: core/crates/ployz-testkit/Dockerfile
        platforms: linux/${{ inputs.arch }}
        push: false
        load: true
        provenance: false
        tags: ghcr.io/getployz/ployz-testkit:${{ github.sha }}-${{ inputs.arch }}
        cache-from: type=registry,ref=ghcr.io/getployz/ployz-testkit:main
        cache-to: type=inline
    - name: Prime and push the native image
      shell: bash
      env:
        IMAGE: ghcr.io/getployz/ployz-testkit:${{ github.sha }}-${{ inputs.arch }}
      working-directory: core
      run: |
        bash scripts/prime-testkit-image.sh
        docker push "$IMAGE"
