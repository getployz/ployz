name: Build testkit image
description: Build and push one native Ployz testkit image

inputs:
  arch:
    description: Image architecture suffix (amd64 or arm64)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: crates/ployz/compose-helper/go.mod
        cache-dependency-path: crates/ployz/compose-helper/go.sum
    - uses: dtolnay/rust-toolchain@1.97.1
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
        key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-downloads-
    - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
      with:
        version: 0.18.0
        s3-bucket: ${{ env.KACHE_S3_BUCKET }}
        s3-region: ${{ env.KACHE_S3_REGION }}
        s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
        s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
        s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
        s3-prefix: ployz2/kache-v1
        manifest-key: testkit-release-${{ runner.os }}-${{ runner.arch }}
        cache-key-prefix: kache-testkit-release
        cache-dir: ${{ runner.temp }}/kache
        cache-executables: true
        cache-c-cpp: true
        warm: true
        sync: false
        pr-comment: false
    - name: Build host binaries
      shell: bash
      run: |
        cargo build --locked --release --package ployz --package ployzd
        install -D target/release/ployz crates/ployz-testkit/prebuilt/ployz
        install -D target/release/ployzd crates/ployz-testkit/prebuilt/ployzd
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ github.workspace }}
        file: crates/ployz-testkit/Dockerfile
        platforms: linux/${{ inputs.arch }}
        push: false
        load: true
        provenance: false
        tags: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-${{ inputs.arch }}
        cache-from: type=registry,ref=ghcr.io/getployz/ployz2-testkit:main
        cache-to: type=inline
    - name: Prime and push the native image
      shell: bash
      env:
        IMAGE: ghcr.io/getployz/ployz2-testkit:${{ github.sha }}-${{ inputs.arch }}
      run: |
        bash scripts/prime-testkit-image.sh
        docker push "$IMAGE"
