name: Prepare Rust build
description: Install the Rust toolchain and reuse the shared compiler cache
inputs:
  cache-key:
    description: Build workload whose manifest should be prefetched
    required: true
  components:
    description: Extra Rust components
    default: ''
  remote-cache:
    description: Restore the shared compiler and download caches; release builds pass false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: inputs.remote-cache == 'true'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
        key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-downloads-
    # Main pushes are the only cache writers, so a missing write path empties the cache silently.
    - name: Require compiler cache writes on main
      if: inputs.remote-cache == 'true' && github.repository == 'getployz/ployz' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        if [ "$KACHE_S3_WRITES" != true ]; then
          echo "::error::Main push has no R2 write credentials, so the compiler cache would not be saved."
          exit 1
        fi
    - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
      if: inputs.remote-cache == 'true'
      with:
        version: 0.18.0
        s3-bucket: ${{ env.KACHE_S3_BUCKET }}
        s3-region: ${{ env.KACHE_S3_REGION }}
        s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
        s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
        s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
        s3-prefix: ployz2/kache-v1
        manifest-key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}
        cache-key-prefix: kache-${{ inputs.cache-key }}
        cache-dir: ${{ runner.temp }}/kache
        cache-executables: true
        cache-c-cpp: true
        warm: true
        sync: false
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        pr-comment: false
