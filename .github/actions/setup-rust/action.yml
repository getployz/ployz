name: Prepare Rust build
description: Install the bundled Compose toolchain and reuse the shared compiler cache
inputs:
  cache-key:
    description: Build workload whose manifest should be prefetched
    required: true
  components:
    description: Extra Rust components
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: core/crates/ployz/compose-helper/go.mod
        cache-dependency-path: core/crates/ployz/compose-helper/go.sum
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: ${{ inputs.components }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
        key: cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-downloads-
    - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
      with:
        version: 0.18.0
        s3-bucket: ${{ env.KACHE_S3_BUCKET }}
        s3-region: ${{ env.KACHE_S3_REGION }}
        s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
        s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY_ID }}
        s3-secret-access-key: ${{ env.KACHE_S3_SECRET_ACCESS_KEY }}
        s3-prefix: ployz2/kache-v1
        manifest-key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}
        cache-key-prefix: kache-${{ inputs.cache-key }}
        cache-dir: ${{ runner.temp }}/kache
        cache-executables: true
        cache-c-cpp: true
        warm: true
        sync: false
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
        pr-comment: false
