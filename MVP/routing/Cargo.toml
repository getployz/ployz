[package]
name = "mvp-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_routing"
path = "src/lib.rs"

[dependencies]
mvp-bus = { path = "../bus" }
mvp-projection = { path = "../projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mvp-identity = { path = "../identity" }
