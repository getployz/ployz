[package]
name = "mvp-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_deploy"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
mvp-bus = { path = "../bus" }
mvp-projection = { path = "../projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
