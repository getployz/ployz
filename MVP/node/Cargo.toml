[package]
name = "mvp-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake3 = "1"
mvp-bus = { path = "../bus" }
mvp-deploy = { path = "../deploy" }
mvp-identity = { path = "../identity" }
mvp-mesh = { path = "../mesh" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
mvp-p2panda-transport = { path = "../p2panda-transport" }
mvp-projection = { path = "../projection" }
mvp-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
