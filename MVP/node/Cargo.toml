[package]
name = "mvp-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake3 = "1"
mvp-bus = { path = "../bus" }
mvp-deploy = { path = "../deploy" }
mvp-deploy-p2panda = { path = "../deploy-p2panda" }
mvp-identity = { path = "../identity" }
mvp-mesh = { path = "../mesh" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
mvp-p2panda-transport = { path = "../p2panda-transport" }
mvp-projection = { path = "../projection" }
mvp-runtime = { path = "../runtime" }
mvp-routing-p2panda = { path = "../routing-p2panda" }
mvp-serving = { path = "../serving" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
hickory-proto = { version = "=0.26.0-beta.4", default-features = false, features = ["std"] }
