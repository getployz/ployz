[package]
name = "mvp-serving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_serving"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
http-body-util = "0.1"
hickory-proto = { version = "=0.26.0-beta.4", default-features = false, features = ["std"] }
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
kameo = "0.20"
mvp-acme = { path = "../acme" }
mvp-bus = { path = "../bus" }
mvp-lease = { path = "../lease" }
mvp-projection = { path = "../projection" }
pingora = { version = "0.8", features = ["proxy"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
mvp-identity = { path = "../identity" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
