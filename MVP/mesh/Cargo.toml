[package]
name = "mvp-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
linux-wireguard = ["dep:defguard_wireguard_rs"]

[lib]
name = "mvp_mesh"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
kameo = "0.20"
mvp-bus = { path = "../bus" }
mvp-identity = { path = "../identity" }
mvp-projection = { path = "../projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
defguard_wireguard_rs = { version = "0.9.3", optional = true }
