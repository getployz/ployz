[package]
name = "mvp-acme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_acme"
path = "src/lib.rs"

[features]
harness = ["mvp-lease/harness"]

[dependencies]
async-trait = "0.1"
mvp-identity = { path = "../identity" }
mvp-lease = { path = "../lease" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"

[dev-dependencies]
mvp-lease = { path = "../lease", features = ["harness"] }
serde_json = "1"
