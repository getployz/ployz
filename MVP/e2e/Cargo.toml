[package]
name = "mvp-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-util = "0.3"
hdrhistogram = "7"
hickory-proto = { version = "=0.26.0-beta.4", default-features = false, features = ["std"] }
memory-stats = "1"
mvp-bus = { path = "../bus" }
mvp-deploy = { path = "../deploy" }
mvp-identity = { path = "../identity" }
mvp-iroh = { path = "../iroh" }
mvp-acme = { path = "../acme", features = ["harness"] }
mvp-lease = { path = "../lease", features = ["harness"] }
mvp-machine = { path = "../machine" }
mvp-mesh = { path = "../mesh" }
mvp-p2panda-facts = { path = "../p2panda-facts", features = ["harness"] }
mvp-projection = { path = "../projection" }
mvp-routing = { path = "../routing" }
mvp-serving = { path = "../serving" }
p2panda-core-git = { package = "p2panda-core", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6", features = ["test_utils"] }
p2panda-store-git = { package = "p2panda-store", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6", features = ["sqlite", "macros", "test_utils"] }
p2panda-sync-git = { package = "p2panda-sync", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
