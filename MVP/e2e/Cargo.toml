[package]
name = "mvp-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-util = "0.3"
hdrhistogram = "7"
hickory-proto = { version = "=0.26.0-beta.4", default-features = false, features = ["std"] }
memory-stats = "1"
mvp-bus = { path = "../bus" }
mvp-deploy = { path = "../deploy" }
mvp-identity = { path = "../identity" }
mvp-iroh = { path = "../iroh" }
mvp-acme = { path = "../acme", features = ["harness"] }
mvp-acme-command = { path = "../acme-command" }
mvp-lease = { path = "../lease", features = ["harness"] }
mvp-machine = { path = "../machine" }
mvp-mesh = { path = "../mesh" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
mvp-p2panda-transport = { path = "../p2panda-transport" }
mvp-projection = { path = "../projection" }
mvp-routing = { path = "../routing" }
mvp-serving = { path = "../serving" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
