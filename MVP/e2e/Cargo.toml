[package]
name = "mvp-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hdrhistogram = "7"
memory-stats = "1"
mvp-bus = { path = "../bus" }
mvp-deploy = { path = "../deploy" }
mvp-iroh = { path = "../iroh" }
mvp-acme = { path = "../acme", features = ["harness"] }
mvp-lease = { path = "../lease", features = ["harness"] }
mvp-projection = { path = "../projection" }
mvp-serving = { path = "../serving" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
