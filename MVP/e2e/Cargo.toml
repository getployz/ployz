[package]
name = "mvp-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hdrhistogram = "7"
memory-stats = "1"
mvp-bus = { path = "../bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
