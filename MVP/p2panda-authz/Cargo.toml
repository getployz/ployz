[package]
name = "mvp-p2panda-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_p2panda_authz"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
mvp-bus = { path = "../bus" }
p2panda-auth = { version = "0.6.0", features = ["serde", "test_utils"] }
p2panda-core = "0.6.0"
p2panda-store = { version = "0.6.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
p2panda-core = { version = "0.6.0", features = ["test_utils"] }
p2panda-store = { version = "0.6.0", features = ["sqlite", "test_utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
