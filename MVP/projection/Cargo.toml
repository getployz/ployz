[package]
name = "mvp-projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mvp_projection"
path = "src/lib.rs"

[dependencies]
kameo = "0.20"
mvp-acme = { path = "../acme" }
mvp-bus = { path = "../bus" }
mvp-identity = { path = "../identity" }
mvp-lease = { path = "../lease" }
rusqlite = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
