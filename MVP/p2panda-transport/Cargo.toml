[package]
name = "mvp-p2panda-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
harness = []

[dependencies]
futures-util = "0.3"
mvp-bus = { path = "../bus" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
p2panda-core-git = { package = "p2panda-core", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
p2panda-store-git = { package = "p2panda-store", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6", features = ["sqlite", "macros"] }
p2panda-sync-git = { package = "p2panda-sync", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = "0.1"
