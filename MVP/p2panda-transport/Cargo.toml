[package]
name = "mvp-p2panda-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
harness = []

[dependencies]
futures-util = "0.3"
mvp-bus = { path = "../bus" }
mvp-p2panda-facts = { path = "../p2panda-facts" }
p2panda-core = "0.6.0"
p2panda-net = "0.6.0"
p2panda-store = "0.6.0"
p2panda-sync = "0.6.0"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = "0.1"
