[package]
name = "mvp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
docker = ["dep:bollard", "dep:futures-util", "dep:tokio"]

[dependencies]
bollard = { version = "0.20.1", optional = true }
futures-util = { version = "0.3", optional = true }
mvp-deploy = { path = "../deploy" }
mvp-identity = { path = "../identity" }
mvp-projection = { path = "../projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"], optional = true }

[dev-dependencies]
