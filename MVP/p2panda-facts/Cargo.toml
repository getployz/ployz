[package]
name = "mvp-p2panda-facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mvp-bus = { path = "../bus" }
mvp-projection = { path = "../projection" }
p2panda-core = "0.5.2"
p2panda-store = { version = "0.5.2", features = ["sqlite"] }
p2panda-stream = "0.5.2"
p2panda-sync = "0.5.2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
p2panda-core-git = { package = "p2panda-core", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6", features = ["test_utils"] }
p2panda-store-git = { package = "p2panda-store", git = "https://github.com/p2panda/p2panda", rev = "f1087d347cded5912fd9c357066d4ebf2f91cac6", features = ["sqlite", "macros", "test_utils"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
