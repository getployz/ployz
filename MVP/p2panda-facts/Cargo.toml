[package]
name = "mvp-p2panda-facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mvp-bus = { path = "../bus" }
mvp-p2panda-authz = { path = "../p2panda-authz" }
mvp-projection = { path = "../projection" }
p2panda-core = "0.6.0"
p2panda-store = { version = "0.6.0", features = ["sqlite"] }
p2panda-stream = "0.6.0"
p2panda-sync = "0.6.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
